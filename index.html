<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ngantor - Kurir Paket</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #87CEEB; touch-action: none; }
        canvas { display: block; }
        
        /* UI Styling */
        #ui-container { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        #title { color: #FFB347; font-size: 40px; font-weight: 900; text-shadow: 2px 2px 0 #fff; margin: 0; }
        .hud-text { color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #333; margin-top: 10px; }
        
        /* Tombol Kontrol */
        #controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .btn { pointer-events: auto; padding: 15px 30px; font-size: 24px; font-weight: bold; background: #FFB347; border: 3px solid #fff; border-radius: 12px; color: white; cursor: pointer; box-shadow: 0 5px 0 #cc8400; user-select: none; }
        .btn:active { transform: translateY(5px); box-shadow: none; }
    </style>
</head>
<body>
    <div id="ui-container">
        <h1 id="title">Ngantor</h1>
        <div class="hud-text">Skor: <span id="score">0</span></div>
        <div class="hud-text" style="color: #FFD700;">📦 Paket: <span id="package-count">0</span></div>
    </div>
    
    <div id="controls">
        <button id="btn-left" class="btn">⬅️ KIRI</button>
        <button id="btn-right" class="btn">KANAN ➡️</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);
        camera.lookAt(0, 0, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Ground & Road
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x7CFC00 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 200), new THREE.MeshStandardMaterial({ color: 0x444444 }));
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        // Variables
        let speed = 0.6;
        let score = 0;
        let packageScore = 0;
        let obstacles = [];
        let packages = [];
        let scenery = [];
        let playerTargetX = 0;
        let isGameOver = false;

        let playerModel;
        let mixer; 
        const clock = new THREE.Clock();

        // Load 3D Model
        const loader = new THREE.GLTFLoader();
        loader.load('player.gltf', function(gltf) {
            playerModel = gltf.scene;
            playerModel.scale.set(1.5, 1.5, 1.5); 
            playerModel.rotation.y = Math.PI; 
            playerModel.position.set(0, 0, 0);
            
            playerModel.traverse(function(node) {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });
            scene.add(playerModel);

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(playerModel);
                mixer.clipAction(gltf.animations[0]).play();
            }
        });

        // KONTROL: Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && playerTargetX > -4) playerTargetX -= 4;
            if (e.key === 'ArrowRight' && playerTargetX < 4) playerTargetX += 4;
        });

        // KONTROL: Tombol HP (PointerDown support Mouse & Touch)
        document.getElementById('btn-left').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (playerTargetX > -4) playerTargetX -= 4;
        });
        document.getElementById('btn-right').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (playerTargetX < 4) playerTargetX += 4;
        });

        // SPAWNER
        function spawnScenery() {
            const geo = new THREE.ConeGeometry(1.5, 4, 4);
            const mat = new THREE.MeshStandardMaterial({ color: 0x228b22, flatShading: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random() > 0.5 ? 1 : -1) * (Math.random() * 15 + 8), 2, -120);
            scene.add(mesh);
            scenery.push(mesh);
        }

        function spawnObstacle() {
            const geo = new THREE.BoxGeometry(2.5, 2, 4);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff3333 }); // Mobil Merah
            const obstacle = new THREE.Mesh(geo, mat);
            obstacle.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 1, -120);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function spawnPackage() {
            const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const mat = new THREE.MeshStandardMaterial({ color: 0xCD853F }); // Kardus Coklat
            const pkg = new THREE.Mesh(geo, mat);
            pkg.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 1, -120);
            scene.add(pkg);
            packages.push(pkg);
        }

        let frameCount = 0;

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (mixer) mixer.update(delta);
            if (playerModel) {
                playerModel.position.x += (playerTargetX - playerModel.position.x) * 0.15;
            }

            frameCount++;
            if (frameCount % 10 === 0) spawnScenery();
            
            // Atur agar rintangan dan paket tidak spawn bersamaan di frame yang sama
            if (frameCount % 60 === 0) spawnObstacle();
            if (frameCount % 100 === 0) spawnPackage();

            // Gerakkan Scenery
            for (let i = scenery.length - 1; i >= 0; i--) {
                scenery[i].position.z += speed;
                if (scenery[i].position.z > 20) { scene.remove(scenery[i]); scenery.splice(i, 1); }
            }

            // Gerakkan Paket (Collectible)
            for (let i = packages.length - 1; i >= 0; i--) {
                let pkg = packages[i];
                pkg.position.z += speed;
                pkg.rotation.x += 0.05; // Animasi paket berputar
                pkg.rotation.y += 0.05;

                if (playerModel) {
                    if (Math.abs(pkg.position.z - playerModel.position.z) < 2 && Math.abs(pkg.position.x - playerModel.position.x) < 2) {
                        // Paket Diambil
                        packageScore++;
                        score += 500; // Poin bonus
                        document.getElementById('package-count').innerText = packageScore;
                        scene.remove(pkg);
                        packages.splice(i, 1);
                        continue;
                    }
                }
                if (pkg.position.z > 20) { scene.remove(pkg); packages.splice(i, 1); }
            }

            // Gerakkan Rintangan (Mobil)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;

                if (playerModel) {
                    if (Math.abs(obs.position.z - playerModel.position.z) < 3 && Math.abs(obs.position.x - playerModel.position.x) < 2) {
                        isGameOver = true;
                        alert("Nabrak! Total Paket: " + packageScore + "\nRefresh halaman untuk main lagi.");
                    }
                }
                if (obs.position.z > 20) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            score += 1;
            document.getElementById('score').innerText = Math.floor(score / 10);
            speed += 0.0002; 

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
