<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Road Trip - Perfect Biomes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Nunito', sans-serif; 
            background-color: #5DADE2; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation; 
            width: 100vw; height: 100dvh;
        }
        canvas { display: block; width: 100vw; height: 100dvh; }
        
        /* UI HUD */
        #ui-container { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 100; display: none; }
        #title { color: #FF9800; font-size: 40px; font-weight: 900; text-shadow: 2px 2px 0 #FFF, -1px -1px 0 #FFF, 1px -1px 0 #FFF, -1px 1px 0 #FFF, 0px 6px 12px rgba(0,0,0,0.25); margin: 0; letter-spacing: 2px; }
        .hud-card { display: inline-block; background: rgba(255, 255, 255, 0.45); padding: 8px 24px; border-radius: 30px; margin: 4px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 6px 15px rgba(0,0,0,0.1); transition: transform 0.1s; }
        .hud-text { color: #333; font-size: 20px; font-weight: 900; text-shadow: 1px 1px 0 #fff; }
        
        #combo-container { position: absolute; top: 90px; right: 25px; font-size: 34px; font-weight: 900; color: #ffeb3b; text-shadow: 2px 2px 0 #e65100, -1px -1px 0 #e65100, 1px -1px 0 #e65100, -1px 1px 0 #e65100; opacity: 0; transition: opacity 0.3s, transform 0.1s; z-index: 100;}
        
        /* Floating Score */
        .floating-score { position: absolute; font-size: 36px; font-weight: 900; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; z-index: 500; pointer-events: none; animation: floatUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: translateX(-50%); }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; } 50% { transform: translate(-50%, -60px) scale(1.3); opacity: 1; } 100% { transform: translate(-50%, -100px) scale(1); opacity: 0; } }

        /* Kontrol */
        #controls { position: absolute; bottom: 30px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 25px; z-index: 1000; }
        .btn { pointer-events: auto; width: 42vw; max-width: 160px; padding: 18px 0; font-size: 22px; font-weight: 900; background: linear-gradient(to bottom, #FFB347, #FF9800); border: 4px solid #ffffff; border-radius: 25px; color: white; cursor: pointer; text-align: center; box-shadow: 0 8px 0 #c27600, 0 15px 20px rgba(0,0,0,0.25); text-transform: uppercase; transition: transform 0.1s; }
        .btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #c27600; }

        /* Layar Utama */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #a1c4fd, #c2e9fb); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        #loading-container { width: 80%; max-width: 350px; height: 25px; background: rgba(255,255,255,0.4); border-radius: 15px; border: 3px solid #fff; margin-top: 30px; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        #loading-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #FFC107, #FF9800); transition: width 0.3s ease; }
        #loading-text { color: #555; font-size: 18px; font-weight: bold; margin-top: 10px; text-shadow: 1px 1px 0 #fff; }
        #start-btn { display: none; padding: 18px 60px; font-size: 32px; font-weight: 900; background: linear-gradient(to bottom, #66bb6a, #43a047); border: 5px solid #fff; border-radius: 35px; color: white; cursor: pointer; box-shadow: 0 10px 0 #2E7D32, 0 15px 30px rgba(0,0,0,0.3); animation: pulse 1.5s infinite; margin-top: 30px;}
        
        /* Layar Game Over */
        #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; }
        .modal-card { background: rgba(255, 255, 255, 0.9); padding: 35px 25px; border-radius: 35px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border: 3px solid #fff; width: 85%; max-width: 380px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .modal-card h2 { color: #e53935; font-size: 40px; margin: 0 0 5px 0; text-shadow: 2px 2px 0 #fff; }
        .modal-card p { font-size: 20px; color: #555; margin-bottom: 25px; font-weight: 800; }
        .stats-grid { display: flex; justify-content: space-between; margin-bottom: 30px; background: rgba(236, 240, 241, 0.8); padding: 15px 20px; border-radius: 20px; border: 2px solid #fff; box-shadow: inset 0 3px 6px rgba(0,0,0,0.05); }
        .stats-grid div { font-size: 16px; color: #7f8c8d; font-weight: 800; width: 50%; }
        .stats-grid span { display: block; font-size: 32px; color: #2c3e50; margin-top: 5px; }
        #restart-btn { width: 100%; max-width: 100%; margin-top: 10px; background: linear-gradient(to bottom, #4fc3f7, #0288d1); box-shadow: 0 8px 0 #01579b, 0 15px 20px rgba(0,0,0,0.25); }
        #restart-btn:active { box-shadow: 0 0px 0 #01579b; transform: translateY(8px); }

        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 30%, rgba(255,0,0,0.5) 100%); opacity: 0; z-index: 2500; pointer-events: none; transition: opacity 0.2s; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes popIn { 0% { transform: scale(0.7) translateY(30px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3" type="audio/mpeg">
    </audio>

    <div id="damage-flash"></div>

    <div id="start-screen">
        <h1 style="color:#FFC107; font-size: 55px; text-shadow: 4px 4px 0 #fff; margin: 0; text-align: center; line-height: 1.1;">ROAD TRIP<br><span style="font-size: 30px; color: #FF9800;">Epic Biomes</span></h1>
        <p style="color: #444; font-size: 16px; font-weight: bold; margin-top: 15px; text-align: center;">Rider Fixed & Original Scale Restored!</p>
        
        <div id="loading-container"><div id="loading-bar"></div></div>
        <div id="loading-text">Memuat Dunia Magis... 0%</div>
        <button id="start-btn">RIDE NOW</button>
    </div>

    <div id="game-over-screen">
        <div class="modal-card">
            <h2>💥 CRASH!</h2>
            <p id="end-message">Aduh! Nabrak!</p>
            <div class="stats-grid">
                <div style="border-right: 2px solid #ddd;">📦 Paket<br><span id="end-packages">0</span></div>
                <div>⭐ Skor<br><span id="end-score">0</span></div>
            </div>
            <button id="restart-btn" class="btn">MAIN LAGI 🔄</button>
        </div>
    </div>

    <div id="ui-container">
        <div class="hud-card" id="score-card"><span class="hud-text">⭐ Skor: <span id="score" style="color:#FF5722;">0</span></span></div>
        <div class="hud-card"><span class="hud-text">📦 Paket: <span id="package-count" style="color:#4CAF50;">0</span></span></div>
    </div>
    <div id="combo-container">x<span id="combo-text">1</span> COMBO!</div>
    
    <div id="controls">
        <button id="btn-left" class="btn">⬅️ KIRI</button>
        <button id="btn-right" class="btn">KANAN ➡️</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // ==========================================
        // 0. OFFLINE CACHE SYSTEM (v8)
        // ==========================================
        async function setupOfflineCache() {
            if ('caches' in window) {
                try {
                    const cache = await caches.open('road-trip-assets-v8');
                    const urlsToCache = [
                        'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
                        'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js',
                        'https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3',
                        'Ngantor rider.glb'
                    ];
                    urlsToCache.forEach(async (url) => {
                        const response = await caches.match(url);
                        if (!response) { try { await cache.add(url); } catch (e) {} }
                    });
                } catch (err) {}
            }
        }
        setupOfflineCache();

        // ==========================================
        // 1. CURVED WORLD SHADER
        // ==========================================
        const curveUniforms = { curveX: { value: 0.0 }, curveY: { value: 0.0012 } };

        function applyCurvedWorld(material) {
            material.onBeforeCompile = (shader) => {
                shader.uniforms.curveX = curveUniforms.curveX;
                shader.uniforms.curveY = curveUniforms.curveY;
                shader.vertexShader = `uniform float curveX;\nuniform float curveY;\n` + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <project_vertex>',
                    `vec4 mvPosition = vec4( transformed, 1.0 );
                    #ifdef USE_INSTANCING
                        mvPosition = instanceMatrix * mvPosition;
                    #endif
                    mvPosition = modelViewMatrix * mvPosition;
                    float zDist = max(0.0, -mvPosition.z);
                    mvPosition.y -= curveY * zDist * zDist;
                    mvPosition.x -= curveX * zDist * zDist;
                    gl_Position = projectionMatrix * mvPosition;`
                );
            };
            return material;
        }

        function createGlowTexture(color1, color2, color3) {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d'); const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, color1); gradient.addColorStop(0.3, color2); gradient.addColorStop(1, color3);
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(canvas);
        }
        const sunGlowTex = createGlowTexture('rgba(255, 255, 255, 1)', 'rgba(255, 240, 180, 0.6)', 'rgba(255, 200, 100, 0)');
        const headlightTex = createGlowTexture('rgba(255, 255, 255, 0.8)', 'rgba(255, 255, 255, 0.2)', 'rgba(255, 255, 255, 0)');
        
        function createCoinTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffb300'; ctx.fillRect(0, 0, 256, 256);
            ctx.beginPath(); ctx.arc(128, 128, 110, 0, 2 * Math.PI); ctx.lineWidth = 15; ctx.strokeStyle = '#ffa000'; ctx.stroke();
            ctx.fillStyle = '#fff8e1'; ctx.font = 'bold 150px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⭐', 128, 140);
            return new THREE.CanvasTexture(canvas);
        }
        const coinTex = createCoinTexture();

        // ==========================================
        // 2. AUDIO & SFX
        // ==========================================
        let audioCtx, engineOsc, engineGain;
        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                document.getElementById('bgm').volume = 0.25; document.getElementById('bgm').play().catch(()=>{});
                engineOsc = audioCtx.createOscillator(); const filter = audioCtx.createBiquadFilter(); engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(220, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
                engineOsc.start();
            } catch(e) {}
        }

        function playSfx(type) {
            if(!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'coin') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'jump') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch(e) {}
        }

        // ==========================================
        // 3. SCENE & CAMERA (ORIGINAL SCALE)
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x5DADE2, 50, 180); 
        
        // Kamera kembali ke posisi asli agar pemandangan luas & responsive
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5.5, 11); camera.lookAt(0, 1, -15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x405060, 0.5); scene.add(hemiLight);
        
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.4); 
        sunLight.position.set(-45, 45, 10); sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 180;
        sunLight.shadow.camera.left = -50; sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50; sunLight.shadow.camera.bottom = -50;
        scene.add(sunLight);

        const sunMat = new THREE.MeshBasicMaterial({ map: sunGlowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
        const sunMesh = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), sunMat);
        scene.add(sunMesh);

        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 500; const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 400; }
        for(let i = 1; i < starsCount * 3; i+=3) { posArray[i] = Math.random() * 150 + 30; } 
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 1.5, transparent: true, opacity: 0});
        const starMesh = new THREE.Points(starsGeo, starsMat); scene.add(starMesh);

        // ==========================================
        // 4. TERRAIN & OCEAN
        // ==========================================
        const grassGroundMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x2E4F2A, flatShading: true, roughness: 0.9 }));
        const grassGround = new THREE.Mesh(new THREE.PlaneGeometry(240, 400, 1, 100), grassGroundMat);
        grassGround.rotation.x = -Math.PI / 2; grassGround.position.set(0, 0, 0); 
        grassGround.receiveShadow = true; scene.add(grassGround);

        const oceanGeo = new THREE.PlaneGeometry(120, 400, 20, 100);
        const oceanSea = new THREE.Mesh(oceanGeo, applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x29B6F6, flatShading: true, roughness: 0.1, metalness: 0.5 })));
        oceanSea.rotation.x = -Math.PI / 2; 
        oceanSea.position.set(180, -0.6, 0); 
        scene.add(oceanSea);

        // Jalan Lebar (Original Scale 12)
        const roadMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.8 }));
        const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 400, 1, 100), roadMat);
        road.rotation.x = -Math.PI / 2; road.position.set(0, 0.02, 0); road.receiveShadow = true; scene.add(road);

        const curbMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0xd9d9d9, roughness: 0.8 }));
        for (let side of [-6.2, 6.2]) {
            const curb = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 400, 1, 1, 100), curbMat);
            curb.position.set(side, 0.1, 0); curb.receiveShadow = true; curb.castShadow = true; scene.add(curb);
        }
        
        let lines = [];
        const lineMat = applyCurvedWorld(new THREE.MeshBasicMaterial({ color: 0xffb300 }));
        for (let laneX of [-2, 2]) {
            for (let z = -150; z < 50; z += 15) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 6), lineMat);
                line.rotation.x = -Math.PI / 2; line.position.set(laneX, 0.03, z); scene.add(line); lines.push(line);
            }
        }

        // ==========================================
        // 5. ENHANCED 3D MODELS
        // ==========================================
        function createMesh(geo, matOptions, isBasic = false) {
            const mat = isBasic ? new THREE.MeshBasicMaterial(matOptions) : new THREE.MeshStandardMaterial(matOptions);
            return new THREE.Mesh(geo, applyCurvedWorld(mat));
        }

        let mountains = [];
        function spawnMountain(side) {
            const group = new THREE.Group();
            const height = Math.random() * 50 + 60; 
            const radius = Math.random() * 25 + 30; 
            
            const base = createMesh(new THREE.ConeGeometry(radius, height, 7), { color: 0x2E7D32, flatShading: true, roughness: 0.9 });
            base.position.y = height / 2; base.castShadow = true; group.add(base);
            const snow = createMesh(new THREE.ConeGeometry(radius * 0.45, height * 0.4, 7), { color: 0xffffff, flatShading: true, roughness: 0.9 });
            snow.position.y = height * 0.8; group.add(snow);
            
            // X Minimum 65 - Jarak AMAN agar tidak memotong jalan raya
            const posX = side * (Math.random() * 25 + 75);
            group.position.set(posX, -5, -260); 
            scene.add(group); mountains.push(group);
        }

        let clouds = [];
        function createCloud() {
            const cloudGroup = new THREE.Group();
            for (let i = 0; i < 4; i++) {
                const mesh = createMesh(new THREE.DodecahedronGeometry(Math.random() * 2 + 1.5, 0), { color: 0xffffff, flatShading: true, emissive: 0x111111 });
                mesh.position.set(i * 1.5, Math.random() * 0.8, Math.random() * 0.8); cloudGroup.add(mesh);
            }
            cloudGroup.position.set((Math.random() > 0.5 ? 1 : -1) * (Math.random() * 40 + 10), Math.random() * 10 + 25, -180);
            scene.add(cloudGroup); clouds.push(cloudGroup);
        }

        const pineColors = [0x2E7D32, 0x388E3C, 0x1B5E20];
        const roundColors = [0x66BB6A, 0x4CAF50, 0x81C784];

        function createTree(type) {
            const group = new THREE.Group();
            const trunk = createMesh(new THREE.CylinderGeometry(0.3, 0.5, 2, 5), { color: 0x4e342e, flatShading: true });
            trunk.position.y = 1; trunk.castShadow = true; trunk.receiveShadow = true; group.add(trunk);
            if (type === 'pine') {
                let yPos = 2.2; let rad = 2.4; let cHex = pineColors[Math.floor(Math.random()*pineColors.length)];
                for(let i=0; i<3; i++) { const c = createMesh(new THREE.ConeGeometry(rad, 2.8, 6), { color: cHex, flatShading: true }); c.position.y = yPos; c.rotation.y = Math.random(); c.castShadow = true; group.add(c); yPos += 1.3; rad -= 0.6; }
            } else if (type === 'round') {
                let cHex = roundColors[Math.floor(Math.random()*roundColors.length)];
                const top = createMesh(new THREE.IcosahedronGeometry(2.4, 0), { color: cHex, flatShading: true }); top.position.y = 3.5; top.castShadow = true; group.add(top);
            }
            return group;
        }

        function createPalmTree() {
            const group = new THREE.Group();
            const trunkMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x6d4c41, flatShading: true }));
            const leafMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x43a047, flatShading: true }));
            for(let i=0; i<6; i++) { const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.35 - i*0.04, 0.4 - i*0.04, 1, 6), trunkMat); seg.position.set(i*0.15, i*0.9 + 0.5, 0); seg.rotation.z = -0.15; seg.castShadow = true; group.add(seg); }
            for(let a=0; a<5; a++) { const leaf = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.1, 1.0), leafMat); leaf.position.set(0.8, 5.5, 0); leaf.rotation.y = (a * Math.PI / 2.5); leaf.rotation.z = -0.4; leaf.castShadow = true; group.add(leaf); }
            return group;
        }

        function spawnTreeline(side, zOffset) {
            const clump = new THREE.Group();
            const numTrees = Math.floor(Math.random() * 3) + 2; 
            for(let i=0; i<numTrees; i++) {
                let tree;
                if (currentBiome === 0) tree = createTree('pine');
                else if (currentBiome === 1) tree = createTree('round');
                else tree = createPalmTree();

                tree.position.set((Math.random()-0.5)*8, 0, (Math.random()-0.5)*8);
                tree.scale.setScalar(0.8 + Math.random()*0.4);
                clump.add(tree);
            }
            // Clump diletakkan agak jauh ke belakang pinggir jalan
            const posX = side * (Math.random() * 15 + 25);
            clump.position.set(posX, 0, -220 + zOffset);
            clump.scale.setScalar(0.1); clump.userData.targetScale = 1; scene.add(clump); scenery.push(clump);
        }

        function createLog() { const log = createMesh(new THREE.CylinderGeometry(0.4, 0.4, 3, 6), { color: 0x5d4037, flatShading: true }); log.rotation.z = Math.PI/2; log.rotation.y = Math.random(); log.position.y = 0.2; log.castShadow = true; return log; }

        // ==========================================
        // 6. PLAYER, MANAGER & CONTROLS
        // ==========================================
        let speed = 0.65; let score = 0; let packageCount = 0;
        let combo = 1; let comboTimer = 0; 
        let obstacles = []; let packages = []; let scenery = []; let particles = []; let smokeParticles = [];
        let playerTargetX = 0; let isGameOver = false; let gameStarted = false; 
        
        let currentBiome = 0; 
        const targetGroundColor = new THREE.Color(0x2E4F2A); 
        let playerVelocityY = 0; let isJumping = false; const gravity = -0.015;
        let dayTime = Math.PI / 2; let isNight = false; let cameraShake = 0;

        let playerGroup = new THREE.Group(); scene.add(playerGroup);
        const playerAmbientLight = new THREE.PointLight(0xfffaed, 0, 8); playerAmbientLight.position.set(0, 3, 0); playerGroup.add(playerAmbientLight);
        const playerHeadLight = new THREE.SpotLight(0xfffaed, 0, 45, Math.PI/4, 0.5, 1);
        playerHeadLight.position.set(0, 1.5, 0); playerHeadLight.target.position.set(0, 0, -15);
        playerGroup.add(playerHeadLight); playerGroup.add(playerHeadLight.target);

        let playerModel; let mixer; const clock = new THREE.Clock();

        const manager = new THREE.LoadingManager();
        manager.onProgress = function (url, itemsLoaded, itemsTotal) {
            const progress = (itemsLoaded / itemsTotal) * 100;
            document.getElementById('loading-bar').style.width = progress + '%';
            document.getElementById('loading-text').innerText = 'Memuat Dunia Magis... ' + Math.floor(progress) + '%';
        };
        manager.onLoad = function () {
            document.getElementById('loading-container').style.display = 'none';
            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('start-btn').style.display = 'block';
            renderer.render(scene, camera); 
        };

        const loader = new THREE.GLTFLoader(manager);
        loader.load('Ngantor rider.glb', function(gltf) {
            playerModel = gltf.scene; 
            playerModel.rotation.y = Math.PI;
            
            // ANTI CULLING - Agar tulang mesh tidak disembunyikan saat dekat kamera
            playerModel.traverse(n => { 
                if (n.isMesh) { 
                    n.castShadow = true; 
                    n.receiveShadow = true; 
                    n.frustumCulled = false; 
                } 
            });
            
            // MENGGUNAKAN WRAPPER UNTUK SCALE (Agar tidak memecah animasi bawaan glb)
            const wrapper = new THREE.Group();
            wrapper.scale.set(2.4, 2.4, 2.4); 
            wrapper.add(playerModel);
            playerGroup.add(wrapper);
            
            try { 
                const box = new THREE.Box3().setFromObject(playerModel); 
                playerModel.position.y = -box.min.y; 
            } catch(e) { playerModel.position.y = 0; }
            
            if (gltf.animations.length > 0) { 
                mixer = new THREE.AnimationMixer(playerModel); 
                gltf.animations.forEach(clip => mixer.clipAction(clip).play()); 
            }
        });

        // Kontrol jalan kembali ke lebar normal (-4, 0, 4)
        function moveLeft() { if(playerTargetX > -4 && !isJumping) playerTargetX -= 4; }
        function moveRight() { if(playerTargetX < 4 && !isJumping) playerTargetX += 4; }
        window.addEventListener('keydown', (e) => { if(e.key==='ArrowLeft'||e.key==='a') moveLeft(); if(e.key==='ArrowRight'||e.key==='d') moveRight(); });
        document.getElementById('btn-left').addEventListener('touchstart', (e)=>{e.preventDefault(); moveLeft();}, {passive:false});
        document.getElementById('btn-left').addEventListener('mousedown', (e)=>{e.preventDefault(); moveLeft();});
        document.getElementById('btn-right').addEventListener('touchstart', (e)=>{e.preventDefault(); moveRight();}, {passive:false});
        document.getElementById('btn-right').addEventListener('mousedown', (e)=>{e.preventDefault(); moveRight();});
        
        document.getElementById('restart-btn').addEventListener('click', () => { location.reload(); });
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block'; document.getElementById('controls').style.display = 'flex';
            initAudio(); clock.start(); gameStarted = true; animate();
        });

        function showFloatingScore(text, color) {
            const floatText = document.createElement('div'); floatText.className = 'floating-score'; floatText.innerText = text; floatText.style.color = color || '#FFC107';
            floatText.style.left = '50%'; floatText.style.top = '30%'; document.body.appendChild(floatText); setTimeout(() => floatText.remove(), 1000);
            const scoreCard = document.getElementById('score-card');
            scoreCard.style.transform = 'scale(1.1)'; setTimeout(()=> scoreCard.style.transform = 'scale(1)', 100);
        }

        function createExplosion(x, y, z, colorHex) {
            const mat = applyCurvedWorld(new THREE.MeshBasicMaterial({color: colorHex}));
            for(let i=0; i<12; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mat);
                const angle = Math.random() * Math.PI * 2; const spd = Math.random() * 0.4 + 0.2;
                p.position.set(x, y, z); p.userData = { vx: Math.cos(angle)*spd, vy: Math.random()*0.5 + 0.2, vz: Math.sin(angle)*spd, life: 1 };
                scene.add(p); particles.push(p);
            }
        }

        // ==========================================
        // 7. GAME LOOP & STRICT BIOMES
        // ==========================================
        const lerp = (a, b, t) => a + (b - a) * t; 
        let frameCount = 0;

        function spawnDenseScenery(side, zOffset) {
            const rand = Math.random(); let obj;
            
            if (currentBiome === 0) { 
                // Bioma 0: Pegunungan
                if(rand < 0.75) obj = createTree('pine'); else if(rand < 0.9) obj = createLog(); else obj = createRock(); 
            } else if (currentBiome === 1) { 
                // Bioma 1: Farm (Dataran Terbuka)
                if(side === -1 && rand < 0.15) obj = createVillageHouse(); else if(rand < 0.3) obj = createFence(); else if(rand < 0.5) obj = createFlower(); else if(rand < 0.7) obj = createTallGrass(); else obj = createTree('round');
            } else { 
                // Bioma 2: Pantai (Laut dikanan)
                if(side === 1) {
                    if(rand < 0.4) obj = createUmbrella(); else obj = createPalmTree();
                } else {
                    if(rand < 0.2) obj = createVillageHouse(); else if(rand < 0.8) obj = createPalmTree(); else obj = createRock();
                }
            }
            
            if(obj) { 
                let offset = 9 + Math.random() * 10;
                if (obj.userData.isHouse) offset = 16 + Math.random() * 6; 
                if (obj.userData.isUmbrella) offset = 14 + Math.random() * 8;
                
                obj.position.set(side * offset, 0, -180 + zOffset); 
                obj.scale.setScalar(0.1); obj.userData.targetScale = 1.0; scene.add(obj); scenery.push(obj); 
            }
        }

        function animate() {
            if (isGameOver || !gameStarted) return;
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta(); const time = performance.now() * 0.001;
            if (mixer) mixer.update(delta);
            frameCount++;

            curveUniforms.curveX.value = Math.sin(time * 0.4) * 0.0006;
            curveUniforms.curveY.value = Math.sin(time * 0.3) * 0.001 + 0.001; 

            const positions = oceanSea.geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const u = positions.getX(i); const v = positions.getY(i);
                positions.setZ(i, Math.sin(u * 0.5 + time * 2) * 0.3 + Math.cos(v * 0.5 + time) * 0.3);
            }
            positions.needsUpdate = true;

            // TRANSISI BIOMA SETIAP SKOR 1500 (GANTI CEPAT UNTUK DITES)
            currentBiome = Math.floor(score / 1500) % 3;
            if (currentBiome === 0) { targetGroundColor.setHex(0x2E4F2A); } // Hutan
            else if (currentBiome === 1) { targetGroundColor.setHex(0x689F38); } // Rumput Cerah
            else { targetGroundColor.setHex(0xEED49F); } // Pasir Pantai
            grassGroundMat.color.lerp(targetGroundColor, 0.02); 

            let targetOceanX = currentBiome === 2 ? 60 : 180; 
            oceanSea.position.x += (targetOceanX - oceanSea.position.x) * 0.02;

            if (audioCtx && engineOsc) { const currentPitch = 40 + ((speed - 0.65) * 180); engineOsc.frequency.setTargetAtTime(currentPitch, audioCtx.currentTime, 0.1); }

            dayTime += 0.0007; 
            const sunY = Math.sin(dayTime); const sunZ = Math.cos(dayTime);
            sunLight.position.set(-45, sunY * 45, sunZ * 45);
            sunMesh.position.set(-45 * 3, sunY * 45 * 3, sunZ * 45 * 3);
            sunMesh.lookAt(camera.position);

            const colorDay = new THREE.Color(0x5DADE2); const colorSunrise = new THREE.Color(0xFFB7B2); 
            const colorSunset = new THREE.Color(0xFF9E80); const colorNight = new THREE.Color(0x0F172A); 
            let skyColor = new THREE.Color();
            
            if (sunY > 0.3) {
                skyColor.copy(colorDay); isNight = false; sunLight.intensity = 1.4; hemiLight.intensity = 0.5; ambientLight.intensity = 0.4; starsMat.opacity = 0; playerHeadLight.intensity = 0; playerAmbientLight.intensity = 0; sunMat.color.setHex(0xffffff); sunMat.opacity = 0.8;
            } else if (sunY < -0.3) {
                skyColor.copy(colorNight); isNight = true; sunLight.intensity = 0; hemiLight.intensity = 0.15; ambientLight.intensity = 0.15; starsMat.opacity = 1; playerHeadLight.intensity = 3.0; playerAmbientLight.intensity = 1.0; sunMat.opacity = 0; 
            } else {
                let t = (sunY + 0.3) / 0.6; isNight = (t < 0.5);
                const horizonColor = (sunZ < 0) ? colorSunset : colorSunrise;
                if (t > 0.5) {
                    let f = (t - 0.5) * 2.0; skyColor.copy(horizonColor).lerp(colorDay, f);
                    sunLight.intensity = lerp(0.4, 1.4, f); hemiLight.intensity = lerp(0.25, 0.5, f); ambientLight.intensity = lerp(0.2, 0.4, f); starsMat.opacity = lerp(0.5, 0, f);
                    sunMat.color.copy(horizonColor).lerp(new THREE.Color(0xffffff), f); sunMat.opacity = lerp(0.4, 0.8, f);
                } else {
                    let f = t * 2.0; skyColor.copy(colorNight).lerp(horizonColor, f);
                    sunLight.intensity = lerp(0, 0.4, f); hemiLight.intensity = lerp(0.15, 0.25, f); ambientLight.intensity = lerp(0.15, 0.2, f); starsMat.opacity = lerp(1, 0.5, f);
                    sunMat.color.copy(horizonColor); sunMat.opacity = lerp(0, 0.4, f);
                }
                playerHeadLight.intensity = lerp(3.0, 0, t); playerAmbientLight.intensity = lerp(1.0, 0, t);
            }
            scene.background = skyColor; scene.fog.color = skyColor;

            if(comboTimer > 0) { comboTimer -= delta; if(comboTimer <= 0) { combo = 1; document.getElementById('combo-container').style.opacity = '0'; } }

            playerGroup.position.x += (playerTargetX - playerGroup.position.x) * 0.18;
            playerGroup.rotation.z = (playerGroup.position.x - playerTargetX) * -0.08;
            playerGroup.position.y += playerVelocityY;
            if (playerGroup.position.y > 0) { playerVelocityY += gravity; isJumping = true; playerGroup.rotation.x = -0.15; } 
            else { if(isJumping) cameraShake = 0.3; playerGroup.position.y = 0; playerVelocityY = 0; isJumping = false; playerGroup.rotation.x = 0; }
            
            camera.position.y = 5.5 + (playerGroup.position.y * 0.3); 
            camera.position.z = 11 + (speed - 0.65) * 10; 
            if (cameraShake > 0) { camera.position.y += (Math.random() - 0.5) * cameraShake; camera.position.x += (Math.random() - 0.5) * cameraShake; cameraShake *= 0.9; }

            // SPAWNERS GUNUNG - HANYA DI BIOMA TERTENTU
            if (frameCount % 45 === 0) { 
                if (currentBiome === 0) {
                    spawnMountain(1); spawnMountain(-1); 
                } else if (currentBiome === 2) {
                    spawnMountain(-1); // Pantai, Gunung cuma di kiri
                }
                // Bioma 1 = Tidak ada gunung (Farm terbuka)
            }
            if (frameCount % 15 === 0) { spawnTreeline(1, 0); spawnTreeline(-1, 0); } 
            
            if (frameCount % 8 === 0) {
                spawnDenseScenery(-1, 0); if(Math.random() > 0.3) spawnDenseScenery(1, 0);
            }
            if (frameCount % 30 === 0) createCloud();
            
            if (frameCount % 60 === 0) {
                let obj; const rand = Math.random(); if (rand < 0.6) obj = createCar(); else if (rand < 0.8) obj = createRamp(); else obj = createOil();
                obj.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 0, -180); scene.add(obj); obstacles.push(obj);
            }
            if (frameCount % 180 === 0 && currentBiome === 1) { 
                let animal = Math.random() > 0.5 ? createCow() : createSheep(); let startSide = Math.random() > 0.5 ? 1 : -1; 
                animal.position.set(startSide * 7, 0, -180); animal.rotation.y = startSide === 1 ? -Math.PI/2 : Math.PI/2; animal.userData.speedX = startSide === 1 ? -0.04 : 0.04; scene.add(animal); obstacles.push(animal);
            }
            if (frameCount % 85 === 0) {
                const pkg = createPackage(); pkg.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 1, -180); scene.add(pkg); packages.push(pkg);
            }
            if (frameCount % 120 === 0) {
                const lane = [-4, 0, 4][Math.floor(Math.random() * 3)];
                for(let i=0; i<3; i++){ const coin = createCoin(); coin.position.set(lane, 1.0, -180 - (i * 4)); scene.add(coin); packages.push(coin); }
            }

            for (let i = 0; i < lines.length; i++) { lines[i].position.z += speed; if (lines[i].position.z > 30) lines[i].position.z -= 180; }
            
            // CLEANUPS
            for (let i = mountains.length - 1; i >= 0; i--) { 
                mountains[i].position.z += speed * 0.15; 
                if (mountains[i].position.z > 20) { scene.remove(mountains[i]); mountains.splice(i, 1); } 
            }
            for (let i = clouds.length - 1; i >= 0; i--) { clouds[i].position.z += speed * 0.4; if (clouds[i].position.z > 30) { scene.remove(clouds[i]); clouds.splice(i, 1); } }
            
            for (let i = scenery.length - 1; i >= 0; i--) {
                let obj = scenery[i]; obj.position.z += speed;
                if (obj.scale.x < obj.userData.targetScale) obj.scale.addScalar(0.06); 
                if (obj.userData.isHouse) { if (isNight) { obj.userData.winMat.emissive.setHex(0xffeb3b); obj.userData.winMat.emissiveIntensity = 0.8; } else { obj.userData.winMat.emissive.setHex(0x000000); } }
                if (obj.position.z > 30) { scene.remove(obj); scenery.splice(i, 1); }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.userData.vy -= 0.02; p.scale.setScalar(p.userData.life); p.userData.life -= 0.05;
                if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            }

            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                let p = smokeParticles[i]; p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.scale.setScalar(p.userData.life * 0.2); p.material.opacity = p.userData.life; p.userData.life -= 0.03;
                if (p.userData.life <= 0) { scene.remove(p); smokeParticles.splice(i, 1); }
            }
            if (frameCount % 4 === 0) {
                const smokeMat = applyCurvedWorld(new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.8 }));
                const smoke = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2, 0), smokeMat);
                smoke.position.set(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z + 1.2);
                smoke.userData = { vx: (Math.random() - 0.5) * 0.03, vy: Math.random() * 0.03 + 0.02, vz: speed * 0.5 + Math.random() * 0.05, life: 1.0 };
                scene.add(smoke); smokeParticles.push(smoke);
            }

            for (let i = packages.length - 1; i >= 0; i--) {
                let pkg = packages[i];
                pkg.position.z += speed; 
                pkg.userData.type === 'coin' ? pkg.rotation.z -= 0.08 : pkg.rotation.y += 0.05; 

                if (Math.abs(pkg.position.z - playerGroup.position.z) < 2.5 && Math.abs(pkg.position.x - playerGroup.position.x) < 1.5 && !isJumping) {
                    comboTimer = 2.0; const comboEl = document.getElementById('combo-container');
                    comboEl.style.opacity = '1'; comboEl.style.transform = 'scale(1.2)'; setTimeout(()=> comboEl.style.transform = 'scale(1)', 100);
                    document.getElementById('combo-text').innerText = combo;

                    if (pkg.userData.type === 'coin') {
                        let pts = 10 * combo; score += pts; showFloatingScore('+'+pts, '#FFC107'); 
                        createExplosion(pkg.position.x, pkg.position.y, pkg.position.z, 0xFFC107); playSfx('coin');
                    } else {
                        let pts = 100 * combo; packageCount++; score += pts; document.getElementById('package-count').innerText = packageCount;
                        showFloatingScore('+1📦', '#FF9800'); createExplosion(pkg.position.x, pkg.position.y, pkg.position.z, 0xe0c097); playSfx('coin');
                    }
                    combo++; scene.remove(pkg); packages.splice(i, 1); continue;
                }
                if (pkg.position.z > 30) { scene.remove(pkg); packages.splice(i, 1); }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;
                if (obs.userData.type === 'car') { obs.position.z += obs.userData.driveSpeed; obs.userData.wheels.forEach(w => w.rotation.x -= 0.15); obs.userData.lights.forEach(hl => hl.opacity = isNight ? 0.6 : 0); } 
                else if (obs.userData.type === 'animal') { obs.position.x += obs.userData.speedX; obs.position.y = Math.abs(Math.sin(frameCount * 0.2)) * 0.4; }
                
                let hitDistZ = 2.5; let hitDistX = 1.8; if(obs.userData.type === 'animal') { hitDistZ = 1.5; hitDistX = 1.5; }

                if (Math.abs(obs.position.z - playerGroup.position.z) < hitDistZ && Math.abs(obs.position.x - playerGroup.position.x) < hitDistX) {
                    if (obs.userData.type === 'ramp' && !isJumping) { playerVelocityY = 0.38; obs.userData.type = 'used'; playSfx('jump'); } 
                    else if (obs.userData.type === 'oil' && !isJumping) { playSfx('slip'); let avail = [-4, 0, 4].filter(l => l !== playerTargetX); playerTargetX = avail[Math.floor(Math.random() * 2)]; combo = 1; obs.position.y = -10; } 
                    else if ((obs.userData.type === 'car' || obs.userData.type === 'animal') && playerGroup.position.y < 1.0) { isGameOver = true; cameraShake = 1.0; crashGame(obs.userData.type === 'animal' ? "Nabrak Hewan!" : "Nabrak Mobil!"); }
                }
                if (obs.position.z > 40) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            score += Math.floor(speed * 0.5); document.getElementById('score').innerText = score; speed += 0.00015; renderer.render(scene, camera);
        }

        function crashGame(msg) {
            if(engineGain) engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
            const flash = document.getElementById('damage-flash'); flash.style.opacity = '1'; setTimeout(() => { flash.style.opacity = '0'; }, 200);
            setTimeout(() => { document.getElementById('controls').style.display = 'none'; document.getElementById('end-message').innerText = msg; document.getElementById('end-packages').innerText = packageCount; document.getElementById('end-score').innerText = score; document.getElementById('game-over-screen').style.display = 'flex'; }, 300);
        }

        function updateCameraResponsive() {
            const aspect = window.innerWidth / window.innerHeight; camera.aspect = aspect;
            if (aspect < 1) { camera.fov = 85; } else { camera.fov = 55; } camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); updateCameraResponsive(); });
        updateCameraResponsive();
    </script>
</body>
</html>
