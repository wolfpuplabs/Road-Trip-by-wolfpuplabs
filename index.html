<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>Road Trip - Soft Vibes Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Nunito', sans-serif; 
            background-color: #A3D8FF; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation; 
            width: 100vw; height: 100dvh;
        }
        canvas { display: block; width: 100vw; height: 100dvh; }
        
        /* Soft Cinematic Vignette */
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(15, 23, 42, 0.25) 100%);
            pointer-events: none; z-index: 50;
        }

        /* UI HUD */
        #ui-container { 
            position: absolute; 
            top: max(35px, env(safe-area-inset-top)); 
            left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 100; display: none; 
        }
        .hud-card { 
            display: inline-block; background: rgba(255, 255, 255, 0.8); 
            padding: 8px 24px; border-radius: 30px; margin: 4px; 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            transition: transform 0.1s; 
        }
        .hud-text { color: #334155; font-size: 20px; font-weight: 900; text-shadow: 1px 1px 0 #fff; }
        
        #combo-container { 
            position: absolute; 
            top: max(95px, env(safe-area-inset-top) + 60px); 
            right: max(25px, env(safe-area-inset-right)); 
            font-size: 34px; font-weight: 900; color: #FFD54F; 
            text-shadow: 2px 2px 0 #FF6F00, 0 4px 10px rgba(0,0,0,0.2); 
            opacity: 0; transition: opacity 0.3s, transform 0.1s; z-index: 100;
        }
        
        /* Floating Score */
        .floating-score { position: absolute; font-size: 36px; font-weight: 900; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; z-index: 500; pointer-events: none; animation: floatUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: translateX(-50%); }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; } 50% { transform: translate(-50%, -60px) scale(1.3); opacity: 1; } 100% { transform: translate(-50%, -100px) scale(1); opacity: 0; } }

        /* Kontrol */
        #controls { 
            position: absolute; 
            bottom: max(40px, env(safe-area-inset-bottom)); 
            left: 0; width: 100%; display: none; justify-content: space-between; 
            padding: 0 max(25px, env(safe-area-inset-left)); 
            z-index: 1000; 
        }
        .btn { 
            pointer-events: auto; width: 42vw; max-width: 160px; padding: 18px 0; 
            font-size: 22px; font-weight: 900; background: linear-gradient(to bottom, #FFD180, #FFA726); 
            border: 4px solid #ffffff; border-radius: 25px; color: #fff; cursor: pointer; text-align: center; 
            box-shadow: 0 8px 0 #E65100, 0 15px 20px rgba(0,0,0,0.2); text-transform: uppercase; transition: transform 0.1s; 
            text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
        }
        .btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #E65100; }

        /* Layar Utama */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #A1C4FD, #C2E9FB); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        #loading-container { width: 80%; max-width: 350px; height: 25px; background: rgba(255,255,255,0.4); border-radius: 15px; border: 3px solid #fff; margin-top: 30px; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        #loading-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #FFD180, #FFA726); transition: width 0.3s ease; }
        #loading-text { color: #555; font-size: 18px; font-weight: bold; margin-top: 10px; text-shadow: 1px 1px 0 #fff; }
        #start-btn { display: none; padding: 18px 60px; font-size: 32px; font-weight: 900; background: linear-gradient(to bottom, #81C784, #4CAF50); border: 5px solid #fff; border-radius: 35px; color: white; cursor: pointer; box-shadow: 0 10px 0 #2E7D32, 0 15px 30px rgba(0,0,0,0.3); animation: pulse 1.5s infinite; margin-top: 30px;}
        
        /* Layar Game Over */
        #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; }
        .modal-card { background: rgba(255, 255, 255, 0.95); padding: 35px 25px; border-radius: 35px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border: 3px solid #fff; width: 85%; max-width: 380px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .modal-card h2 { color: #e53935; font-size: 40px; margin: 0 0 5px 0; text-shadow: 2px 2px 0 #fff; }
        .modal-card p { font-size: 20px; color: #555; margin-bottom: 25px; font-weight: 800; }
        .stats-grid { display: flex; justify-content: space-between; margin-bottom: 30px; background: #F8FAFC; padding: 15px 20px; border-radius: 20px; border: 2px solid #E2E8F0; }
        .stats-grid div { font-size: 16px; color: #64748B; font-weight: 800; width: 50%; }
        .stats-grid span { display: block; font-size: 32px; color: #1E293B; margin-top: 5px; }
        #restart-btn { width: 100%; max-width: 100%; margin-top: 10px; background: linear-gradient(to bottom, #38BDF8, #0284C7); box-shadow: 0 8px 0 #0369A1, 0 15px 20px rgba(0,0,0,0.25); text-shadow: none; }
        #restart-btn:active { box-shadow: 0 0px 0 #0369A1; transform: translateY(8px); }

        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 30%, rgba(255,0,0,0.4) 100%); opacity: 0; z-index: 2500; pointer-events: none; transition: opacity 0.2s; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes popIn { 0% { transform: scale(0.7) translateY(30px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3" type="audio/mpeg">
    </audio>

    <div id="vignette"></div>
    <div id="damage-flash"></div>

    <div id="start-screen">
        <h1 style="color:#FFF; font-size: 50px; text-shadow: 3px 3px 0 #FF9800, -1px -1px 0 #FF9800, 1px -1px 0 #FF9800, -1px 1px 0 #FF9800; margin: 0; text-align: center; line-height: 1.1;">ROAD TRIP<br><span style="font-size: 35px; color: #FFF200; text-shadow: 2px 2px 0 #E65100;">Pro Vibes</span></h1>
        <p style="color: #444; font-size: 16px; font-weight: bold; margin-top: 15px; text-align: center; text-shadow: 1px 1px 0 #fff;">Smooth Biomes & Soft Lighting</p>
        
        <div id="loading-container"><div id="loading-bar"></div></div>
        <div id="loading-text">Memuat Dunia Magis... 0%</div>
        <button id="start-btn">RIDE NOW</button>
    </div>

    <div id="game-over-screen">
        <div class="modal-card">
            <h2>💥 CRASH!</h2>
            <p id="end-message">Aduh! Nabrak!</p>
            <div class="stats-grid">
                <div style="border-right: 2px solid #CBD5E1;">📦 Paket<br><span id="end-packages">0</span></div>
                <div>⭐ Skor<br><span id="end-score">0</span></div>
            </div>
            <button id="restart-btn" class="btn">MAIN LAGI 🔄</button>
        </div>
    </div>

    <div id="ui-container">
        <div class="hud-card" id="score-card"><span class="hud-text">⭐ Skor: <span id="score" style="color:#FF5722;">0</span></span></div>
        <div class="hud-card"><span class="hud-text">📦 Paket: <span id="package-count" style="color:#10B981;">0</span></span></div>
    </div>
    <div id="combo-container">x<span id="combo-text">1</span> COMBO!</div>
    
    <div id="controls">
        <button id="btn-left" class="btn">⬅️ KIRI</button>
        <button id="btn-right" class="btn">KANAN ➡️</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // ==========================================
        // 0. OFFLINE CACHE SYSTEM
        // ==========================================
        async function setupOfflineCache() {
            if ('caches' in window) {
                try {
                    const cache = await caches.open('road-trip-assets-v13');
                    const urlsToCache = [
                        'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
                        'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js',
                        'https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3',
                        'Ngantor rider.glb'
                    ];
                    urlsToCache.forEach(async (url) => {
                        const response = await caches.match(url);
                        if (!response) { try { await cache.add(url); } catch (e) {} }
                    });
                } catch (err) {}
            }
        }
        setupOfflineCache();

        // ==========================================
        // 1. CURVED WORLD SHADER
        // ==========================================
        const curveUniforms = { curveX: { value: 0.0 }, curveY: { value: 0.0012 } };

        function applyCurvedWorld(material) {
            material.onBeforeCompile = (shader) => {
                shader.uniforms.curveX = curveUniforms.curveX;
                shader.uniforms.curveY = curveUniforms.curveY;
                shader.vertexShader = `uniform float curveX;\nuniform float curveY;\n` + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <project_vertex>',
                    `vec4 mvPosition = vec4( transformed, 1.0 );
                    #ifdef USE_INSTANCING
                        mvPosition = instanceMatrix * mvPosition;
                    #endif
                    mvPosition = modelViewMatrix * mvPosition;
                    float zDist = max(0.0, -mvPosition.z);
                    mvPosition.y -= curveY * zDist * zDist;
                    mvPosition.x -= curveX * zDist * zDist;
                    gl_Position = projectionMatrix * mvPosition;`
                );
            };
            return material;
        }

        function createGlowTexture(color1, color2, color3) {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d'); const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, color1); gradient.addColorStop(0.3, color2); gradient.addColorStop(1, color3);
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(canvas);
        }
        const sunGlowTex = createGlowTexture('rgba(255, 255, 255, 1)', 'rgba(255, 235, 180, 0.6)', 'rgba(255, 200, 100, 0)');
        const headlightTex = createGlowTexture('rgba(255, 255, 255, 0.7)', 'rgba(255, 255, 255, 0.15)', 'rgba(255, 255, 255, 0)');
        
        function createCoinTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFCA28'; ctx.fillRect(0, 0, 256, 256);
            ctx.beginPath(); ctx.arc(128, 128, 110, 0, 2 * Math.PI); ctx.lineWidth = 15; ctx.strokeStyle = '#FF8F00'; ctx.stroke();
            ctx.fillStyle = '#FFF8E1'; ctx.font = 'bold 150px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⭐', 128, 140);
            return new THREE.CanvasTexture(canvas);
        }
        const coinTex = createCoinTexture();

        // ==========================================
        // 2. AUDIO & SFX
        // ==========================================
        let audioCtx, engineOsc, engineGain;
        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                document.getElementById('bgm').volume = 0.25; document.getElementById('bgm').play().catch(()=>{});
                engineOsc = audioCtx.createOscillator(); const filter = audioCtx.createBiquadFilter(); engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(220, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
                engineOsc.start();
            } catch(e) {}
        }

        function playSfx(type) {
            if(!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'coin') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'jump') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'slip') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch(e) {}
        }

        // ==========================================
        // 3. SCENE & SOFT PROFESSIONAL LIGHTING
        // ==========================================
        const scene = new THREE.Scene();
        // Menggunakan FogExp2 untuk gradasi kedalaman atmosfer yang lebih natural (ciri khas game Pro)
        scene.fog = new THREE.FogExp2(0xA3D8FF, 0.007); 
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.5, 8.5); camera.lookAt(0, 1, -12);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Bayangan lebih halus
        
        renderer.outputEncoding = THREE.sRGBEncoding; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.05; // Exposure diseimbangkan
        document.body.appendChild(renderer.domElement);

        // PENCAHAYAAN: Kontras lembut, tidak terlalu gelap di bayangan, tidak terlalu silau
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.45); scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0xE3F2FD, 0x558B2F, 0.4); scene.add(hemiLight);
        
        const sunLight = new THREE.DirectionalLight(0xFFF3E0, 1.2); 
        sunLight.position.set(-45, 45, 10); sunLight.castShadow = true;
        
        sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 150;
        sunLight.shadow.camera.left = -35; sunLight.shadow.camera.right = 35;
        sunLight.shadow.camera.top = 35; sunLight.shadow.camera.bottom = -35;
        sunLight.shadow.bias = -0.0005;
        sunLight.shadow.normalBias = 0.04; // Menghilangkan harsh/shadow acne secara sempurna
        scene.add(sunLight);

        const sunMat = new THREE.MeshBasicMaterial({ map: sunGlowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
        const sunMesh = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), sunMat);
        scene.add(sunMesh);

        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 500; const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 400; }
        for(let i = 1; i < starsCount * 3; i+=3) { posArray[i] = Math.random() * 150 + 30; } 
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 1.5, transparent: true, opacity: 0});
        const starMesh = new THREE.Points(starsGeo, starsMat); scene.add(starMesh);

        // ==========================================
        // 4. TERRAIN & OCEAN
        // ==========================================
        const grassGroundMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x689F38, flatShading: true, roughness: 0.9, metalness: 0.0 }));
        const grassGround = new THREE.Mesh(new THREE.PlaneGeometry(240, 400, 1, 100), grassGroundMat);
        grassGround.rotation.x = -Math.PI / 2; grassGround.position.set(0, 0, 0); 
        grassGround.receiveShadow = true; scene.add(grassGround);

        // Geometri Laut dilebarkan agar tampak memenuhi pantai
        const oceanGeo = new THREE.PlaneGeometry(300, 400, 30, 100);
        const oceanSea = new THREE.Mesh(oceanGeo, applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x29B6F6, flatShading: true, roughness: 0.1, metalness: 0.7 })));
        oceanSea.rotation.x = -Math.PI / 2; 
        oceanSea.position.set(250, -0.35, 0); // Posisi awal jauh dari pandangan
        oceanSea.receiveShadow = true;
        scene.add(oceanSea);

        const roadMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 }));
        const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 400, 1, 100), roadMat);
        road.rotation.x = -Math.PI / 2; road.position.set(0, 0.02, 0); road.receiveShadow = true; scene.add(road);

        const curbMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0xCBD5E1, roughness: 0.8 }));
        for (let side of [-5.2, 5.2]) {
            const curb = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 400, 1, 1, 100), curbMat);
            curb.position.set(side, 0.1, 0); curb.receiveShadow = true; curb.castShadow = true; scene.add(curb);
        }
        
        let lines = [];
        const lineMat = applyCurvedWorld(new THREE.MeshBasicMaterial({ color: 0xFCD34D }));
        for (let laneX of [-1.75, 1.75]) {
            for (let z = -150; z < 50; z += 15) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 4), lineMat);
                line.rotation.x = -Math.PI / 2; line.position.set(laneX, 0.03, z); scene.add(line); lines.push(line);
            }
        }

        // ==========================================
        // 5. ENHANCED 3D MODELS
        // ==========================================
        function createMesh(geo, matOptions, isBasic = false) {
            const mat = isBasic ? new THREE.MeshBasicMaterial(matOptions) : new THREE.MeshStandardMaterial(matOptions);
            return new THREE.Mesh(geo, applyCurvedWorld(mat));
        }

        function createTree(type) {
            const group = new THREE.Group();
            if (type === 'pine') {
                const trunk = createMesh(new THREE.CylinderGeometry(0.35, 0.5, 1.8, 6), { color: 0x5D4037, flatShading: true });
                trunk.position.y = 0.9; trunk.castShadow = true; trunk.receiveShadow = true; group.add(trunk);
                
                const leavesColors = [0x2E7D32, 0x388E3C, 0x43A047]; 
                let y = 1.8; let rad = 2.6;
                for(let i=0; i<3; i++) { 
                    const c = createMesh(new THREE.ConeGeometry(rad, 2.6, 7), { color: leavesColors[i], flatShading: true, roughness: 0.8 }); 
                    c.position.y = y; c.castShadow = true; group.add(c); 
                    y += 1.4; rad -= 0.6; 
                }
            } else if (type === 'round') {
                const trunk = createMesh(new THREE.CylinderGeometry(0.3, 0.5, 2, 5), { color: 0x5D4037, flatShading: true });
                trunk.position.y = 1; trunk.castShadow = true; trunk.receiveShadow = true; group.add(trunk);
                const colors = [0x81C784, 0x66BB6A, 0x4CAF50];
                const top = createMesh(new THREE.IcosahedronGeometry(2.4, 0), { color: colors[Math.floor(Math.random()*colors.length)], flatShading: true, roughness: 0.8 }); 
                top.position.y = 3.5; top.castShadow = true; group.add(top);
            }
            return group;
        }

        function createPalmTree() {
            const group = new THREE.Group();
            const trunkMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x8D6E63, flatShading: true, roughness: 0.9 }));
            const leafMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x66BB6A, flatShading: true, roughness: 0.8 }));
            const nutMat = applyCurvedWorld(new THREE.MeshStandardMaterial({ color: 0x4E342E, flatShading: true }));
            
            let topX = 0; let topY = 0;
            for(let i=0; i<7; i++) { 
                const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.35 - i*0.03, 0.45 - i*0.03, 1.0, 6), trunkMat); 
                topX = Math.sin(i*0.2) * 0.6; topY = i*0.9 + 0.5;
                seg.position.set(topX, topY, 0); 
                seg.rotation.z = -0.15 + (i*0.04); seg.castShadow = true; group.add(seg); 
            }
            for(let a=0; a<5; a++) { 
                const leaf = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.1, 1.2), leafMat); 
                leaf.position.set(topX, topY + 0.5, 0); 
                leaf.rotation.y = (a * Math.PI * 2 / 5); leaf.rotation.z = -0.4; 
                leaf.translateX(1.2); leaf.castShadow = true; group.add(leaf); 
            }
            for(let i=0; i<3; i++) {
                const nut = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35, 0), nutMat);
                nut.position.set(topX + Math.cos(i*2)*0.5, topY + 0.1, Math.sin(i*2)*0.5);
                nut.castShadow = true; group.add(nut);
            }
            return group;
        }

        function createVillageHouse() {
            const group = new THREE.Group();
            const base = createMesh(new THREE.BoxGeometry(5.4, 0.4, 5.4), { color: 0x94A3B8, flatShading: true }); 
            base.position.y = 0.2; base.receiveShadow = true; group.add(base);
            const wall = createMesh(new THREE.BoxGeometry(4.4, 3.2, 4.4), { color: 0xFEF08A, flatShading: true }); 
            wall.position.y = 1.8; wall.castShadow = true; wall.receiveShadow = true; group.add(wall);

        const lerp = (a, b, t) => a + (b - a) * t;

        // Logika Biome yang Diperketat (Anti-Bocor)
        function spawnTreeline(side, zOffset) {
            const clump = new THREE.Group();
            const numTrees = Math.floor(Math.random() * 3) + 2; 
            for(let i=0; i<numTrees; i++) {
                let tree;
                if (currentBiome === 0) tree = createTree('pine');
                else if (currentBiome === 1) tree = createTree('round');
                else tree = createPalmTree();

                tree.position.set((Math.random()-0.5)*8, 0, (Math.random()-0.5)*8);
                tree.scale.setScalar(0.8 + Math.random()*0.4); clump.add(tree);
            }
            const posX = side * (Math.random() * 15 + 20);
            clump.position.set(posX, 0, -220 + zOffset);
            clump.scale.setScalar(0.1); clump.userData.targetScale = 1; scene.add(clump); scenery.push(clump);
        }

        function spawnDenseScenery(side, zOffset) {
            const rand = Math.random(); let obj;
            
            if (currentBiome === 0) { // Hutan
                if(rand < 0.75) obj = createTree('pine'); else if(rand < 0.9) obj = createLog(); else obj = createRock(); 
            } else if (currentBiome === 1) { // Pedesaan
                if(side === -1 && rand < 0.2) obj = createVillageHouse(); else if(rand < 0.4) obj = createFence(); else if(rand < 0.6) obj = createFlower(); else if(rand < 0.8) obj = createTallGrass(); else obj = createTree('round');
            } else { // Pantai
                if(side === 1) { // Laut di kanan, spawn payung pantai & palem
                    if(rand < 0.4) obj = createUmbrella(); else obj = createPalmTree();
                } else { // Daratan kiri
                    if(rand < 0.2) obj = createVillageHouse(); else if(rand < 0.8) obj = createPalmTree(); else obj = createRock();
                }
            }
            
            if(obj) { 
                let offset = 8 + Math.random() * 8;
                if (obj.userData.isHouse) offset = 14 + Math.random() * 5; 
                if (obj.userData.isUmbrella) offset = 12 + Math.random() * 5;
                
                obj.position.set(side * offset, 0, -180 + zOffset); 
                obj.scale.setScalar(0.1); obj.userData.targetScale = 1.0; scene.add(obj); scenery.push(obj); 
            }
        }

        function animate() {
            if (isGameOver || !gameStarted) return;
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta(); const time = performance.now() * 0.001;
            
            if (mixer) {
                mixer.update(delta);
                // FIX: Kunci Root Motion agar Rider tidak makin maju mendekati kamera
                if(playerModel) {
                    playerModel.position.z = 0; 
                    playerModel.position.x = 0;
                }
            }
            
            frameCount++;
            distanceTraveled += speed;

            curveUniforms.curveX.value = Math.sin(time * 0.4) * 0.0006;
            curveUniforms.curveY.value = Math.sin(time * 0.3) * 0.001 + 0.001; 

            const positions = oceanSea.geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const u = positions.getX(i); const v = positions.getY(i);
                positions.setZ(i, Math.sin(u * 0.5 + time * 2) * 0.3 + Math.cos(v * 0.5 + time) * 0.3);
            }
            positions.needsUpdate = true;

            // Biome Transisi diperpanjang biar ga cepet bosen (2000 jarak)
            currentBiome = Math.floor(distanceTraveled / 2000) % 3;
            if (currentBiome === 0) { targetGroundColor.setHex(0x689F38); } // Hutan (Hijau Gelap)
            else if (currentBiome === 1) { targetGroundColor.setHex(0x9CCC65); } // Plains (Hijau Muda)
            else { targetGroundColor.setHex(0xFDE047); } // Beach (Pasir Kuning Pastel)
            grassGroundMat.color.lerp(targetGroundColor, 0.015); 

            // FIX: Dekatkan laut jika di Biome Pantai, dan jauhkan jika tidak
            let targetOceanX = currentBiome === 2 ? 155 : 400; // Lebar laut 300. X=155 artinya pinggir laut menyentuh jalan (X=5).
            oceanSea.position.x += (targetOceanX - oceanSea.position.x) * 0.015;

            if (audioCtx && engineOsc) { const currentPitch = 40 + ((speed - 0.65) * 180); engineOsc.frequency.setTargetAtTime(currentPitch, audioCtx.currentTime, 0.1); }

            // Dynamic FOV untuk sensasi kecepatan
            const targetFOV = 55 + (speed - 0.65) * 20;
            camera.fov = lerp(camera.fov, targetFOV, 0.05);
            camera.updateProjectionMatrix();

            dayTime += 0.0007; 
            const sunY = Math.sin(dayTime); const sunZ = Math.cos(dayTime);
            sunLight.position.set(-45, sunY * 45, sunZ * 45);
            sunMesh.position.set(-45 * 3, sunY * 45 * 3, sunZ * 45 * 3);
            sunMesh.lookAt(camera.position);

            const colorDay = new THREE.Color(0x38BDF8); 
            const colorSunrise = new THREE.Color(0xFCA5A5); 
            const colorSunset = new THREE.Color(0xFDA4AF); 
            const colorNight = new THREE.Color(0x0F172A); 
            let skyColor = new THREE.Color();
            
            if (sunY > 0.3) {
                skyColor.copy(colorDay); isNight = false; 
                sunLight.intensity = 1.2; hemiLight.intensity = 0.4; ambientLight.intensity = 0.45; 
                starsMat.opacity = 0; playerHeadLight.intensity = 0; playerAmbientLight.intensity = 0; 
                sunMat.color.setHex(0xffffff); sunMat.opacity = 0.8;
            } else if (sunY < -0.3) {
                skyColor.copy(colorNight); isNight = true; 
                sunLight.intensity = 0; hemiLight.intensity = 0.1; ambientLight.intensity = 0.15; 
                starsMat.opacity = 1; playerHeadLight.intensity = 4.0; playerAmbientLight.intensity = 1.0; 
                sunMat.opacity = 0; 
            } else {
                let t = (sunY + 0.3) / 0.6; isNight = (t < 0.5);
                const horizonColor = (sunZ < 0) ? colorSunset : colorSunrise;
                if (t > 0.5) {
                    let f = (t - 0.5) * 2.0; skyColor.copy(horizonColor).lerp(colorDay, f);
                    sunLight.intensity = lerp(0.5, 1.2, f); hemiLight.intensity = lerp(0.2, 0.4, f); ambientLight.intensity = lerp(0.2, 0.45, f); starsMat.opacity = lerp(0.5, 0, f);
                    sunMat.color.copy(horizonColor).lerp(new THREE.Color(0xffffff), f); sunMat.opacity = lerp(0.4, 0.8, f);
                } else {
                    let f = t * 2.0; skyColor.copy(colorNight).lerp(horizonColor, f);
                    sunLight.intensity = lerp(0, 0.5, f); hemiLight.intensity = lerp(0.1, 0.2, f); ambientLight.intensity = lerp(0.15, 0.2, f); starsMat.opacity = lerp(1, 0.5, f);
                    sunMat.color.copy(horizonColor); sunMat.opacity = lerp(0, 0.4, f);
                }
                playerHeadLight.intensity = lerp(4.0, 0, t); playerAmbientLight.intensity = lerp(1.0, 0, t);
            }
            scene.background = skyColor; 
            scene.fog.color.copy(skyColor); // Sync Fog dengan warna langit

            if(comboTimer > 0) { comboTimer -= delta; if(comboTimer <= 0) { combo = 1; document.getElementById('combo-container').style.opacity = '0'; } }

            playerGroup.position.x += (playerTargetX - playerGroup.position.x) * 0.18;
            playerGroup.rotation.z = (playerGroup.position.x - playerTargetX) * -0.08;
            playerGroup.position.y += playerVelocityY;
            if (playerGroup.position.y > 0) { playerVelocityY += gravity; isJumping = true; playerGroup.rotation.x = -0.15; } 
            else { if(isJumping) cameraShake = 0.3; playerGroup.position.y = 0; playerVelocityY = 0; isJumping = false; playerGroup.rotation.x = 0; }
            
            camera.position.z = 8.5; 
            camera.position.y = 4.5 + (playerGroup.position.y * 0.2); 
            
            if (cameraShake > 0) { camera.position.y += (Math.random() - 0.5) * cameraShake; camera.position.x += (Math.random() - 0.5) * cameraShake; cameraShake *= 0.9; }

            // SPAWNERS
            // FIX: Tidak akan spawn Gunung jika sedang di pantai (Biome 2)
            if (frameCount % 60 === 0) { 
                if (currentBiome === 0) { spawnMountain(1); spawnMountain(-1); } 
                else if (currentBiome === 1) { if(Math.random() > 0.5) spawnMountain(-1); }
                // Biome 2 (Pantai) dibiarkan kosong dari gunung agar fokus kelaut
            }
            if (frameCount % 15 === 0) { spawnTreeline(1, 0); spawnTreeline(-1, 0); } 
            if (frameCount % 8 === 0) { spawnDenseScenery(-1, 0); if(Math.random() > 0.3) spawnDenseScenery(1, 0); }
            if (frameCount % 30 === 0) createCloud();
            
            if (frameCount % 60 === 0) {
                let obj; const rand = Math.random(); if (rand < 0.6) obj = createCar(); else if (rand < 0.8) obj = createRamp(); else obj = createOil();
                obj.position.set([-3.5, 0, 3.5][Math.floor(Math.random() * 3)], 0, -180); scene.add(obj); obstacles.push(obj);
            }
            if (frameCount % 180 === 0 && currentBiome === 1) { 
                let animal = Math.random() > 0.5 ? createCow() : createSheep(); let startSide = Math.random() > 0.5 ? 1 : -1; 
                animal.position.set(startSide * 6, 0, -180); animal.rotation.y = startSide === 1 ? -Math.PI/2 : Math.PI/2; animal.userData.speedX = startSide === 1 ? -0.04 : 0.04; scene.add(animal); obstacles.push(animal);
            }
            if (frameCount % 85 === 0) {
                const pkg = createPackage(); pkg.position.set([-3.5, 0, 3.5][Math.floor(Math.random() * 3)], 1, -180); scene.add(pkg); packages.push(pkg);
            }
            if (frameCount % 120 === 0) {
                const lane = [-3.5, 0, 3.5][Math.floor(Math.random() * 3)];
                for(let i=0; i<3; i++){ const coin = createCoin(); coin.position.set(lane, 1.0, -180 - (i * 4)); scene.add(coin); packages.push(coin); }
            }

            for (let i = 0; i < lines.length; i++) { lines[i].position.z += speed; if (lines[i].position.z > 30) lines[i].position.z -= 180; }
            
            for (let i = mountains.length - 1; i >= 0; i--) { mountains[i].position.z += speed * 0.15; if (mountains[i].position.z > 20) { scene.remove(mountains[i]); mountains.splice(i, 1); } }
            for (let i = clouds.length - 1; i >= 0; i--) { clouds[i].position.z += speed * 0.4; if (clouds[i].position.z > 30) { scene.remove(clouds[i]); clouds.splice(i, 1); } }
            
            for (let i = scenery.length - 1; i >= 0; i--) {
                let obj = scenery[i]; obj.position.z += speed;
                if (obj.scale.x < obj.userData.targetScale) obj.scale.addScalar(0.06); 
                if (obj.userData.isHouse) { if (isNight) { obj.userData.winMat.emissive.setHex(0xFEF08A); obj.userData.winMat.emissiveIntensity = 0.8; } else { obj.userData.winMat.emissive.setHex(0x000000); } }
                if (obj.position.z > 30) { scene.remove(obj); scenery.splice(i, 1); }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.userData.vy -= 0.02; p.scale.setScalar(p.userData.life); p.userData.life -= 0.05;
                if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            }

            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                let p = smokeParticles[i]; p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.scale.setScalar(p.userData.life * 0.2); p.material.opacity = p.userData.life; p.userData.life -= 0.03;
                if (p.userData.life <= 0) { scene.remove(p); smokeParticles.splice(i, 1); }
            }
            if (frameCount % 4 === 0) {
                const smokeMat = applyCurvedWorld(new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.8 }));
                const smoke = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2, 0), smokeMat);
                smoke.position.set(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z + 1.2);
                smoke.userData = { vx: (Math.random() - 0.5) * 0.03, vy: Math.random() * 0.03 + 0.02, vz: speed * 0.5 + Math.random() * 0.05, life: 1.0 };
                scene.add(smoke); smokeParticles.push(smoke);
            }

            for (let i = packages.length - 1; i >= 0; i--) {
                let pkg = packages[i];
                pkg.position.z += speed; 
                pkg.userData.type === 'coin' ? pkg.rotation.z -= 0.08 : pkg.rotation.y += 0.05; 

                if (Math.abs(pkg.position.z - playerGroup.position.z) < 2.5 && Math.abs(pkg.position.x - playerGroup.position.x) < 1.5 && !isJumping) {
                    comboTimer = 2.0; const comboEl = document.getElementById('combo-container');
                    comboEl.style.opacity = '1'; comboEl.style.transform = 'scale(1.2)'; setTimeout(()=> comboEl.style.transform = 'scale(1)', 100);
                    document.getElementById('combo-text').innerText = combo;

                    if (pkg.userData.type === 'coin') {
                        let pts = 10 * combo; score += pts; showFloatingScore('+'+pts, '#F59E0B'); 
                        createExplosion(pkg.position.x, pkg.position.y, pkg.position.z, 0xF59E0B); playSfx('coin');
                    } else {
                        let pts = 100 * combo; packageCount++; score += pts; document.getElementById('package-count').innerText = packageCount;
                        showFloatingScore('+1📦', '#F59E0B'); createExplosion(pkg.position.x, pkg.position.y, pkg.position.z, 0xFDE68A); playSfx('coin');
                    }
                    combo++; scene.remove(pkg); packages.splice(i, 1); continue;
                }
                if (pkg.position.z > 30) { scene.remove(pkg); packages.splice(i, 1); }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;
                if (obs.userData.type === 'car') { obs.position.z += obs.userData.driveSpeed; obs.userData.wheels.forEach(w => w.rotation.x -= 0.15); obs.userData.lights.forEach(hl => hl.opacity = isNight ? 0.6 : 0); } 
                else if (obs.userData.type === 'animal') { obs.position.x += obs.userData.speedX; obs.position.y = Math.abs(Math.sin(frameCount * 0.2)) * 0.4; }
                
                let hitDistZ = 2.8; let hitDistX = 1.8; if(obs.userData.type === 'animal') { hitDistZ = 1.8; hitDistX = 1.2; }

                if (Math.abs(obs.position.z - playerGroup.position.z) < hitDistZ && Math.abs(obs.position.x - playerGroup.position.x) < hitDistX) {
                    if (obs.userData.type === 'ramp' && !isJumping) { playerVelocityY = 0.38; obs.userData.type = 'used'; playSfx('jump'); } 
                    else if (obs.userData.type === 'oil' && !isJumping) { playSfx('slip'); let avail = [-3.5, 0, 3.5].filter(l => l !== playerTargetX); playerTargetX = avail[Math.floor(Math.random() * 2)]; combo = 1; obs.position.y = -10; } 
                    else if ((obs.userData.type === 'car' || obs.userData.type === 'animal') && playerGroup.position.y < 1.0) { isGameOver = true; cameraShake = 1.0; crashGame(obs.userData.type === 'animal' ? "Nabrak Hewan!" : "Nabrak Mobil!"); }
                }
                if (obs.position.z > 40) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            score += Math.floor(speed * 0.5); document.getElementById('score').innerText = score; speed += 0.0001; renderer.render(scene, camera);
        }

        function crashGame(msg) {
            if(engineGain) engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
            const flash = document.getElementById('damage-flash'); flash.style.opacity = '1'; setTimeout(() => { flash.style.opacity = '0'; }, 200);
            setTimeout(() => { document.getElementById('controls').style.display = 'none'; document.getElementById('end-message').innerText = msg; document.getElementById('end-packages').innerText = packageCount; document.getElementById('end-score').innerText = score; document.getElementById('game-over-screen').style.display = 'flex'; }, 300);
        }

        function updateCameraResponsive() {
            const aspect = window.innerWidth / window.innerHeight; camera.aspect = aspect;
            if (aspect < 1) { camera.fov = 85; } else { camera.fov = 55; } camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); updateCameraResponsive(); });
        updateCameraResponsive();
    </script>
</body>
</html>
