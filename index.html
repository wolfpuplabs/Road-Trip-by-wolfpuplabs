<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ngantor - Video Accurate Version</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Varela+Round&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Varela Round', sans-serif; /* Font bulat seperti di video */
            background-color: #87CEEB; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation; 
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI HUD */
        #ui-container { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 100; display: none; }
        #title { color: #FFa500; font-size: 48px; font-weight: bold; text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 4px 6px 5px rgba(0,0,0,0.3); margin: 0; letter-spacing: 2px;}
        .hud-text { color: #fff; font-size: 26px; font-weight: bold; text-shadow: 2px 2px 0 #333; margin-top: 10px; display: block; }
        
        /* Floating Score Animation */
        .floating-score { position: absolute; color: #FFD700; font-size: 30px; font-weight: bold; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; z-index: 500; pointer-events: none; animation: floatUp 1s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }
        
        /* Kontrol Layar Sentuh */
        #controls { position: absolute; bottom: 25px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 25px; pointer-events: none; z-index: 1000; }
        .btn { pointer-events: auto; width: 42vw; max-width: 180px; padding: 20px 0; font-size: 22px; font-weight: 900; background: rgba(255, 255, 255, 0.5); border: 4px solid #ffffff; border-radius: 25px; color: #333; cursor: pointer; text-align: center; backdrop-filter: blur(5px); transition: transform 0.05s ease; }
        .btn:active { transform: translateY(6px); background: rgba(255, 255, 255, 0.8); }

        /* Start Screen */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #87CEEB; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        #start-btn { padding: 15px 60px; font-size: 28px; font-weight: 900; background: #FFa500; border: 5px solid #fff; border-radius: 30px; color: white; cursor: pointer; box-shadow: 0 8px 0 #cc8400; animation: pulse 1.5s infinite; margin-top: 30px;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3" type="audio/mpeg">
    </audio>

    <div id="start-screen">
        <h1 style="color:#FFa500; font-size: 55px; text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; margin: 0; text-align: center;">Ngantor</h1>
        <button id="start-btn">Let's Play</button>
    </div>

    <div id="ui-container">
        <h1 id="title">Ngantor</h1>
        <span class="hud-text" id="score-display">0</span>
    </div>
    
    <div id="controls">
        <button id="btn-left" class="btn">⬅️ KIRI</button>
        <button id="btn-right" class="btn">KANAN ➡️</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // ==========================================
        // 1. CURVED WORLD SHADER (RAHASIA EFEK VIDEO)
        // ==========================================
        const curveUniforms = {
            curveX: { value: 0.0 }, // Berbelok kiri/kanan
            curveY: { value: 0.0015 } // Melengkung ke bawah (bukit)
        };

        // Fungsi ajaib untuk membengkokkan semua material 3D
        function applyCurvedShader(material) {
            material.onBeforeCompile = function(shader) {
                shader.uniforms.curveX = curveUniforms.curveX;
                shader.uniforms.curveY = curveUniforms.curveY;
                shader.vertexShader = `
                    uniform float curveX;
                    uniform float curveY;
                ` + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <project_vertex>',
                    `
                    vec4 mvPosition = vec4( transformed, 1.0 );
                    #ifdef USE_INSTANCING
                        mvPosition = instanceMatrix * mvPosition;
                    #endif
                    mvPosition = modelViewMatrix * mvPosition;
                    
                    // Hitung jarak dari kamera
                    float dist = mvPosition.z; 
                    
                    // Bengkokkan dunia ke bawah dan ke samping
                    mvPosition.y -= curveY * dist * dist;
                    mvPosition.x -= curveX * dist * dist;

                    gl_Position = projectionMatrix * mvPosition;
                    `
                );
            };
            return material;
        }

        // Wrapper material agar otomatis melengkung
        function CustomMaterial(options) {
            const mat = new THREE.MeshStandardMaterial(options);
            return applyCurvedShader(mat);
        }

        // ==========================================
        // 2. SCENE, CAMERA, LIGHTING
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Biru cerah video
        scene.fog = new THREE.Fog(0x87CEEB, 30, 120);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.5, 9);
        camera.lookAt(0, 1, -15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        dirLight.position.set(10, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024; dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // ==========================================
        // 3. ROAD & GROUND (STATIC, DENGAN SEGMENT)
        // ==========================================
        // Diberi segmentasi (100) agar bisa ditekuk oleh shader
        const groundGeo = new THREE.PlaneGeometry(250, 300, 1, 100);
        const ground = new THREE.Mesh(groundGeo, CustomMaterial({ color: 0x9acd32, flatShading: true }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
        scene.add(ground);

        const roadGeo = new THREE.PlaneGeometry(12, 300, 1, 100);
        const road = new THREE.Mesh(roadGeo, CustomMaterial({ color: 0x555555 }));
        road.rotation.x = -Math.PI / 2; road.position.y = 0.02; road.receiveShadow = true;
        scene.add(road);

        // Garis Tepi Kuning
        for(let x of [-5.8, 5.8]) {
            const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 300, 1, 100), CustomMaterial({ color: 0xffcc00 }));
            edge.rotation.x = -Math.PI / 2; edge.position.set(x, 0.03, 0); scene.add(edge);
        }

        // ==========================================
        // 4. GENERATOR OBJEK BERGERAK (MIMIC VIDEO)
        // ==========================================
        // Garis Putih Putus-putus
        function spawnRoadDash() {
            const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 3), CustomMaterial({ color: 0xffffff }));
            dash.rotation.x = -Math.PI / 2; dash.position.set(0, 0.04, -150);
            scene.add(dash); return dash;
        }

        // Koin Emas (+10 Score)
        function createCoin() {
            const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.15, 16), CustomMaterial({ color: 0xFFD700, roughness: 0.3, metalness: 0.8 }));
            coin.rotation.x = Math.PI / 2; coin.position.y = 1.2;
            coin.castShadow = true; coin.userData = { type: 'coin' }; return coin;
        }

        // Tiang Listrik
        function createTelegraphPole() {
            const group = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 8), CustomMaterial({ color: 0x5c4033 }));
            pole.position.y = 4; pole.castShadow = true; group.add(pole);
            const cross = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 0.2), CustomMaterial({ color: 0x5c4033 }));
            cross.position.set(0, 7, 0); group.add(cross);
            return group;
        }

        // Pohon Cemara Low Poly
        function createTree() {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.5), CustomMaterial({ color: 0x6e4726 }));
            trunk.position.y = 0.75; trunk.castShadow = true; group.add(trunk);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.8, 4, 5), CustomMaterial({ color: 0x2d6a4f, flatShading: true }));
            leaves.position.y = 3; leaves.castShadow = true; group.add(leaves);
            return group;
        }

        // Mobil Rintangan
        function createCar(colorStr) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.6, 4.5), CustomMaterial({ color: colorStr, flatShading: true }));
            body.position.y = 1; body.castShadow = true; group.add(body);
            const glass = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 3), CustomMaterial({ color: 0x111111 }));
            glass.position.set(0, 1.8, -0.2); group.add(glass);
            group.userData = { type: 'car' }; return group;
        }

        // Event Rel Kereta & Kereta Api
        let trainEventActive = false;
        function createTrainCrossing() {
            trainEventActive = true;
            const group = new THREE.Group();
            
            // Rel
            const rail1 = new THREE.Mesh(new THREE.BoxGeometry(100, 0.1, 0.2), CustomMaterial({color: 0x333}));
            rail1.position.set(0, 0.05, -1); group.add(rail1);
            const rail2 = new THREE.Mesh(new THREE.BoxGeometry(100, 0.1, 0.2), CustomMaterial({color: 0x333}));
            rail2.position.set(0, 0.05, 1); group.add(rail2);

            // Palang Pintu (Boom Gates)
            const gateMat = CustomMaterial({color: 0xff0000}); // Merah
            const gateL = new THREE.Mesh(new THREE.BoxGeometry(7, 0.3, 0.3), gateMat);
            gateL.position.set(-6, 2, 2); group.add(gateL);
            const gateR = new THREE.Mesh(new THREE.BoxGeometry(7, 0.3, 0.3), gateMat);
            gateR.position.set(6, 2, 2); group.add(gateR);

            // Kereta Api (Bergerak Nanti)
            const train = new THREE.Mesh(new THREE.BoxGeometry(40, 4, 3), CustomMaterial({color: 0xdddddd}));
            train.position.set(50, 2, 0); // Mulai dari kanan jauh
            train.castShadow = true;
            group.add(train);
            
            group.userData = { type: 'train_crossing', trainObj: train };
            group.position.set(0, 0, -180);
            scene.add(group);
            obstacles.push(group);
        }

        // ==========================================
        // 5. SETUP PLAYER & GAME VARIABLES
        // ==========================================
        let speed = 0.7; let score = 0;
        let objects = []; let obstacles = []; let lines = [];
        let playerTargetX = 0; let isGameOver = false; let gameStarted = false;
        let time = 0;

        let playerGroup = new THREE.Group(); scene.add(playerGroup);
        let playerModel; let mixer; const clock = new THREE.Clock();

        const loader = new THREE.GLTFLoader();
        loader.load('Ngantor rider.glb', function(gltf) {
            playerModel = gltf.scene; 
            playerModel.scale.set(1.1, 1.1, 1.1); 
            playerModel.rotation.y = Math.PI;
            
            // Terapkan shader melengkung ke pemain juga agar menyatu dengan pencahayaan
            playerModel.traverse(n => { 
                if (n.isMesh) { 
                    n.castShadow = true; n.receiveShadow = true; 
                    applyCurvedShader(n.material);
                } 
            });
            playerGroup.add(playerModel);
            const box = new THREE.Box3().setFromObject(playerModel);
            playerModel.position.y = -box.min.y + 0.02; 
            if (gltf.animations.length > 0) { mixer = new THREE.AnimationMixer(playerModel); mixer.clipAction(gltf.animations[0]).play(); }
        });

        // Kontrol
        function moveLeft() { if(playerTargetX > -4) playerTargetX -= 4; }
        function moveRight() { if(playerTargetX < 4) playerTargetX += 4; }
        window.addEventListener('keydown', (e) => { if(e.key==='ArrowLeft'||e.key==='a') moveLeft(); if(e.key==='ArrowRight'||e.key==='d') moveRight(); });
        document.getElementById('btn-left').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveLeft();});
        document.getElementById('btn-right').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveRight();});
        
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block'; 
            document.getElementById('controls').style.display = 'flex';
            const bgm = document.getElementById('bgm'); bgm.volume = 0.3; bgm.play().catch(()=>{});
            gameStarted = true; animate();
        });

        // UI Efek +10 Melayang
        function showFloatingScore() {
            const floatText = document.createElement('div');
            floatText.className = 'floating-score';
            floatText.innerText = '+10';
            floatText.style.left = (window.innerWidth / 2) + 'px';
            floatText.style.top = (window.innerHeight / 2 - 50) + 'px';
            document.body.appendChild(floatText);
            setTimeout(() => floatText.remove(), 1000);
        }

        // ==========================================
        // 6. SPAWNER LOGIC
        // ==========================================
        let frameCount = 0;
        function spawnElements() {
            // Garis Jalan
            if (frameCount % 10 === 0) lines.push(spawnRoadDash());

            // Pemandangan (Pohon & Tiang)
            if (frameCount % 15 === 0) {
                const side = Math.random() > 0.5 ? 1 : -1;
                const xPos = side * (Math.random() * 5 + 8);
                const obj = Math.random() > 0.3 ? createTree() : createTelegraphPole();
                obj.position.set(xPos, 0, -180);
                scene.add(obj); objects.push(obj);
            }

            // Koin (Berderet 3-5 koin)
            if (frameCount % 100 === 0 && !trainEventActive) {
                const lane = [-4, 0, 4][Math.floor(Math.random() * 3)];
                for(let i=0; i<4; i++){
                    const coin = createCoin();
                    coin.position.set(lane, 1.2, -180 - (i * 4));
                    scene.add(coin); objects.push(coin);
                }
            }

            // Mobil
            if (frameCount % 70 === 0 && !trainEventActive) {
                const colors = [0x00a86b, 0xffcc00, 0x333333]; // Hijau van, kuning, abu
                const car = createCar(colors[Math.floor(Math.random() * colors.length)]);
                car.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 0, -180);
                scene.add(car); obstacles.push(car);
            }

            // Event Rel Kereta (Setiap 500 frame)
            if (frameCount % 500 === 0) {
                createTrainCrossing();
            }
        }

        // ==========================================
        // 7. GAME LOOP UTAMA
        // ==========================================
        function animate() {
            if (isGameOver || !gameStarted) return;
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            
            time += 0.01;
            frameCount++;

            // Update Dunia Melengkung (Winding Road)
            // Nilai sinus membuat jalan berkelok mulus ke kiri dan kanan
            curveUniforms.curveX.value = Math.sin(time) * 0.0008;

            // Pergerakan Pemain
            playerGroup.position.x += (playerTargetX - playerGroup.position.x) * 0.15;
            // Agar pemain miring sedikit saat belok
            playerGroup.rotation.z = (playerGroup.position.x - playerTargetX) * 0.05;

            spawnElements();

            // Gerakkan Garis Jalan
            for (let i = lines.length - 1; i >= 0; i--) {
                lines[i].position.z += speed;
                if (lines[i].position.z > 20) { scene.remove(lines[i]); lines.splice(i, 1); }
            }

            // Gerakkan Koin & Pemandangan
            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                obj.position.z += speed;
                
                if (obj.userData.type === 'coin') {
                    obj.rotation.y += 0.1; // Animasi koin putar
                    if (Math.abs(obj.position.z - playerGroup.position.z) < 2 && Math.abs(obj.position.x - playerGroup.position.x) < 1.5) {
                        score += 10;
                        document.getElementById('score-display').innerText = score;
                        showFloatingScore();
                        scene.remove(obj); objects.splice(i, 1); continue;
                    }
                }
                if (obj.position.z > 30) { scene.remove(obj); objects.splice(i, 1); }
            }

            // Gerakkan Rintangan (Mobil & Kereta)
            trainEventActive = false; // Reset cek
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;

                if (obs.userData.type === 'train_crossing') {
                    trainEventActive = true; // Hentikan mobil spawn saat ada kereta
                    obs.userData.trainObj.position.x -= 0.6; // Kereta melaju ke kiri
                    
                    // Deteksi Tabrakan Kereta (Box Hitbox Lebar)
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 3) {
                        const trainX = obs.userData.trainObj.position.x;
                        if (Math.abs(trainX - playerGroup.position.x) < 20) {
                            crashGame();
                        }
                    }
                } 
                else if (obs.userData.type === 'car') {
                    // Deteksi Tabrakan Mobil
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 3 && Math.abs(obs.position.x - playerGroup.position.x) < 1.8) {
                        crashGame();
                    }
                }

                if (obs.position.z > 40) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            score += Math.floor(speed * 0.5); 
            document.getElementById('score-display').innerText = score;
            speed += 0.0001; 

            renderer.render(scene, camera);
        }

        function crashGame() {
            isGameOver = true;
            setTimeout(() => {
                alert("💥 CRASH!\nSkor Akhir: " + score);
                location.reload();
            }, 50);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
