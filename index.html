<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ngantor - Kurir Paket Low Poly</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #87CEEB; 
            touch-action: none; 
        }
        canvas { display: block; }
        
        /* UI HUD */
        #ui-container { 
            position: absolute; 
            top: 20px; 
            width: 100%; 
            text-align: center; 
            pointer-events: none; 
        }
        #title { 
            color: #FFB347; 
            font-size: 42px; 
            font-weight: 900; 
            text-shadow: 3px 3px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff; 
            margin: 0; 
        }
        .hud-text { 
            color: white; 
            font-size: 22px; 
            font-weight: bold; 
            text-shadow: 2px 2px 0 #333; 
            margin-top: 5px; 
        }
        
        /* Tombol Kontrol Layar */
        #controls { 
            position: absolute; 
            bottom: 30px; 
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            pointer-events: none; 
        }
        .btn { 
            pointer-events: auto; 
            padding: 18px 36px; 
            font-size: 22px; 
            font-weight: bold; 
            background: #FFB347; 
            border: 3px solid #fff; 
            border-radius: 15px; 
            color: white; 
            cursor: pointer; 
            box-shadow: 0 6px 0 #cc8400; 
            user-select: none; 
        }
        .btn:active { 
            transform: translateY(6px); 
            box-shadow: none; 
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <h1 id="title">Ngantor</h1>
        <div class="hud-text">Skor: <span id="score">0</span></div>
        <div class="hud-text" style="color: #FFD700;">📦 Paket: <span id="package-count">0</span></div>
    </div>
    
    <div id="controls">
        <button id="btn-left" class="btn">⬅️ KIRI</button>
        <button id="btn-right" class="btn">KANAN ➡️</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // ==========================================
        // 1. SCENE, CAMERA, RENDERER
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 110);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 1, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. PENCAHAYAAN
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // ==========================================
        // 3. JALAN & LINGKUNGAN
        // ==========================================
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200), 
            new THREE.MeshStandardMaterial({ color: 0x90EE90, flatShading: true })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(12, 200), 
            new THREE.MeshStandardMaterial({ color: 0x4a4a4a })
        );
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        // Garis Pemisah Jalan
        for (let laneX of [-2, 2]) {
            const line = new THREE.Mesh(
                new THREE.PlaneGeometry(0.2, 200), 
                new THREE.MeshBasicMaterial({ color: 0xffcc00 })
            );
            line.rotation.x = -Math.PI / 2;
            line.position.set(laneX, 0.01, 0);
            scene.add(line);
        }

        // ==========================================
        // 4. MEMBUAT POHON LOW-POLY STYLIZED (PROSEDURAL)
        // ==========================================
        function createStylizedTree() {
            const treeGroup = new THREE.Group();
            
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 2, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, flatShading: true });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const leafColors = [0x2e8b57, 0x3cb371, 0x228b22];
            const leafMat = new THREE.MeshStandardMaterial({ 
                color: leafColors[Math.floor(Math.random() * leafColors.length)], 
                flatShading: true 
            });

            const layers = [
                { r: 2.0, h: 2.2, y: 2.2 },
                { r: 1.6, h: 2.0, y: 3.2 },
                { r: 1.1, h: 1.7, y: 4.1 }
            ];

            layers.forEach(layer => {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(layer.r, layer.h, 5), leafMat);
                cone.position.y = layer.y;
                cone.rotation.y = Math.random() * Math.PI;
                cone.castShadow = true;
                treeGroup.add(cone);
            });

            return treeGroup;
        }

        // ==========================================
        // 5. VARIABLE GAME & PLAYER GROUP
        // ==========================================
        let speed = 0.6;
        let score = 0;
        let packageCount = 0;
        let obstacles = [];
        let packages = [];
        let scenery = [];
        let playerTargetX = 0;
        let isGameOver = false;

        let playerGroup = new THREE.Group(); // Wadah agar motor bisa diatur ketinggiannya
        scene.add(playerGroup);
        
        let playerModel;
        let mixer; 
        const clock = new THREE.Clock();

        // ==========================================
        // 6. MEMUAT MODEL MOTOR
        // ==========================================
        const loader = new THREE.GLTFLoader();
        loader.load(
            'Ngantor rider.glb', 
            function(gltf) {
                playerModel = gltf.scene;
                playerModel.scale.set(1.2, 1.2, 1.2); 
                playerModel.rotation.y = Math.PI; // Putar balik
                
                playerModel.traverse(function(node) {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                
                // Masukkan model ke dalam group
                playerGroup.add(playerModel);

                // PENYESUAIAN KETINGGIAN OTOMATIS
                // Mengkalkulasi titik terendah (ban motor) agar menempel aspal
                const box = new THREE.Box3().setFromObject(playerModel);
                playerModel.position.y = -box.min.y; 

                // CATATAN: Jika roda masih belum pas nempel di aspal, 
                // hapus kode "playerModel.position.y = -box.min.y;" di atas, 
                // lalu ganti dengan angka manual seperti di bawah ini:
                // playerModel.position.y = -1.5; 

                // Jalankan animasi
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(playerModel);
                    mixer.clipAction(gltf.animations[0]).play();
                }
            }, 
            undefined, 
            function(error) {
                console.error('Gagal memuat model 3D:', error);
            }
        );

        // ==========================================
        // 7. KONTROL PEMAIN
        // ==========================================
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && playerTargetX > -4) playerTargetX -= 4;
            if (e.key === 'ArrowRight' && playerTargetX < 4) playerTargetX += 4;
        });

        document.getElementById('btn-left').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (playerTargetX > -4) playerTargetX -= 4;
        });
        document.getElementById('btn-right').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (playerTargetX < 4) playerTargetX += 4;
        });

        // ==========================================
        // 8. GENERATOR RINTANGAN, PAKET, & LINGKUNGAN
        // ==========================================
        function spawnScenery() {
            const tree = createStylizedTree();
            const side = Math.random() > 0.5 ? 1 : -1;
            tree.position.set(side * (Math.random() * 12 + 8), 0, -120);
            
            const s = Math.random() * 0.4 + 0.8;
            tree.scale.set(s, s, s);
            
            scene.add(tree);
            scenery.push(tree);
        }

        function spawnObstacle() {
            const geo = new THREE.BoxGeometry(2.4, 1.8, 3.8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff3333, flatShading: true });
            const obs = new THREE.Mesh(geo, mat);
            obs.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 0.9, -120);
            obs.castShadow = true;
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnPackage() {
            const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const mat = new THREE.MeshStandardMaterial({ color: 0xD2691E, flatShading: true });
            const pkg = new THREE.Mesh(geo, mat);
            pkg.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 1, -120);
            pkg.castShadow = true;
            scene.add(pkg);
            packages.push(pkg);
        }

        // ==========================================
        // 9. GAME LOOP UTAMA
        // ==========================================
        let frameCount = 0;

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (mixer) mixer.update(delta);

            // Pindahkan playerGroup (Kiri/Kanan) secara halus
            playerGroup.position.x += (playerTargetX - playerGroup.position.x) * 0.15;

            frameCount++;
            if (frameCount % 8 === 0) spawnScenery();
            if (frameCount % 65 === 0) spawnObstacle();
            if (frameCount % 90 === 0) spawnPackage();

            // Pergerakan Pohon
            for (let i = scenery.length - 1; i >= 0; i--) {
                scenery[i].position.z += speed;
                if (scenery[i].position.z > 20) { scene.remove(scenery[i]); scenery.splice(i, 1); }
            }

            // Pergerakan & Pengambilan Paket
            for (let i = packages.length - 1; i >= 0; i--) {
                let pkg = packages[i];
                pkg.position.z += speed;
                pkg.rotation.y += 0.04;

                // Deteksi ambil paket (Menggunakan posisi playerGroup)
                if (Math.abs(pkg.position.z - playerGroup.position.z) < 2 && Math.abs(pkg.position.x - playerGroup.position.x) < 2) {
                    packageCount++;
                    score += 300;
                    document.getElementById('package-count').innerText = packageCount;
                    scene.remove(pkg);
                    packages.splice(i, 1);
                    continue;
                }
                if (pkg.position.z > 20) { scene.remove(pkg); packages.splice(i, 1); }
            }

            // Pergerakan & Tabrakan Mobil
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;

                // Deteksi tabrakan (Menggunakan posisi playerGroup)
                if (Math.abs(obs.position.z - playerGroup.position.z) < 2.5 && Math.abs(obs.position.x - playerGroup.position.x) < 1.8) {
                    isGameOver = true;
                    alert("Crash! Paket terkumpul: " + packageCount + "\nSkor: " + Math.floor(score / 10));
                }
                
                if (obs.position.z > 20) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            // Update Skor & Kecepatan
            score += 1;
            document.getElementById('score').innerText = Math.floor(score / 10);
            speed += 0.00015; 

            renderer.render(scene, camera);
        }

        // Penyesuaian ukuran layar jika di-resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // Mulai Game
        animate();
    </script>
</body>
</html>
