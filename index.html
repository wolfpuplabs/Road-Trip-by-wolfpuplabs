<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ngantor - Cinematic Rush</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #87CEEB; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation; 
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI HUD */
        #ui-container { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 100; display: none; }
        #title { color: #FFB347; font-size: 38px; font-weight: 900; text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; margin: 0; }
        .hud-card { display: inline-block; background: rgba(0, 0, 0, 0.45); padding: 6px 16px; border-radius: 20px; margin: 4px; backdrop-filter: blur(4px); }
        .hud-text { color: white; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        
        /* Animasi Skor Melayang */
        .floating-score { position: absolute; font-size: 32px; font-weight: 900; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; z-index: 500; pointer-events: none; animation: floatUp 1s ease-out forwards; transform: translateX(-50%); }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(1); opacity: 1; } 100% { transform: translate(-50%, -100px) scale(1.5); opacity: 0; } }

        /* Kontrol Kiri Kanan */
        #controls { position: absolute; bottom: 25px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 25px; z-index: 1000; }
        .btn { pointer-events: auto; width: 42vw; max-width: 180px; padding: 18px 0; font-size: 20px; font-weight: 900; background: #FFB347; border: 4px solid #ffffff; border-radius: 20px; color: white; cursor: pointer; text-align: center; box-shadow: 0 8px 0 #d18200; transition: transform 0.05s ease; }
        .btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #d18200; }

        /* Start Screen */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #87CEEB, #FFB6C1); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        #start-btn { padding: 15px 50px; font-size: 28px; font-weight: 900; background: #4CAF50; border: 5px solid #fff; border-radius: 15px; color: white; cursor: pointer; box-shadow: 0 8px 0 #2E7D32; animation: pulse 1.5s infinite; margin-top: 20px;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3" type="audio/mpeg">
    </audio>

    <div id="start-screen">
        <h1 style="color:white; font-size: 45px; text-shadow: 3px 3px 0 #333; margin: 0; text-align: center;">NGANTOR<br>CINEMATIC RUSH</h1>
        <button id="start-btn">PLAY</button>
        <p style="color: #333; font-weight: bold; margin-top: 20px; text-align: center;">Kini dengan Lampu Motor di Malam Hari!</p>
    </div>

    <div id="ui-container">
        <h1 id="title">Ngantor</h1>
        <div class="hud-card"><span class="hud-text">Skor: <span id="score">0</span></span></div>
        <div class="hud-card"><span class="hud-text" style="color: #FFD700;">📦 Paket: <span id="package-count">0</span></span></div>
    </div>
    
    <div id="controls">
        <button id="btn-left" class="btn">⬅️ KIRI</button>
        <button id="btn-right" class="btn">KANAN ➡️</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // ==========================================
        // 1. SISTEM AUDIO, SFX & SUARA MESIN
        // ==========================================
        let audioCtx, engineOsc, engineGain;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bgm = document.getElementById('bgm');
            bgm.volume = 0.2; bgm.play().catch(e => console.log(e));

            engineOsc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            engineGain = audioCtx.createGain();

            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(150, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playSfx(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'coin') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'slip') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // ==========================================
        // 2. SCENE, CAMERA, LIGHTING
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5.5, 10); camera.lookAt(0, 1, -15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6); scene.add(hemiLight);
        
        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024; sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(250, 300), new THREE.MeshStandardMaterial({ color: 0x6db33f, flatShading: true }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
        
        const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 300), new THREE.MeshStandardMaterial({ color: 0x3d3d3d }));
        road.rotation.x = -Math.PI / 2; road.position.y = 0.02; road.receiveShadow = true; scene.add(road);

        for (let side of [-6.2, 6.2]) {
            const curb = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 300), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
            curb.position.set(side, 0.1, 0); scene.add(curb);
        }

        let lines = [];
        for (let laneX of [-2, 2]) {
            for (let z = -150; z < 50; z += 15) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 6), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
                line.rotation.x = -Math.PI / 2; line.position.set(laneX, 0.03, z); scene.add(line); lines.push(line);
            }
        }

        // ==========================================
        // 3. GENERATOR OBJEK 3D (LOW POLY)
        // ==========================================
        function createMountains() {
            const mountGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x4a853b, flatShading: true });
            for (let i = 0; i < 16; i++) {
                const height = Math.random() * 25 + 20; const radius = Math.random() * 20 + 15;
                const mesh = new THREE.Mesh(new THREE.ConeGeometry(radius, height, 5), mat);
                const side = i % 2 === 0 ? -1 : 1;
                mesh.position.set(side * (Math.random() * 30 + 35), height / 2 - 2, (i * -18) - 20);
                mountGroup.add(mesh);
            }
            scene.add(mountGroup);
        }
        createMountains();

        let clouds = [];
        function createCloud() {
            const cloudGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
            const numPuffs = Math.floor(Math.random() * 3) + 3;
            for (let i = 0; i < numPuffs; i++) {
                const mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 2 + 1.5, 0), mat);
                mesh.position.set(i * 1.5, Math.random() * 0.8, Math.random() * 0.8); cloudGroup.add(mesh);
            }
            const side = Math.random() > 0.5 ? 1 : -1;
            cloudGroup.position.set(side * (Math.random() * 40 + 10), Math.random() * 10 + 20, -180);
            scene.add(cloudGroup); clouds.push(cloudGroup);
        }

        // Hewan Low Poly / Voxel Style
        function createCow() {
            const group = new THREE.Group();
            const matWhite = new THREE.MeshStandardMaterial({color: 0xffffff, flatShading: true});
            const matBlack = new THREE.MeshStandardMaterial({color: 0x222222, flatShading: true});
            const matPink = new THREE.MeshStandardMaterial({color: 0xffb6c1, flatShading: true});
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 2.2), matWhite);
            body.position.y = 1.2; body.castShadow = true; group.add(body);
            
            const spot1 = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.8, 0.8), matBlack);
            spot1.position.set(0, 1.2, 0.4); group.add(spot1);
            
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matWhite);
            head.position.set(0, 1.8, -1.2); head.castShadow = true; group.add(head);
            
            const snout = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.4, 0.4), matPink);
            snout.position.set(0, 1.6, -1.6); group.add(snout);
            
            for(let x of [-0.5, 0.5]) for(let z of [-0.8, 0.8]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), matBlack);
                leg.position.set(x, 0.4, z); leg.castShadow = true; group.add(leg);
            }
            group.userData = { type: 'animal' }; return group;
        }

        function createSheep() {
            const group = new THREE.Group();
            const matWool = new THREE.MeshStandardMaterial({color: 0xf4f4f4, flatShading: true});
            const matDark = new THREE.MeshStandardMaterial({color: 0x333333, flatShading: true});
            
            const wool = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.6), matWool);
            wool.position.y = 1.0; wool.castShadow = true; group.add(wool);
            
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), matDark);
            head.position.set(0, 1.3, -0.9); head.castShadow = true; group.add(head);
            
            for(let x of [-0.4, 0.4]) for(let z of [-0.5, 0.5]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), matDark);
                leg.position.set(x, 0.3, z); leg.castShadow = true; group.add(leg);
            }
            group.userData = { type: 'animal' }; return group;
        }

        // Koin Emas (Diubah materialnya agar terang)
        function createCoin() {
            const coin = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.6, 0.15, 10), 
                new THREE.MeshLambertMaterial({ color: 0xFFD700, emissive: 0x443300, flatShading: true })
            );
            coin.rotation.x = Math.PI / 2; coin.position.y = 1.2; coin.castShadow = true; coin.userData = { type: 'coin' }; return coin;
        }

        // Mobil, Jumpingan, Oli, Pohon, dll (Sama seperti sebelumnya)
        function createCar(color) {
            const group=new THREE.Group(); const body=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.4,4),new THREE.MeshStandardMaterial({color:color, flatShading:true}));
            body.position.y=0.9; body.castShadow=true; group.add(body);
            const top=new THREE.Mesh(new THREE.BoxGeometry(2,1,2.2),new THREE.MeshStandardMaterial({color:0x222222, flatShading:true}));
            top.position.set(0,1.8,-0.2); group.add(top); group.userData={type:'car'}; return group;
        }
        function createPineTree() {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 2, 5), new THREE.MeshStandardMaterial({ color: 0x6e4726, flatShading: true }));
            trunk.position.y = 1; trunk.castShadow = true; group.add(trunk);
            const mat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, flatShading: true });
            [{r: 2, h: 2.5, y: 2.2}, {r: 1.6, h: 2, y: 3.4}, {r: 1.1, h: 1.8, y: 4.4}].forEach(l => {
                const c = new THREE.Mesh(new THREE.ConeGeometry(l.r, l.h, 5), mat); c.position.y = l.y; c.castShadow = true; group.add(c);
            }); return group;
        }
        function createRamp() { const r=new THREE.Mesh(new THREE.BoxGeometry(3,0.2,4),new THREE.MeshStandardMaterial({color:0x8B4513, flatShading:true})); r.rotation.x=Math.PI/12; r.position.y=0.5; r.userData={type:'ramp'}; return r; }
        function createOil() { const o=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.05,12),new THREE.MeshBasicMaterial({color:0x111111})); o.position.y=0.05; o.userData={type:'oil'}; return o; }

        let streetLights = [];
        function createStreetLight(side) {
            const group = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 6, 6), new THREE.MeshStandardMaterial({ color: 0x444444, flatShading: true }));
            pole.position.y = 3; pole.castShadow = true; group.add(pole);
            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.2, 6), new THREE.MeshStandardMaterial({ color: 0x444444, flatShading: true }));
            arm.rotation.z = Math.PI / 2; arm.position.set(side === 1 ? -1 : 1, 5.8, 0); group.add(arm);
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.4), bulbMat);
            bulb.position.set(side === 1 ? -2 : 2, 5.7, 0); group.add(bulb);
            const beamMat = new THREE.MeshBasicMaterial({ color: 0xfffaed, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
            const beam = new THREE.Mesh(new THREE.ConeGeometry(2.5, 6, 8, 1, true), beamMat);
            beam.position.set(side === 1 ? -2 : 2, 2.8, 0); group.add(beam);
            group.userData = { isLight: true, bulbMat: bulbMat, beamMat: beamMat }; return group;
        }

        // ==========================================
        // 4. GAME VARIABLES, PLAYER, & LAMPU MOTOR
        // ==========================================
        let speed = 0.6; let score = 0; let packageCount = 0;
        let obstacles = []; let packages = []; let scenery = []; let smokeParticles = [];
        let playerTargetX = 0; let isGameOver = false; let gameStarted = false;
        
        let playerVelocityY = 0; let isJumping = false; const gravity = -0.015;
        let dayTime = Math.PI / 2; let isNight = false;

        let playerGroup = new THREE.Group(); scene.add(playerGroup);
        
        // --- LAMPU MOTOR (Player Lights) ---
        // Lampu penerang karakter agar tidak gelap
        const playerAmbientLight = new THREE.PointLight(0xffffff, 0, 5);
        playerAmbientLight.position.set(0, 2, 0);
        playerGroup.add(playerAmbientLight);

        // Lampu Sorot Jalan Depan
        const playerHeadLight = new THREE.SpotLight(0xfffaed, 0, 40, Math.PI/4, 0.5, 1);
        playerHeadLight.position.set(0, 1, 0.5);
        playerHeadLight.target.position.set(0, 0, -15);
        playerGroup.add(playerHeadLight);
        playerGroup.add(playerHeadLight.target);

        let playerModel; let mixer; const clock = new THREE.Clock();

        const loader = new THREE.GLTFLoader();
        loader.load('Ngantor rider.glb', function(gltf) {
            playerModel = gltf.scene; playerModel.scale.set(1.2, 1.2, 1.2); playerModel.rotation.y = Math.PI;
            playerModel.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
            playerGroup.add(playerModel);
            const box = new THREE.Box3().setFromObject(playerModel);
            playerModel.position.y = -box.min.y + 0.02; 
            if (gltf.animations.length > 0) { mixer = new THREE.AnimationMixer(playerModel); mixer.clipAction(gltf.animations[0]).play(); }
        });

        function moveLeft() { if(playerTargetX > -4 && !isJumping) playerTargetX -= 4; }
        function moveRight() { if(playerTargetX < 4 && !isJumping) playerTargetX += 4; }
        window.addEventListener('keydown', (e) => { if(e.key==='ArrowLeft'||e.key==='a') moveLeft(); if(e.key==='ArrowRight'||e.key==='d') moveRight(); });
        document.getElementById('btn-left').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveLeft();});
        document.getElementById('btn-right').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveRight();});
        
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block'; document.getElementById('controls').style.display = 'flex';
            initAudio(); gameStarted = true; animate();
        });

        function showFloatingScore(text, color) {
            const floatText = document.createElement('div');
            floatText.className = 'floating-score'; floatText.innerText = text; floatText.style.color = color || '#FFD700';
            floatText.style.left = '50%'; floatText.style.top = '40%';
            document.body.appendChild(floatText); setTimeout(() => floatText.remove(), 1000);
        }

        // ==========================================
        // 5. GAME LOOP UTAMA
        // ==========================================
        let frameCount = 0;

        function animate() {
            if (isGameOver || !gameStarted) return;
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            frameCount++;
            
            if (audioCtx && engineOsc) {
                const currentPitch = 40 + ((speed - 0.6) * 160); 
                engineOsc.frequency.setTargetAtTime(currentPitch, audioCtx.currentTime, 0.1);
            }

            // --- DAY AND NIGHT CYCLE ---
            dayTime += 0.001; 
            const sunY = Math.sin(dayTime); const sunZ = Math.cos(dayTime);
            sunLight.position.set(20, sunY * 50, sunZ * 50);

            const colorDay = new THREE.Color(0x7ec0ee); const colorSunset = new THREE.Color(0xff8c42); const colorNight = new THREE.Color(0x0a0a1a);
            let skyColor = new THREE.Color();
            
            if (sunY > 0.3) {
                skyColor = colorDay; isNight = false; sunLight.intensity = 1.2; hemiLight.intensity = 0.6;
            } else if (sunY > 0) {
                let lerpFactor = (0.3 - sunY) / 0.3; skyColor.lerpColors(colorDay, colorSunset, lerpFactor);
                isNight = false; sunLight.intensity = 1.2 - (lerpFactor * 0.8);
            } else if (sunY > -0.3) {
                let lerpFactor = (-sunY) / 0.3; skyColor.lerpColors(colorSunset, colorNight, lerpFactor);
                isNight = true; sunLight.intensity = 0; hemiLight.intensity = 0.15;
            } else {
                skyColor = colorNight; isNight = true; sunLight.intensity = 0;
            }
            scene.background = skyColor; scene.fog.color = skyColor;

            // --- LAMPU MOTOR ON/OFF OTOMATIS ---
            if (isNight) {
                playerAmbientLight.intensity = 0.6; // Menerangi karakter
                playerHeadLight.intensity = 2.0; // Sorot jalan
            } else {
                playerAmbientLight.intensity = 0;
                playerHeadLight.intensity = 0;
            }

            // Pergerakan Motor
            playerGroup.position.x += (playerTargetX - playerGroup.position.x) * 0.18;
            playerGroup.position.y += playerVelocityY;
            if (playerGroup.position.y > 0) {
                playerVelocityY += gravity; isJumping = true;
            } else {
                playerGroup.position.y = 0; playerVelocityY = 0; isJumping = false;
            }
            camera.position.y = 5.5 + (playerGroup.position.y * 0.4);

            // --- SPAWNER LINGKUNGAN ---
            if (frameCount % 10 === 0) {
                const tree = createPineTree(); tree.position.set((Math.random() > 0.5 ? 1 : -1) * (Math.random() * 10 + 8), 2, -180); 
                scene.add(tree); scenery.push(tree);
            }
            if (frameCount % 45 === 0) createCloud();
            if (frameCount % 60 === 0) {
                const lightSide = Math.random() > 0.5 ? 1 : -1;
                const sLight = createStreetLight(lightSide); sLight.position.set(lightSide * 7.5, 0, -180);
                scene.add(sLight); scenery.push(sLight);
            }

            // --- SPAWNER RINTANGAN & ITEM ---
            if (frameCount % 60 === 0) {
                let obj; const rand = Math.random();
                if (rand < 0.6) obj = createCar([0xd90429, 0x00b4d8, 0xffb703][Math.floor(Math.random()*3)]);
                else if (rand < 0.8) obj = createRamp(); else obj = createOil();
                obj.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 0, -180); scene.add(obj); obstacles.push(obj);
            }
            if (frameCount % 180 === 0) {
                let animal = Math.random() > 0.5 ? createCow() : createSheep();
                let startSide = Math.random() > 0.5 ? 1 : -1; 
                animal.position.set(startSide * 7, 0, -180); animal.rotation.y = startSide === 1 ? -Math.PI/2 : Math.PI/2;
                animal.userData.speedX = startSide === 1 ? -0.05 : 0.05; scene.add(animal); obstacles.push(animal);
            }
            if (frameCount % 85 === 0) {
                const pkg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xd4a373, flatShading: true }));
                pkg.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 1, -180); pkg.userData = {type: 'box'};
                scene.add(pkg); packages.push(pkg);
            }
            if (frameCount % 120 === 0) {
                const lane = [-4, 0, 4][Math.floor(Math.random() * 3)];
                for(let i=0; i<3; i++){
                    const coin = createCoin(); coin.position.set(lane, 1.2, -180 - (i * 4)); scene.add(coin); packages.push(coin); 
                }
            }

            // --- ANIMASI GARIS JALAN & ASAP ---
            for (let i = 0; i < lines.length; i++) {
                lines[i].position.z += speed;
                if (lines[i].position.z > 30) lines[i].position.z -= 180;
            }
            
            if (frameCount % 4 === 0) {
                const smoke = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2, 0), new THREE.MeshBasicMaterial({ color: 0xdcdcdc, transparent: true, opacity: 0.8 }));
                smoke.position.set(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z + 1.8);
                smoke.userData = { vx: (Math.random() - 0.5) * 0.03, vy: Math.random() * 0.03 + 0.02, vz: speed * 0.5 + Math.random() * 0.05, life: 1.0 };
                scene.add(smoke); smokeParticles.push(smoke);
            }
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                let p = smokeParticles[i];
                p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.scale.setScalar(p.userData.life); p.material.opacity = p.userData.life; p.userData.life -= 0.03;
                if (p.userData.life <= 0) { scene.remove(p); p.geometry.dispose(); p.material.dispose(); smokeParticles.splice(i, 1); }
            }

            // --- PERGERAKAN SCENERY & LAMPU JALAN ---
            for (let i = clouds.length - 1; i >= 0; i--) {
                clouds[i].position.z += speed * 0.4;
                if (clouds[i].position.z > 30) { scene.remove(clouds[i]); clouds.splice(i, 1); }
            }
            for (let i = scenery.length - 1; i >= 0; i--) {
                let obj = scenery[i];
                obj.position.z += speed;
                if (obj.userData.isLight) {
                    if (isNight) { obj.userData.beamMat.opacity = 0.35; obj.userData.bulbMat.color.setHex(0xffffcc); } 
                    else { obj.userData.beamMat.opacity = 0; obj.userData.bulbMat.color.setHex(0x222222); }
                }
                if (obj.position.z > 30) { scene.remove(obj); scenery.splice(i, 1); }
            }

            // --- KOLEKSI (BOX & KOIN) ---
            for (let i = packages.length - 1; i >= 0; i--) {
                let pkg = packages[i];
                pkg.position.z += speed; 
                pkg.userData.type === 'coin' ? pkg.rotation.y += 0.1 : pkg.rotation.y += 0.05;

                if (Math.abs(pkg.position.z - playerGroup.position.z) < 2.2 && Math.abs(pkg.position.x - playerGroup.position.x) < 1.8 && !isJumping) {
                    if (pkg.userData.type === 'coin') {
                        score += 10; showFloatingScore('+10', '#FFD700'); playSfx('coin');
                    } else {
                        packageCount++; score += 100; document.getElementById('package-count').innerText = packageCount;
                        showFloatingScore('+1📦', '#FFB347'); playSfx('coin');
                    }
                    scene.remove(pkg); packages.splice(i, 1); continue;
                }
                if (pkg.position.z > 30) { scene.remove(pkg); packages.splice(i, 1); }
            }

            // --- RINTANGAN & TABRAKAN ---
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;
                
                if (obs.userData.type === 'animal') {
                    obs.position.x += obs.userData.speedX;
                    obs.rotation.z = Math.sin(frameCount * 0.2) * 0.05; 
                }

                let hitDistZ = 2.8; let hitDistX = 1.8;
                if(obs.userData.type === 'animal') { hitDistZ = 1.6; hitDistX = 1.5; }

                if (Math.abs(obs.position.z - playerGroup.position.z) < hitDistZ && Math.abs(obs.position.x - playerGroup.position.x) < hitDistX) {
                    if (obs.userData.type === 'ramp' && !isJumping) {
                        playerVelocityY = 0.35; obs.userData.type = 'used';
                    } else if (obs.userData.type === 'oil' && !isJumping) {
                        playSfx('slip');
                        let avail = [-4, 0, 4].filter(l => l !== playerTargetX);
                        playerTargetX = avail[Math.floor(Math.random() * 2)];
                        obs.position.y = -10;
                    } else if ((obs.userData.type === 'car' || obs.userData.type === 'animal') && playerGroup.position.y < 1.2) {
                        isGameOver = true;
                        if(engineGain) engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
                        setTimeout(() => {
                            let msg = obs.userData.type === 'animal' ? "Aduh! Kamu nabrak hewan nyebrang!" : "💥 CRASH!";
                            alert(msg + "\nTotal Paket: " + packageCount + "\nSkor Akhir: " + Math.floor(score));
                            location.reload();
                        }, 50);
                    }
                }
                if (obs.position.z > 40) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            score += Math.floor(speed * 0.5); document.getElementById('score').innerText = score; speed += 0.00012; 
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
