<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Road Trip - Cinematic Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Nunito', sans-serif; 
            background-color: #87CEEB; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation; 
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI HUD (Glassmorphism) */
        #ui-container { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 100; display: none; }
        #title { color: #FF9800; font-size: 40px; font-weight: 900; text-shadow: 2px 2px 0 #FFF, -1px -1px 0 #FFF, 1px -1px 0 #FFF, -1px 1px 0 #FFF, 0px 6px 10px rgba(0,0,0,0.3); margin: 0; letter-spacing: 2px; }
        .hud-card { display: inline-block; background: rgba(255, 255, 255, 0.25); padding: 8px 20px; border-radius: 30px; margin: 4px; backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.6); box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.1s; }
        .hud-text { color: #222; font-size: 20px; font-weight: 900; text-shadow: 1px 1px 0 #fff; }
        
        #combo-container { position: absolute; top: 90px; right: 25px; font-size: 32px; font-weight: 900; color: #ffeb3b; text-shadow: 2px 2px 0 #e65100, -1px -1px 0 #e65100, 1px -1px 0 #e65100, -1px 1px 0 #e65100; opacity: 0; transition: opacity 0.3s, transform 0.1s; transform: scale(1); z-index: 100;}
        
        /* Floating Score Effect */
        .floating-score { position: absolute; font-size: 34px; font-weight: 900; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; z-index: 500; pointer-events: none; animation: floatUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: translateX(-50%); }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; } 50% { transform: translate(-50%, -60px) scale(1.3); opacity: 1; } 100% { transform: translate(-50%, -100px) scale(1); opacity: 0; } }

        /* Kontrol */
        #controls { position: absolute; bottom: 25px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 25px; z-index: 1000; }
        .btn { pointer-events: auto; width: 42vw; max-width: 160px; padding: 18px 0; font-size: 20px; font-weight: 900; background: linear-gradient(to bottom, #FFB347, #FF9800); border: 4px solid #ffffff; border-radius: 25px; color: white; cursor: pointer; text-align: center; box-shadow: 0 8px 0 #c27600, 0 15px 20px rgba(0,0,0,0.3); transition: all 0.1s ease; }
        .btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #c27600, 0 5px 10px rgba(0,0,0,0.3); }

        /* Start Screen */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1e3c72, #2a5298); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        #start-btn { padding: 16px 55px; font-size: 30px; font-weight: 900; background: #4CAF50; border: 5px solid #fff; border-radius: 30px; color: white; cursor: pointer; box-shadow: 0 10px 0 #2E7D32, 0 15px 30px rgba(0,0,0,0.4); animation: pulse 1.5s infinite; margin-top: 30px;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3" type="audio/mpeg">
    </audio>

    <div id="start-screen">
        <h1 style="color:#FFC107; font-size: 60px; text-shadow: 4px 4px 0 #000; margin: 0; text-align: center; line-height: 1.1;">ROAD TRIP</h1>
        <button id="start-btn">RIDE NOW</button>
        <p style="color: #fff; font-size: 16px; font-weight: bold; margin-top: 25px; text-shadow: 1px 1px 2px #000; text-align: center;">Perjalanan Melintasi Gunung, Desa & Pantai!</p>
    </div>

    <div id="ui-container">
        <h1 id="title">Road Trip</h1>
        <div class="hud-card" id="score-card"><span class="hud-text">Skor: <span id="score" style="color:#FF5722;">0</span></span></div>
        <div class="hud-card"><span class="hud-text">📦 Paket: <span id="package-count" style="color:#4CAF50;">0</span></span></div>
    </div>
    <div id="combo-container">x<span id="combo-text">1</span> COMBO!</div>
    
    <div id="controls">
        <button id="btn-left" class="btn">⬅️ KIRI</button>
        <button id="btn-right" class="btn">KANAN ➡️</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // ==========================================
        // 1. TEXTURE GENERATORS (CAHAYA LAMPU & JENDELA)
        // ==========================================
        // Membuat tekstur pendaran cahaya (Glow) untuk lampu jalan tanpa membebani WebGL
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 245, 200, 0.8)');
            gradient.addColorStop(0.4, 'rgba(255, 240, 150, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 240, 150, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 128, 128);
            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }
        const glowTex = createGlowTexture();

        // ==========================================
        // 2. AUDIO & SFX
        // ==========================================
        let audioCtx, engineOsc, engineGain;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bgm = document.getElementById('bgm');
            bgm.volume = 0.2; bgm.play().catch(e => console.log(e));

            engineOsc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            engineGain = audioCtx.createGain();

            engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playSfx(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'coin') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'jump') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'slip') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // ==========================================
        // 3. SCENE, CAMERA, & DRAMATIC HDR LIGHTING
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.007);
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5.5, 11); camera.lookAt(0, 1, -15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // PENGATURAN CINEMATIC (Tebal, Vibrant, Shadows Tajam)
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.85; // Sedikit diturunkan agar warna tidak overbright/flat
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.15); // Rendah agar shadow pekat
        scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.3); // Sky to ground light
        scene.add(hemiLight);
        
        const sunLight = new THREE.DirectionalLight(0xfffaed, 2.0); // Matahari sangat kuat
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 150;
        sunLight.shadow.camera.left = -35; sunLight.shadow.camera.right = 35;
        sunLight.shadow.camera.top = 40; sunLight.shadow.camera.bottom = -25;
        sunLight.shadow.bias = -0.0005; 
        scene.add(sunLight);

        const moonLight = new THREE.DirectionalLight(0x88bbff, 0.0);
        moonLight.castShadow = false; // Hindari shadow dobel yang berat
        scene.add(moonLight);

        // ==========================================
        // 4. TERRAIN & JALAN UTAMA
        // ==========================================
        // Tanah akan berubah warna sesuai biome
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x388e3c, flatShading: true, roughness: 1 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 400), groundMat);
        ground.rotation.x = -Math.PI / 2; ground.position.y = 0; ground.receiveShadow = true; scene.add(ground);

        const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.8 }); // Aspal lebih gelap & realistis
        const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 400), roadMat);
        road.rotation.x = -Math.PI / 2; road.position.y = 0.02; road.receiveShadow = true; scene.add(road);

        // Trotoar pembatas
        for (let side of [-6.2, 6.2]) {
            const curb = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 400), new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 }));
            curb.position.set(side, 0.1, 0); curb.receiveShadow = true; curb.castShadow = true; scene.add(curb);
        }
        
        let lines = [];
        for (let laneX of [-2, 2]) {
            for (let z = -150; z < 50; z += 15) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 6), new THREE.MeshBasicMaterial({ color: 0xffb300 }));
                line.rotation.x = -Math.PI / 2; line.position.set(laneX, 0.03, z); scene.add(line); lines.push(line);
            }
        }

        // ==========================================
        // 5. GENERATOR OBJEK LOW POLY AESTHETIC
        // ==========================================
        function createPineTree() {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 2, 5), new THREE.MeshStandardMaterial({ color: 0x4e342e, flatShading: true }));
            trunk.position.y = 1; trunk.castShadow = true; group.add(trunk);
            const mat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, flatShading: true });
            let yPos = 2.2; let rad = 2.2;
            for(let i=0; i<3; i++) {
                const c = new THREE.Mesh(new THREE.ConeGeometry(rad, 2.8, 6), mat);
                c.position.y = yPos; c.rotation.y = Math.random(); c.rotation.x = (Math.random()-0.5)*0.1; c.castShadow = true; group.add(c);
                yPos += 1.3; rad -= 0.6;
            }
            return group;
        }

        function createPalmTree() {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6d4c41, flatShading: true });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x388e3c, flatShading: true });
            for(let i=0; i<6; i++) {
                const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.35 - i*0.04, 0.4 - i*0.04, 1, 6), trunkMat);
                seg.position.set(i*0.15, i*0.9 + 0.5, 0); seg.rotation.z = -0.15; seg.castShadow = true; group.add(seg);
            }
            for(let a=0; a<5; a++) {
                const leaf = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.1, 1.0), leafMat);
                leaf.position.set(0.8, 5.5, 0); leaf.rotation.y = (a * Math.PI / 2.5); leaf.rotation.z = -0.4; leaf.castShadow = true; group.add(leaf);
            }
            const nutMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, flatShading: true });
            for(let c=0; c<3; c++) {
                const nut = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35, 0), nutMat);
                nut.position.set(0.6 + Math.random()*0.4, 5.0, (Math.random()-0.5)*0.8); nut.castShadow = true; group.add(nut);
            }
            return group;
        }

        function createVillageHouse() {
            const group = new THREE.Group();
            const wall = new THREE.Mesh(new THREE.BoxGeometry(4.5, 3.5, 4.5), new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }));
            wall.position.y = 1.75; wall.castShadow = true; wall.receiveShadow = true; group.add(wall);
            
            const roof = new THREE.Mesh(new THREE.ConeGeometry(4.2, 2.5, 4), new THREE.MeshStandardMaterial({ color: [0xc62828, 0x1565c0, 0xe65100][Math.floor(Math.random()*3)], flatShading: true }));
            roof.rotation.y = Math.PI/4; roof.position.y = 4.75; roof.castShadow = true; group.add(roof);
            
            const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.0, 4.6), new THREE.MeshStandardMaterial({ color: 0x3e2723 }));
            door.position.set(0, 1.0, 0); group.add(door);
            
            // Jendela dengan Material Emissive (Menyala saat malam)
            const winMat = new THREE.MeshStandardMaterial({ color: 0xb3e5fc, emissive: 0x000000, metalness: 0.5, roughness: 0.2 });
            const window = new THREE.Mesh(new THREE.BoxGeometry(4.6, 1.2, 1.8), winMat);
            window.position.set(0, 1.8, 0); group.add(window);
            
            const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.0, 0.6), new THREE.MeshStandardMaterial({ color: 0x3e2723 }));
            chimney.position.set(1.2, 5.0, 1.2); chimney.castShadow = true; group.add(chimney);
            
            group.userData = { isHouse: true, winMat: winMat }; return group;
        }

        function createRock() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x78909c, flatShading: true, roughness: 0.8 });
            const r1 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.6 + Math.random()*0.4, 0), mat); r1.position.set(0,0.4,0); r1.castShadow=true; group.add(r1);
            const r2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4 + Math.random()*0.3, 0), mat); r2.position.set(0.6,0.3,0.5); r2.castShadow=true; group.add(r2);
            return group;
        }

        function createFence() {
            const fence = new THREE.Group(); const mat = new THREE.MeshStandardMaterial({ color: 0x5d4037, flatShading: true });
            const post = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.2, 0.2), mat); post.position.y = 0.6; post.castShadow = true; fence.add(post);
            const bar1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 4), mat); bar1.position.set(0, 0.8, 0); fence.add(bar1);
            const bar2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 4), mat); bar2.position.set(0, 0.4, 0); fence.add(bar2);
            return fence;
        }

        // Lampu Jalan dengan Ground Illumination (Performa Tinggi, Tanpa Cone Mesh!)
        function createStreetLight(side) {
            const group = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 7, 6), new THREE.MeshStandardMaterial({ color: 0x37474f, flatShading: true }));
            pole.position.y = 3.5; pole.castShadow = true; group.add(pole);
            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.5, 6), new THREE.MeshStandardMaterial({ color: 0x37474f, flatShading: true }));
            arm.rotation.z = Math.PI / 2; arm.position.set(side === 1 ? -1 : 1, 6.8, 0); group.add(arm);
            
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.4), bulbMat);
            bulb.position.set(side === 1 ? -2.2 : 2.2, 6.7, 0); group.add(bulb);
            
            // Ground Light Effect (Sangat Ringan, 0% beban lampu WebGL)
            const groundGlowMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
            const groundGlow = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), groundGlowMat);
            groundGlow.rotation.x = -Math.PI / 2; groundGlow.position.set(side === 1 ? -2.2 : 2.2, 0.05, 0); group.add(groundGlow);

            group.userData = { isLight: true, bulbMat: bulbMat, glowMat: groundGlowMat }; return group;
        }

        // Hewan (Sapi & Biri-Biri)
        function createCow() {
            const group = new THREE.Group();
            const matW = new THREE.MeshStandardMaterial({color: 0xffffff, flatShading: true});
            const matB = new THREE.MeshStandardMaterial({color: 0x222222, flatShading: true});
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 2.2), matW); body.position.y = 1.2; body.castShadow = true; group.add(body);
            const spot = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.8, 0.8), matB); spot.position.set(0, 1.2, 0.2); group.add(spot);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 1.0), matW); head.position.set(0, 1.8, 1.2); head.castShadow = true; group.add(head);
            const snout = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.4, 0.4), new THREE.MeshStandardMaterial({color: 0xf48fb1, flatShading:true})); snout.position.set(0, 1.6, 1.6); group.add(snout);
            for(let x of [-0.5, 0.5]) for(let z of [-0.8, 0.8]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), matB); leg.position.set(x, 0.4, z); leg.castShadow = true; group.add(leg);
            }
            group.userData = { type: 'animal' }; return group;
        }

        function createSheep() {
            const group = new THREE.Group();
            const matW = new THREE.MeshStandardMaterial({color: 0xf4f4f4, flatShading: true});
            const matD = new THREE.MeshStandardMaterial({color: 0x333333, flatShading: true});
            const wool = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9, 0), matW); wool.position.y = 1.1; wool.castShadow = true; group.add(wool);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.7), matD); head.position.set(0, 1.4, 0.8); head.castShadow = true; group.add(head);
            for(let x of [-0.3, 0.3]) for(let z of [-0.4, 0.4]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), matD); leg.position.set(x, 0.3, z); leg.castShadow = true; group.add(leg);
            }
            group.userData = { type: 'animal' }; return group;
        }

        // Rintangan (Mobil, Kereta, Ramp, Oli)
        function createCar(colorHex) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({color: colorHex, flatShading: true, roughness: 0.6});
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.4), bodyMat); body.position.set(0, 0.7, 0); body.castShadow = true; group.add(body);
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.4), bodyMat); cabin.position.set(0, 1.4, -0.2); cabin.castShadow = true; group.add(cabin);
            const glass = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.5, 2.45), new THREE.MeshStandardMaterial({color: 0x111122, roughness: 0.1})); glass.position.set(0, 1.4, -0.2); group.add(glass);
            
            const wheelMat = new THREE.MeshStandardMaterial({color: 0x111111, flatShading: true});
            for(let x of [-1.15, 1.15]) for(let z of [-1.3, 1.3]) {
                const w = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 8), wheelMat); w.rotation.z=Math.PI/2; w.position.set(x,0.4,z); w.castShadow=true; group.add(w);
            }
            const brakeMat = new THREE.MeshBasicMaterial({color: 0xff0000});
            for(let x of [-0.8, 0.8]) { const tl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), brakeMat); tl.position.set(x, 0.8, 2.21); group.add(tl); }
            
            // Lampu Sorot Jalan Mobil Musuh (Fake Ground Light)
            const hlMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
            const hl = new THREE.Mesh(new THREE.PlaneGeometry(5, 8), hlMat); hl.rotation.x = -Math.PI/2; hl.position.set(0, 0.05, -3); group.add(hl);

            group.userData = { type: 'car', driveSpeed: Math.random() * 0.15 + 0.1, headLightMat: hlMat }; return group;
        }

        function createTrainCrossing() {
            const group = new THREE.Group();
            const ironMat = new THREE.MeshStandardMaterial({color: 0x9e9e9e, flatShading: true, metalness: 0.6, roughness: 0.4});
            const woodMat = new THREE.MeshStandardMaterial({color: 0x4e342e, flatShading: true});
            const ballastMat = new THREE.MeshStandardMaterial({color: 0x546e7a, flatShading: true});
            
            const ballast = new THREE.Mesh(new THREE.BoxGeometry(20, 0.12, 10), ballastMat); ballast.position.set(0, 0.02, 0); ballast.receiveShadow = true; group.add(ballast);
            for(let i=0; i<7; i++){ const wood = new THREE.Mesh(new THREE.BoxGeometry(16, 0.1, 0.6), woodMat); wood.position.set(0, 0.08, i*1.4 - 4.2); wood.receiveShadow = true; wood.castShadow=true; group.add(wood); }
            const rail1 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 10), ironMat); rail1.position.set(-2, 0.15, 0); rail1.castShadow=true; group.add(rail1);
            const rail2 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 10), ironMat); rail2.position.set(2, 0.15, 0); rail2.castShadow=true; group.add(rail2);

            const poleMat = new THREE.MeshStandardMaterial({color: 0x212121});
            const barMat = new THREE.MeshStandardMaterial({color: 0xd32f2f});
            let warningLights = [];
            for (let side of [-6.5, 6.5]) {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3.5), poleMat); pole.position.set(side, 1.75, 2.5); pole.castShadow = true; group.add(pole);
                const bar = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.25, 0.1), barMat); bar.position.set(side === -6.5 ? -3.5 : 3.5, 1.6, 2.5); bar.castShadow = true; group.add(bar);
                const wlMat = new THREE.MeshBasicMaterial({color: 0x330000});
                const wLight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.2), wlMat); wLight.position.set(side, 3.2, 2.6); group.add(wLight); warningLights.push(wlMat);
            }

            const trainGroup = new THREE.Group();
            const loco = new THREE.Mesh(new THREE.BoxGeometry(18, 4, 3.5), new THREE.MeshStandardMaterial({color: 0xffb300, flatShading: true})); loco.position.set(0, 2.5, 0); loco.castShadow = true; trainGroup.add(loco);
            const cab = new THREE.Mesh(new THREE.BoxGeometry(6, 1.5, 3.5), new THREE.MeshStandardMaterial({color: 0x263238, flatShading: true})); cab.position.set(-5, 4.5, 0); cab.castShadow = true; trainGroup.add(cab);
            
            const car2 = loco.clone(); car2.position.set(19, 2.5, 0); trainGroup.add(car2);
            const car3 = loco.clone(); car3.position.set(38, 2.5, 0); trainGroup.add(car3);
            trainGroup.position.set(50, 0, 0); group.add(trainGroup);

            group.userData = { type: 'train_crossing', trainObj: trainGroup, warningLights: warningLights, flashTimer: 0 }; return group;
        }

        function createRiverBridge() {
            const group = new THREE.Group();
            const water = new THREE.Mesh(new THREE.PlaneGeometry(300, 25), new THREE.MeshStandardMaterial({color: 0x0277bd, flatShading: true, roughness: 0.1}));
            water.rotation.x = -Math.PI/2; water.position.y = 0.03; group.add(water);
            
            const woodMat = new THREE.MeshStandardMaterial({color: 0x4e342e, flatShading: true});
            const bridge = new THREE.Mesh(new THREE.BoxGeometry(14, 0.2, 25), woodMat);
            bridge.position.y = 0.05; bridge.receiveShadow = true; group.add(bridge);
            
            for(let side of [-6.5, 6.5]) {
                const rail = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.0, 25), woodMat);
                rail.position.set(side, 0.6, 0); rail.castShadow = true; group.add(rail);
            }
            group.userData = { type: 'scenery' }; return group;
        }

        function createCoin() {
            const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.15, 12), new THREE.MeshStandardMaterial({ color: 0xffd54f, emissive: 0x554400, roughness: 0.2, metalness: 0.8, flatShading: true }));
            coin.rotation.x = Math.PI / 2; coin.position.y = 1.2; coin.castShadow = true; coin.userData = { type: 'coin' }; return coin;
        }

        // ==========================================
        // 5. PLAYER & GAME LOOP VARIABLES
        // ==========================================
        let speed = 0.65; let score = 0; let packageCount = 0; let distanceTravelled = 0;
        let combo = 1; let comboTimer = 0; 
        let obstacles = []; let packages = []; let scenery = []; let particles = []; let smokeParticles = [];
        let playerTargetX = 0; let isGameOver = false; let gameStarted = false; let trainEventActive = false;
        
        // Biome System (0: Hutan/Gunung, 1: Desa/Peternakan, 2: Pantai)
        let currentBiome = 0;
        let targetGroundColor = new THREE.Color(0x388e3c); 
        
        let playerVelocityY = 0; let isJumping = false; const gravity = -0.015;
        let dayTime = Math.PI / 2; let isNight = false; let cameraShake = 0;

        let playerGroup = new THREE.Group(); scene.add(playerGroup);
        const playerHeadLight = new THREE.SpotLight(0xfffaed, 0, 45, Math.PI/4, 0.5, 1);
        playerHeadLight.position.set(0, 1.5, 0); playerHeadLight.target.position.set(0, 0, -15);
        playerGroup.add(playerHeadLight); playerGroup.add(playerHeadLight.target);

        let playerModel; let mixer; const clock = new THREE.Clock();
        const loader = new THREE.GLTFLoader();
        loader.load('Ngantor rider.glb', function(gltf) {
            playerModel = gltf.scene; playerModel.scale.set(1.1, 1.1, 1.1); playerModel.rotation.y = Math.PI;
            playerModel.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
            playerGroup.add(playerModel);
            const box = new THREE.Box3().setFromObject(playerModel);
            playerModel.position.y = -box.min.y + 0.02; 
            if (gltf.animations.length > 0) { mixer = new THREE.AnimationMixer(playerModel); mixer.clipAction(gltf.animations[0]).play(); }
        });

        function moveLeft() { if(playerTargetX > -4 && !isJumping) playerTargetX -= 4; }
        function moveRight() { if(playerTargetX < 4 && !isJumping) playerTargetX += 4; }
        window.addEventListener('keydown', (e) => { if(e.key==='ArrowLeft'||e.key==='a') moveLeft(); if(e.key==='ArrowRight'||e.key==='d') moveRight(); });
        document.getElementById('btn-left').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveLeft();});
        document.getElementById('btn-right').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveRight();});
        
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block'; document.getElementById('controls').style.display = 'flex';
            initAudio(); gameStarted = true; animate();
        });

        function showFloatingScore(text, color) {
            const floatText = document.createElement('div'); floatText.className = 'floating-score'; floatText.innerText = text; floatText.style.color = color || '#FFC107';
            floatText.style.left = '50%'; floatText.style.top = '30%'; document.body.appendChild(floatText); setTimeout(() => floatText.remove(), 1000);
            const scoreCard = document.getElementById('score-card');
            scoreCard.style.transform = 'scale(1.1)'; setTimeout(()=> scoreCard.style.transform = 'scale(1)', 100);
        }

        function createExplosion(x, y, z, colorHex) {
            for(let i=0; i<10; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({color: colorHex}));
                p.position.set(x, y, z); p.userData = { vx: (Math.random()-0.5)*0.4, vy: Math.random()*0.4, vz: (Math.random()-0.5)*0.4, life: 1 };
                scene.add(p); particles.push(p);
            }
        }

        // ==========================================
        // 6. GAME LOOP & BIOME MANAGER
        // ==========================================
        let frameCount = 0;

        function animate() {
            if (isGameOver || !gameStarted) return;
            requestAnimationFrame(animate);
            const delta = clock.getDelta(); const time = clock.getElapsedTime();
            if (mixer) mixer.update(delta);
            frameCount++;
            distanceTravelled += speed;

            // --- BIOME MANAGER ---
            if (score < 1500) { currentBiome = 0; targetGroundColor.setHex(0x388e3c); } // Gunung
            else if (score < 3500) { currentBiome = 1; targetGroundColor.setHex(0x7cb342); } // Desa
            else { currentBiome = 2; targetGroundColor.setHex(0xe9c46a); } // Pantai

            ground.material.color.lerp(targetGroundColor, 0.01); // Smooth transition warna tanah

            // Engine Audio
            if (audioCtx && engineOsc) {
                const currentPitch = 40 + ((speed - 0.65) * 180); 
                engineOsc.frequency.setTargetAtTime(currentPitch, audioCtx.currentTime, 0.1);
            }

            // --- DAY & NIGHT CYCLE (CINEMATIC) ---
            dayTime += 0.001; 
            const sunY = Math.sin(dayTime); const sunZ = Math.cos(dayTime);
            sunLight.position.set(-30, sunY * 50, sunZ * 50);

            const colorDay = new THREE.Color(0x87CEEB); const colorSunset = new THREE.Color(0xff8c42); const colorNight = new THREE.Color(0x0a0f25);
            let skyColor = new THREE.Color();
            
            if (sunY > 0.3) {
                skyColor = colorDay; isNight = false; sunLight.intensity = 2.0; hemiLight.intensity = 0.5; ambientLight.intensity = 0.15;
            } else if (sunY > 0) {
                let lerpFactor = (0.3 - sunY) / 0.3; skyColor.lerpColors(colorDay, colorSunset, lerpFactor);
                isNight = false; sunLight.intensity = 2.0 - (lerpFactor * 1.8);
            } else if (sunY > -0.3) {
                let lerpFactor = (-sunY) / 0.3; skyColor.lerpColors(colorSunset, colorNight, lerpFactor);
                isNight = true; sunLight.intensity = 0; hemiLight.intensity = 0.1; ambientLight.intensity = 0.05;
            } else {
                skyColor = colorNight; isNight = true; sunLight.intensity = 0; 
            }
            scene.background = skyColor; scene.fog.color = skyColor;
            playerHeadLight.intensity = isNight ? 2.5 : 0;

            if(comboTimer > 0) {
                comboTimer -= delta;
                if(comboTimer <= 0) { combo = 1; document.getElementById('combo-container').style.opacity = '0'; }
            }

            // --- PERGERAKAN PLAYER (LEAN DYNAMIC) ---
            playerGroup.position.x += (playerTargetX - playerGroup.position.x) * 0.18;
            playerGroup.rotation.z = (playerGroup.position.x - playerTargetX) * -0.08;

            playerGroup.position.y += playerVelocityY;
            if (playerGroup.position.y > 0) {
                playerVelocityY += gravity; isJumping = true; playerGroup.rotation.x = -0.15;
            } else {
                if(isJumping) cameraShake = 0.3; 
                playerGroup.position.y = 0; playerVelocityY = 0; isJumping = false; playerGroup.rotation.x = 0;
            }
            
            camera.position.y = 5.5 + (playerGroup.position.y * 0.3);
            camera.position.z = 11 + (speed - 0.65) * 10; 
            if (cameraShake > 0) {
                camera.position.y += (Math.random() - 0.5) * cameraShake; camera.position.x += (Math.random() - 0.5) * cameraShake; cameraShake *= 0.9;
            }

            // --- SPAWNER ENVIRONMENT BIOME ---
            if (frameCount % 60 === 0) spawnMountain(); // Gunung selalu ada di kiri jauh
            if (frameCount % 10 === 0) {
                const side = Math.random() > 0.5 ? 1 : -1;
                const rand = Math.random(); let obj;
                
                if (currentBiome === 0) { // Hutan
                    if(rand < 0.6) obj = createPineTree(); else if(rand < 0.8) obj = createBush(); else obj = createRock();
                    obj.position.set(side * (Math.random() * 8 + 8), 0, -180);
                } else if (currentBiome === 1) { // Desa
                    if(side === -1 && rand < 0.3) obj = createVillageHouse(); 
                    else if(rand < 0.5) obj = createPineTree(); else if(rand < 0.7) obj = createFence(); else obj = createBush();
                    obj.position.set(side * (Math.random() * 8 + 8), 0, -180);
                } else { // Pantai
                    if(side === 1) { // Kanan: Pantai/Laut
                        if(rand < 0.7) obj = createPalmTree(); else obj = createRock();
                        obj.position.set(Math.random() * 10 + 10, 0, -180);
                    } else { // Kiri: Tetap hijau dikit
                        if(rand < 0.4) obj = createPalmTree(); else obj = createVillageHouse();
                        obj.position.set(-(Math.random() * 10 + 8), 0, -180);
                    }
                }
                
                obj.scale.set(0.1, 0.1, 0.1); obj.userData.targetScale = 1; scene.add(obj); scenery.push(obj);
            }
            
            if (frameCount % 45 === 0) createCloud();
            if (frameCount % 60 === 0) {
                const lightSide = Math.random() > 0.5 ? 1 : -1;
                const sLight = createStreetLight(lightSide); sLight.position.set(lightSide * 7.5, 0, -180);
                sLight.scale.set(0.1, 0.1, 0.1); sLight.userData.targetScale = 1; scene.add(sLight); scenery.push(sLight);
            }

            // Spawn Sungai saat transisi biome
            if (frameCount % 800 === 0) {
                const river = createRiverBridge(); river.position.set(0, 0, -180); scene.add(river); scenery.push(river);
            }

            // --- SPAWNER RINTANGAN & ITEM ---
            if (frameCount % 600 === 0) { 
                const train = createTrainCrossing(); train.position.set(0, 0, -180); scene.add(train); obstacles.push(train);
            } else if (frameCount % 60 === 0 && !trainEventActive) {
                let obj; const rand = Math.random();
                if (rand < 0.6) obj = createCar([0xe63946, 0x1976d2, 0xfbc02d, 0x43a047][Math.floor(Math.random()*4)]);
                else if (rand < 0.8) obj = createRamp(); 
                else obj = createOil();
                obj.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 0, -180); scene.add(obj); obstacles.push(obj);
            }
            if (frameCount % 180 === 0 && !trainEventActive && currentBiome === 1) { // Hewan hanya di Desa
                let animal = Math.random() > 0.5 ? createCow() : createSheep();
                let startSide = Math.random() > 0.5 ? 1 : -1; 
                animal.position.set(startSide * 7, 0, -180); 
                animal.rotation.y = startSide === 1 ? -Math.PI/2 : Math.PI/2; 
                animal.userData.speedX = startSide === 1 ? -0.05 : 0.05; scene.add(animal); obstacles.push(animal);
            }
            if (frameCount % 85 === 0 && !trainEventActive) {
                const pkg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0x8d6e63, flatShading: true }));
                pkg.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 1, -180); pkg.userData = {type: 'box'};
                scene.add(pkg); packages.push(pkg);
            }
            if (frameCount % 120 === 0 && !trainEventActive) {
                const lane = [-4, 0, 4][Math.floor(Math.random() * 3)];
                for(let i=0; i<3; i++){
                    const coin = createCoin(); coin.position.set(lane, 1.2, -180 - (i * 4)); scene.add(coin); packages.push(coin); 
                }
            }

            // --- ANIMASI OBJECTS & PARTICLES ---
            for (let i = 0; i < lines.length; i++) { lines[i].position.z += speed; if (lines[i].position.z > 30) lines[i].position.z -= 180; }
            
            if (frameCount % 4 === 0) {
                const smoke = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2, 0), new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.8 }));
                smoke.position.set(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z + 1.8);
                smoke.userData = { vx: (Math.random() - 0.5) * 0.03, vy: Math.random() * 0.03 + 0.02, vz: speed * 0.5 + Math.random() * 0.05, life: 1.0 };
                scene.add(smoke); smokeParticles.push(smoke);
            }
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                let p = smokeParticles[i]; p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.scale.setScalar(p.userData.life); p.material.opacity = p.userData.life; p.userData.life -= 0.03;
                if (p.userData.life <= 0) { scene.remove(p); p.geometry.dispose(); p.material.dispose(); smokeParticles.splice(i, 1); }
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.scale.setScalar(p.userData.life); p.userData.life -= 0.05;
                if (p.userData.life <= 0) { scene.remove(p); p.geometry.dispose(); p.material.dispose(); particles.splice(i, 1); }
            }

            // Gunung Parallax (Kiri Saja)
            for (let i = mountains.length - 1; i >= 0; i--) {
                mountains[i].position.z += speed * 0.15; if (mountains[i].position.z > 50) { scene.remove(mountains[i]); mountains.splice(i, 1); }
            }

            for (let i = clouds.length - 1; i >= 0; i--) {
                clouds[i].position.z += speed * 0.4; if (clouds[i].position.z > 30) { scene.remove(clouds[i]); clouds.splice(i, 1); }
            }
            
            // Scenery & Lighting Update
            for (let i = scenery.length - 1; i >= 0; i--) {
                let obj = scenery[i]; obj.position.z += speed;
                if (obj.scale.x < obj.userData.targetScale) obj.scale.addScalar(0.08); 
                
                if (obj.userData.isLight) {
                    if (isNight) { obj.userData.glowMat.opacity = 0.5; obj.userData.bulbMat.color.setHex(0xffeb3b); } 
                    else { obj.userData.glowMat.opacity = 0; obj.userData.bulbMat.color.setHex(0x222222); }
                }
                if (obj.userData.isHouse) {
                    if (isNight) { obj.userData.winMat.emissive.setHex(0xffeb3b); obj.userData.winMat.emissiveIntensity = 0.8; }
                    else { obj.userData.winMat.emissive.setHex(0x000000); }
                }

                if (obj.position.z > 30) { scene.remove(obj); scenery.splice(i, 1); }
            }

            // --- KOLEKSI (BOX & KOIN) ---
            for (let i = packages.length - 1; i >= 0; i--) {
                let pkg = packages[i];
                pkg.position.z += speed; pkg.userData.type === 'coin' ? pkg.rotation.y += 0.1 : pkg.rotation.y += 0.05;

                if (Math.abs(pkg.position.z - playerGroup.position.z) < 2.2 && Math.abs(pkg.position.x - playerGroup.position.x) < 1.5 && !isJumping) {
                    comboTimer = 2.0; 
                    const comboEl = document.getElementById('combo-container');
                    comboEl.style.opacity = '1'; comboEl.style.transform = 'scale(1.2)'; setTimeout(()=> comboEl.style.transform = 'scale(1)', 100);
                    document.getElementById('combo-text').innerText = combo;

                    if (pkg.userData.type === 'coin') {
                        let pts = 10 * combo; score += pts; showFloatingScore('+'+pts, '#FFC107'); 
                        createExplosion(pkg.position.x, pkg.position.y, pkg.position.z, 0xFFC107); playSfx('coin');
                    } else {
                        let pts = 100 * combo; packageCount++; score += pts; document.getElementById('package-count').innerText = packageCount;
                        showFloatingScore('+1📦', '#FF9800'); createExplosion(pkg.position.x, pkg.position.y, pkg.position.z, 0x8d6e63); playSfx('coin');
                    }
                    combo++; scene.remove(pkg); packages.splice(i, 1); continue;
                }
                if (pkg.position.z > 30) { scene.remove(pkg); packages.splice(i, 1); }
            }

            // --- RINTANGAN & TABRAKAN ---
            trainEventActive = false;
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;
                
                if (obs.userData.type === 'car') {
                    obs.position.z += obs.userData.driveSpeed; 
                    if (isNight) obs.userData.headLightMat.opacity = 0.4; else obs.userData.headLightMat.opacity = 0;
                } else if (obs.userData.type === 'train_crossing') {
                    trainEventActive = true; obs.userData.trainObj.position.x -= 1.2; 
                    obs.userData.flashTimer++;
                    if(obs.userData.flashTimer % 15 === 0) {
                        let color = obs.userData.warningLights[0].color.getHex() === 0x330000 ? 0xff0000 : 0x330000;
                        obs.userData.warningLights.forEach(l => l.color.setHex(color));
                    }
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 3.5 && Math.abs(obs.userData.trainObj.position.x - playerGroup.position.x) < 25) {
                        isGameOver = true; crashGame("Tertabrak Kereta!");
                    }
                } else if (obs.userData.type === 'animal') {
                    obs.position.x += obs.userData.speedX;
                    
                    // Animasi Lompat (Hopping) untuk Hewan
                    obs.position.y = Math.abs(Math.sin(frameCount * 0.2)) * 0.5;
                    obs.rotation.z = Math.sin(frameCount * 0.2) * 0.1; 
                }

                let hitDistZ = 2.8; let hitDistX = 1.8;
                if(obs.userData.type === 'animal') { hitDistZ = 1.6; hitDistX = 1.5; }

                if (Math.abs(obs.position.z - playerGroup.position.z) < hitDistZ && Math.abs(obs.position.x - playerGroup.position.x) < hitDistX) {
                    if (obs.userData.type === 'ramp' && !isJumping) {
                        playerVelocityY = 0.38; obs.userData.type = 'used'; playSfx('jump');
                    } else if (obs.userData.type === 'oil' && !isJumping) {
                        playSfx('slip');
                        let avail = [-4, 0, 4].filter(l => l !== playerTargetX);
                        playerTargetX = avail[Math.floor(Math.random() * 2)];
                        combo = 1; obs.position.y = -10;
                    } else if ((obs.userData.type === 'car' || obs.userData.type === 'animal') && playerGroup.position.y < 1.2) {
                        isGameOver = true; cameraShake = 1.0; crashGame(obs.userData.type === 'animal' ? "Aduh! Nabrak Hewan!" : "CRASH!");
                    }
                }
                if (obs.position.z > 40) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            score += Math.floor(speed * 0.5); document.getElementById('score').innerText = score; speed += 0.00015; 
            renderer.render(scene, camera);
        }

        function crashGame(msg) {
            if(engineGain) engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
            setTimeout(() => {
                alert("💥 " + msg + "\nTotal Paket: " + packageCount + "\nSkor Akhir: " + score);
                location.reload();
            }, 50);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
