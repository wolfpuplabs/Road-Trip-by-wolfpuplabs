<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ngantor - Ultimate Low Poly Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Nunito', sans-serif; 
            background-color: #87CEEB; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation; 
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI HUD */
        #ui-container { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 100; display: none; }
        #title { color: #FF9800; font-size: 42px; font-weight: 900; text-shadow: 3px 3px 0 #FFF, -2px -2px 0 #FFF, 2px -2px 0 #FFF, -2px 2px 0 #FFF, 0px 8px 10px rgba(0,0,0,0.2); margin: 0; letter-spacing: 2px; }
        .hud-card { display: inline-block; background: rgba(255, 255, 255, 0.2); padding: 8px 20px; border-radius: 30px; margin: 5px; backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,0.5); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hud-text { color: #333; font-size: 20px; font-weight: 900; text-shadow: 1px 1px 0 #fff; }
        
        /* Floating Score Effect */
        .floating-score { position: absolute; font-size: 36px; font-weight: 900; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; z-index: 500; pointer-events: none; animation: floatUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: translateX(-50%); }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; } 50% { transform: translate(-50%, -60px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -100px) scale(1); opacity: 0; } }

        /* Kontrol */
        #controls { position: absolute; bottom: 30px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 30px; z-index: 1000; }
        .btn { pointer-events: auto; width: 40vw; max-width: 160px; padding: 20px 0; font-size: 22px; font-weight: 900; background: linear-gradient(to bottom, #FFB347, #FF9800); border: 4px solid #ffffff; border-radius: 25px; color: white; cursor: pointer; text-align: center; box-shadow: 0 8px 0 #c27600, 0 15px 20px rgba(0,0,0,0.3); transition: all 0.1s ease; }
        .btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #c27600, 0 5px 10px rgba(0,0,0,0.3); }

        /* Start Screen */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #4facfe, #00f2fe); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        #start-btn { padding: 18px 60px; font-size: 32px; font-weight: 900; background: #4CAF50; border: 5px solid #fff; border-radius: 30px; color: white; cursor: pointer; box-shadow: 0 10px 0 #2E7D32, 0 15px 30px rgba(0,0,0,0.3); animation: pulse 1.5s infinite; margin-top: 30px;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3" type="audio/mpeg">
    </audio>

    <div id="start-screen">
        <h1 style="color:white; font-size: 50px; text-shadow: 4px 4px 0 #333; margin: 0; text-align: center; line-height: 1.1;">NGANTOR<br>ULTIMATE RUSH</h1>
        <button id="start-btn">PLAY NOW</button>
        <p style="color: #fff; font-size: 18px; font-weight: bold; margin-top: 25px; text-shadow: 1px 1px 2px #000; text-align: center;">Mobil melaju, Kereta HD, dan Perubahan Pemandangan!</p>
    </div>

    <div id="ui-container">
        <h1 id="title">Ngantor</h1>
        <div class="hud-card"><span class="hud-text">Skor: <span id="score" style="color:#FF5722;">0</span></span></div>
        <div class="hud-card"><span class="hud-text">📦 Paket: <span id="package-count" style="color:#4CAF50;">0</span></span></div>
    </div>
    
    <div id="controls">
        <button id="btn-left" class="btn">⬅️ KIRI</button>
        <button id="btn-right" class="btn">KANAN ➡️</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // ==========================================
        // 1. SISTEM AUDIO & SFX
        // ==========================================
        let audioCtx, engineOsc, engineGain;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bgm = document.getElementById('bgm');
            bgm.volume = 0.2; bgm.play().catch(e => console.log(e));

            engineOsc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            engineGain = audioCtx.createGain();

            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

            engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playSfx(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'coin') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'slip') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // ==========================================
        // 2. SCENE, CAMERA, LIGHTING
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.007);
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5.5, 11); camera.lookAt(0, 1, -15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; 
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.45); scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.65); scene.add(hemiLight);
        
        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024; sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 150;
        sunLight.shadow.camera.left = -25; sunLight.shadow.camera.right = 25;
        sunLight.shadow.camera.top = 40; sunLight.shadow.camera.bottom = -20;
        scene.add(sunLight);

        const moonLight = new THREE.DirectionalLight(0x88bbff, 0.0); scene.add(moonLight);

        // Ground & Road
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x8bc34a, flatShading: true, roughness: 1 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(250, 300), groundMat);
        ground.rotation.x = -Math.PI / 2; ground.position.y = 0; ground.receiveShadow = true; scene.add(ground);
        
        const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 300), new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.9 }));
        road.rotation.x = -Math.PI / 2; road.position.y = 0.02; road.receiveShadow = true; scene.add(road);

        for (let side of [-6.2, 6.2]) {
            const curb = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 300), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
            curb.position.set(side, 0.1, 0); scene.add(curb);
        }
        let lines = [];
        for (let laneX of [-2, 2]) {
            for (let z = -150; z < 50; z += 15) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 6), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
                line.rotation.x = -Math.PI / 2; line.position.set(laneX, 0.03, z); scene.add(line); lines.push(line);
            }
        }

        // ==========================================
        // 3. GENERATOR OBJEK & BIOMA (ENVIRONMENT VARIASI)
        // ==========================================
        
        // --- PARALLAX MOUNTAINS (Diperbaiki posisinya agar tidak ketengah) ---
        let mountains = [];
        function spawnMountain() {
            const mat = new THREE.MeshStandardMaterial({ color: 0x388e3c, flatShading: true });
            const height = Math.random() * 30 + 40; 
            const radius = Math.random() * 30 + 30;
            const mesh = new THREE.Mesh(new THREE.ConeGeometry(radius, height, 5), mat);
            const side = Math.random() > 0.5 ? 1 : -1;
            // X position dibuat jauh (70 hingga 120) agar tidak menabrak jalan
            mesh.position.set(side * (Math.random() * 50 + 70), height / 2 - 5, -250);
            scene.add(mesh); mountains.push(mesh);
        }
        for(let i=0; i<8; i++) { spawnMountain(); mountains[i].position.z = -150 + (i * 20); }

        let clouds = [];
        function createCloud() {
            const cloudGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
            for (let i = 0; i < 4; i++) {
                const mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 2 + 1.5, 0), mat);
                mesh.position.set(i * 1.5, Math.random() * 0.8, Math.random() * 0.8); cloudGroup.add(mesh);
            }
            const side = Math.random() > 0.5 ? 1 : -1;
            cloudGroup.position.set(side * (Math.random() * 40 + 10), Math.random() * 10 + 20, -180);
            scene.add(cloudGroup); clouds.push(cloudGroup);
        }

        // --- VARIASI POHON & BANGUNAN ---
        function createPineTree() {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 2, 5), new THREE.MeshStandardMaterial({ color: 0x5d4037, flatShading: true }));
            trunk.position.y = 1; trunk.castShadow = true; group.add(trunk);
            const mat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, flatShading: true });
            [{r: 2, h: 2.5, y: 2.2}, {r: 1.6, h: 2, y: 3.4}, {r: 1.1, h: 1.8, y: 4.4}].forEach(l => {
                const c = new THREE.Mesh(new THREE.ConeGeometry(l.r, l.h, 6), mat); c.position.y = l.y; c.castShadow = true; group.add(c);
            }); return group;
        }

        function createRoundTree() {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 2.5, 6), new THREE.MeshStandardMaterial({ color: 0x523a28, flatShading: true }));
            trunk.position.y = 1.25; trunk.castShadow = true; group.add(trunk);
            const top = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2, 0), new THREE.MeshStandardMaterial({ color: 0x52b788, flatShading: true }));
            top.position.y = 3.5; top.castShadow = true; group.add(top);
            return group;
        }

        function createPalmTree() {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 4, 5), new THREE.MeshStandardMaterial({ color: 0xc2b280, flatShading: true }));
            trunk.position.y = 2; trunk.rotation.z = 0.1; trunk.castShadow = true; group.add(trunk);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, flatShading: true });
            for(let i=0; i<5; i++) {
                const leaf = new THREE.Mesh(new THREE.ConeGeometry(1.5, 0.2, 4), leafMat);
                leaf.position.y = 4; leaf.rotation.x = Math.random(); leaf.rotation.z = Math.random(); group.add(leaf);
            }
            return group;
        }

        function createHouse() {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }));
            base.position.y = 1.5; base.castShadow = true; group.add(base);
            const roof = new THREE.Mesh(new THREE.ConeGeometry(3.5, 2, 4), new THREE.MeshStandardMaterial({ color: 0xd90429, flatShading: true }));
            roof.position.y = 4; roof.rotation.y = Math.PI/4; roof.castShadow = true; group.add(roof);
            return group;
        }

        function createBush() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x4caf50, flatShading: true });
            for (let i = 0; i < 3; i++) {
                const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7 + Math.random() * 0.4, 0), mat);
                m.position.set(i * 0.6 - 0.6, 0.5, Math.random() * 0.3); m.castShadow = true; group.add(m);
            }
            return group;
        }

        function createRock() {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.6 + Math.random() * 0.5, 0), new THREE.MeshStandardMaterial({ color: 0x78909c, flatShading: true }));
            rock.rotation.set(Math.random(), Math.random(), Math.random()); rock.position.y = 0.4; rock.castShadow = true;
            return rock;
        }

        function createWaterPlane() {
            const water = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshStandardMaterial({ color: 0x0077be, flatShading: true, transparent: true, opacity: 0.8 }));
            water.rotation.x = -Math.PI / 2; water.position.set(40, 0.05, 0); // Di sisi kanan
            return water;
        }

        // ==========================================
        // 4. RINTANGAN (Mobil, Kereta, Hewan)
        // ==========================================
        
        // Mobil dengan internal speed agar terlihat jalan
        function createCar(colorHex) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({color: colorHex, flatShading: true, roughness: 0.5});
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.4), bodyMat); body.position.set(0, 0.7, 0); body.castShadow = true; group.add(body);
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.4), bodyMat); cabin.position.set(0, 1.4, -0.2); cabin.castShadow = true; group.add(cabin);
            const glass = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.5, 2.45), new THREE.MeshStandardMaterial({color: 0x111122, roughness: 0.1})); glass.position.set(0, 1.4, -0.2); group.add(glass);
            
            const wheelMat = new THREE.MeshStandardMaterial({color: 0x111111, flatShading: true});
            for(let x of [-1.15, 1.15]) for(let z of [-1.3, 1.3]) {
                const w = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 8), wheelMat); w.rotation.z=Math.PI/2; w.position.set(x,0.4,z); w.castShadow=true; group.add(w);
            }
            const brakeMat = new THREE.MeshBasicMaterial({color: 0xff0000});
            for(let x of [-0.8, 0.8]) { const tl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), brakeMat); tl.position.set(x, 0.8, 2.21); group.add(tl); }
            
            // Kecepatan Mobil: Positif = menuju player (ngebut), Negatif = searah player (lambat)
            group.userData = { type: 'car', speedZ: (Math.random() > 0.5 ? 0.3 : -0.15) }; 
            return group;
        }

        // Desain Kereta Api 3D Diperbarui
        function createTrainCrossing() {
            const group = new THREE.Group();
            const ironMat = new THREE.MeshStandardMaterial({color: 0x888888, flatShading: true});
            const woodMat = new THREE.MeshStandardMaterial({color: 0x5c4033, flatShading: true});
            const gravelMat = new THREE.MeshStandardMaterial({color: 0x555555, flatShading: true});

            // Batu Kerikil Bawah Rel
            const gravel = new THREE.Mesh(new THREE.BoxGeometry(20, 0.06, 2.5), gravelMat);
            gravel.position.set(0, 0.03, 0); group.add(gravel);

            // Bantalan Kayu
            for(let i=0; i<15; i++){
                const wood = new THREE.Mesh(new THREE.BoxGeometry(18, 0.08, 0.3), woodMat); wood.position.set(0, 0.07, (i*0.8) - 5.6); group.add(wood);
            }
            // Rel Besi
            const rail1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 14), ironMat); rail1.position.set(-2, 0.12, 0); rail1.rotation.y = Math.PI/2; group.add(rail1);
            const rail2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 14), ironMat); rail2.position.set(2, 0.12, 0); rail2.rotation.y = Math.PI/2; group.add(rail2);

            // Palang Kereta
            const poleMat = new THREE.MeshStandardMaterial({color: 0x333333});
            const barMat = new THREE.MeshStandardMaterial({color: 0xe63946}); 
            let warningLights = [];
            
            for (let side of [-6.5, 6.5]) {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3), poleMat); pole.position.set(side, 1.5, 2); pole.castShadow = true; group.add(pole);
                const bar = new THREE.Mesh(new THREE.BoxGeometry(6, 0.25, 0.1), barMat); bar.position.set(side === -6.5 ? -3.5 : 3.5, 1.5, 2); bar.castShadow = true; group.add(bar);
                
                const wlMat = new THREE.MeshBasicMaterial({color: 0x330000});
                const wLight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.2), wlMat); wLight.position.set(side, 2.8, 2.1); group.add(wLight);
                warningLights.push(wlMat);
            }

            // Kereta (Lokomotif + Gerbong)
            const trainGroup = new THREE.Group();
            const tBody = new THREE.MeshStandardMaterial({color: 0xffb703, flatShading: true}); 
            const tRoof = new THREE.MeshStandardMaterial({color: 0x2b2d42, flatShading: true});
            
            const loco = new THREE.Mesh(new THREE.BoxGeometry(16, 3.5, 3.2), tBody); loco.position.set(0, 2.2, 0); loco.castShadow = true; trainGroup.add(loco);
            const cab = new THREE.Mesh(new THREE.BoxGeometry(6, 1.2, 3.2), tRoof); cab.position.set(-4, 4.0, 0); cab.castShadow = true; trainGroup.add(cab);
            const win = new THREE.Mesh(new THREE.BoxGeometry(14, 1.0, 3.3), new THREE.MeshStandardMaterial({color: 0x111})); win.position.set(-1, 2.8, 0); trainGroup.add(win);
            
            const car2 = loco.clone(); car2.position.set(17, 2.2, 0); trainGroup.add(car2);
            const car3 = loco.clone(); car3.position.set(34, 2.2, 0); trainGroup.add(car3);

            trainGroup.position.set(60, 0, 0); // Mulai agak jauh dari kanan
            group.add(trainGroup);

            group.userData = { type: 'train_crossing', trainObj: trainGroup, warningLights: warningLights, flashTimer: 0 }; return group;
        }

        // Hewan (Sapi & Biri-Biri)
        function createCow() {
            const group = new THREE.Group();
            const matWhite = new THREE.MeshStandardMaterial({color: 0xffffff, flatShading: true});
            const matBlack = new THREE.MeshStandardMaterial({color: 0x222222, flatShading: true});
            const matPink = new THREE.MeshStandardMaterial({color: 0xffb6c1, flatShading: true});
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 2.2), matWhite); body.position.y = 1.2; body.castShadow = true; group.add(body);
            const spot = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.8, 0.8), matBlack); spot.position.set(0, 1.2, 0.4); group.add(spot);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matWhite); head.position.set(0, 1.8, 1.2); head.castShadow = true; group.add(head);
            const snout = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.4, 0.4), matPink); snout.position.set(0, 1.6, 1.6); group.add(snout);
            for(let x of [-0.5, 0.5]) for(let z of [-0.8, 0.8]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), matBlack); leg.position.set(x, 0.4, z); leg.castShadow = true; group.add(leg);
            }
            group.userData = { type: 'animal' }; return group;
        }

        function createSheep() {
            const group = new THREE.Group();
            const matWool = new THREE.MeshStandardMaterial({color: 0xf4f4f4, flatShading: true});
            const matDark = new THREE.MeshStandardMaterial({color: 0x333333, flatShading: true});
            const wool = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.6), matWool); wool.position.y = 1.0; wool.castShadow = true; group.add(wool);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), matDark); head.position.set(0, 1.3, 0.9); head.castShadow = true; group.add(head);
            for(let x of [-0.4, 0.4]) for(let z of [-0.5, 0.5]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), matDark); leg.position.set(x, 0.3, z); leg.castShadow = true; group.add(leg);
            }
            group.userData = { type: 'animal' }; return group;
        }

        // Rintangan & Item Lainnya
        function createRamp() { const r=new THREE.Mesh(new THREE.BoxGeometry(3,0.2,4),new THREE.MeshStandardMaterial({color:0x8B4513, flatShading:true})); r.rotation.x=Math.PI/12; r.position.y=0.5; r.userData={type:'ramp'}; return r; }
        function createOil() { const o=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.05,12),new THREE.MeshBasicMaterial({color:0x111111})); o.position.y=0.05; o.userData={type:'oil'}; return o; }
        function createCoin() {
            const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.15, 12), new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.2, metalness: 0.8, flatShading: true }));
            coin.rotation.x = Math.PI / 2; coin.position.y = 1.2; coin.castShadow = true; coin.userData = { type: 'coin' }; return coin;
        }

        // ==========================================
        // 5. PLAYER, BIOME MANAGER & INIT
        // ==========================================
        let speed = 0.65; let score = 0; let packageCount = 0;
        let obstacles = []; let packages = []; let scenery = []; let smokeParticles = [];
        let playerTargetX = 0; let isGameOver = false; let gameStarted = false; let trainEventActive = false;
        
        let playerVelocityY = 0; let isJumping = false; const gravity = -0.015;
        let dayTime = Math.PI / 2; let isNight = false;

        // Biome System (0: Forest, 1: Village, 2: Beach)
        let currentBiome = 0; let biomeTimer = 0;

        let playerGroup = new THREE.Group(); scene.add(playerGroup);
        const playerAmbientLight = new THREE.PointLight(0xfffaed, 0, 8); playerAmbientLight.position.set(0, 3, 0); playerGroup.add(playerAmbientLight);

        let playerModel; let mixer; const clock = new THREE.Clock();

        const loader = new THREE.GLTFLoader();
        loader.load('Ngantor rider.glb', function(gltf) {
            playerModel = gltf.scene; playerModel.scale.set(1.1, 1.1, 1.1); playerModel.rotation.y = Math.PI;
            playerModel.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
            playerGroup.add(playerModel);
            const box = new THREE.Box3().setFromObject(playerModel);
            playerModel.position.y = -box.min.y + 0.02; 
            if (gltf.animations.length > 0) { mixer = new THREE.AnimationMixer(playerModel); mixer.clipAction(gltf.animations[0]).play(); }
        });

        // Kontrol
        function moveLeft() { if(playerTargetX > -4 && !isJumping) playerTargetX -= 4; }
        function moveRight() { if(playerTargetX < 4 && !isJumping) playerTargetX += 4; }
        window.addEventListener('keydown', (e) => { if(e.key==='ArrowLeft'||e.key==='a') moveLeft(); if(e.key==='ArrowRight'||e.key==='d') moveRight(); });
        document.getElementById('btn-left').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveLeft();});
        document.getElementById('btn-right').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveRight();});
        
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block'; document.getElementById('controls').style.display = 'flex';
            initAudio(); gameStarted = true; animate();
        });

        function showFloatingScore(text, color) {
            const floatText = document.createElement('div');
            floatText.className = 'floating-score'; floatText.innerText = text; floatText.style.color = color || '#FFD700';
            floatText.style.left = '50%'; floatText.style.top = '35%';
            document.body.appendChild(floatText); setTimeout(() => floatText.remove(), 1000);
        }

        // ==========================================
        // 6. GAME LOOP UTAMA
        // ==========================================
        let frameCount = 0;

        function animate() {
            if (isGameOver || !gameStarted) return;
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            frameCount++; biomeTimer++;
            
            // Audio RPM
            if (audioCtx && engineOsc) {
                const currentPitch = 40 + ((speed - 0.6) * 180); 
                engineOsc.frequency.setTargetAtTime(currentPitch, audioCtx.currentTime, 0.1);
            }

            // Ganti Bioma setiap 2000 frame
            if (biomeTimer > 2000) {
                currentBiome = (currentBiome + 1) % 3;
                biomeTimer = 0;
                
                // Ubah warna rumput perlahan
                const targetColor = currentBiome === 2 ? 0xe9d8a6 : (currentBiome === 1 ? 0x90be6d : 0x8bc34a);
                ground.material.color.setHex(targetColor);
            }

            // --- DAY & NIGHT CYCLE ---
            dayTime += 0.0008; // Dibuat sedikit lebih lambat
            const sunY = Math.sin(dayTime); const sunZ = Math.cos(dayTime);
            sunLight.position.set(20, sunY * 50, sunZ * 50);
            moon.position.set(0, -sunY * 150, -sunZ * 150); moon.lookAt(camera.position);

            const colorDay = new THREE.Color(0x87CEEB); const colorSunset = new THREE.Color(0xff8c42); const colorNight = new THREE.Color(0x0f172a);
            let skyColor = new THREE.Color();
            
            if (sunY > 0.3) {
                skyColor = colorDay; isNight = false; sunLight.intensity = 0.9; hemiLight.intensity = 0.65;
            } else if (sunY > 0) {
                let lerpFactor = (0.3 - sunY) / 0.3; skyColor.lerpColors(colorDay, colorSunset, lerpFactor);
                isNight = false; sunLight.intensity = 0.9 - (lerpFactor * 0.9);
            } else if (sunY > -0.3) {
                let lerpFactor = (-sunY) / 0.3; skyColor.lerpColors(colorSunset, colorNight, lerpFactor);
                isNight = true; sunLight.intensity = 0; hemiLight.intensity = 0.25; 
            } else {
                skyColor = colorNight; isNight = true; sunLight.intensity = 0; 
            }
            scene.background = skyColor; scene.fog.color = skyColor;
            playerAmbientLight.intensity = isNight ? 1.5 : 0;

            // --- PERGERAKAN PLAYER (LEAN DYNAMIC) ---
            playerGroup.position.x += (playerTargetX - playerGroup.position.x) * 0.18;
            let leanAngle = (playerGroup.position.x - playerTargetX) * -0.06;
            playerGroup.rotation.z = leanAngle; // Miring

            // Gravitasi
            playerGroup.position.y += playerVelocityY;
            if (playerGroup.position.y > 0) {
                playerVelocityY += gravity; isJumping = true; playerGroup.rotation.x = -0.1;
            } else {
                playerGroup.position.y = 0; playerVelocityY = 0; isJumping = false; playerGroup.rotation.x = 0;
            }
            camera.position.y = 5.5 + (playerGroup.position.y * 0.3);
            camera.position.x = playerGroup.position.x * 0.1; 

            // --- SPAWNERS LINGKUNGAN BERDASARKAN BIOMA ---
            if (frameCount % 60 === 0) spawnMountain();
            if (frameCount % 12 === 0) {
                const side = Math.random() > 0.5 ? 1 : -1;
                const rand = Math.random(); let obj;
                
                if (currentBiome === 0) { // Forest
                    if (rand < 0.5) obj = createPineTree(); else if (rand < 0.8) obj = createBush(); else obj = createRock();
                } else if (currentBiome === 1) { // Village
                    if (rand < 0.3) obj = createHouse(); else if (rand < 0.6) obj = createRoundTree(); else obj = createFence();
                } else { // Beach
                    if (side === 1) { // Sisi kanan pantai
                        if (rand < 0.5) obj = createPalmTree(); else obj = createWaterPlane();
                    } else {
                        if (rand < 0.5) obj = createBush(); else obj = createRock();
                    }
                }

                obj.position.set(side * (Math.random() * 10 + 8), 0, -200);
                obj.scale.set(0.1, 0.1, 0.1); obj.userData.targetScale = 1;
                scene.add(obj); scenery.push(obj);
            }
            if (frameCount % 45 === 0) createCloud();

            // --- SPAWN RINTANGAN & ITEM ---
            if (frameCount % 600 === 0) { 
                const train = createTrainCrossing(); train.position.set(0, 0, -200); scene.add(train); obstacles.push(train);
            } else if (frameCount % 55 === 0 && !trainEventActive) {
                let obj; const rand = Math.random();
                if (rand < 0.6) obj = createCar([0xe63946, 0x457b9d, 0xffb703, 0x2a9d8f][Math.floor(Math.random()*4)]);
                else if (rand < 0.8) obj = createRamp(); else obj = createOil();
                obj.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 0, -200); scene.add(obj); obstacles.push(obj);
            }
            if (frameCount % 250 === 0 && !trainEventActive && currentBiome !== 2) { // Hewan tidak di pantai
                let animal = Math.random() > 0.5 ? createCow() : createSheep();
                let startSide = Math.random() > 0.5 ? 1 : -1; 
                animal.position.set(startSide * 8, 0, -200); 
                animal.rotation.y = startSide === 1 ? -Math.PI/2 : Math.PI/2; 
                animal.userData.speedX = startSide === 1 ? -0.05 : 0.05; 
                scene.add(animal); obstacles.push(animal);
            }
            if (frameCount % 85 === 0 && !trainEventActive) {
                const pkg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xd4a373, flatShading: true }));
                pkg.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 1, -200); pkg.userData = {type: 'box'};
                scene.add(pkg); packages.push(pkg);
            }
            if (frameCount % 120 === 0 && !trainEventActive) {
                const lane = [-4, 0, 4][Math.floor(Math.random() * 3)];
                for(let i=0; i<4; i++){
                    const coin = createCoin(); coin.position.set(lane, 1.2, -200 - (i * 4)); scene.add(coin); packages.push(coin); 
                }
            }

            // --- ANIMASI GARIS JALAN & ASAP ---
            for (let i = 0; i < lines.length; i++) {
                lines[i].position.z += speed;
                if (lines[i].position.z > 30) lines[i].position.z -= 180;
            }
            if (frameCount % 4 === 0) {
                const smoke = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2, 0), new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.8 }));
                smoke.position.set(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z + 1.8);
                smoke.userData = { vx: (Math.random() - 0.5) * 0.03, vy: Math.random() * 0.03 + 0.02, vz: speed * 0.5 + Math.random() * 0.05, life: 1.0 };
                scene.add(smoke); smokeParticles.push(smoke);
            }
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                let p = smokeParticles[i];
                p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.scale.setScalar(p.userData.life); p.material.opacity = p.userData.life; p.userData.life -= 0.03;
                if (p.userData.life <= 0) { scene.remove(p); p.geometry.dispose(); p.material.dispose(); smokeParticles.splice(i, 1); }
            }

            // --- PERGERAKAN GUNUNG & SCENERY ---
            for (let i = mountains.length - 1; i >= 0; i--) {
                mountains[i].position.z += speed * 0.2; 
                if (mountains[i].position.z > 50) { scene.remove(mountains[i]); mountains.splice(i, 1); }
            }
            for (let i = clouds.length - 1; i >= 0; i--) {
                clouds[i].position.z += speed * 0.4;
                if (clouds[i].position.z > 30) { scene.remove(clouds[i]); clouds.splice(i, 1); }
            }
            for (let i = scenery.length - 1; i >= 0; i--) {
                let obj = scenery[i];
                obj.position.z += speed;
                if (obj.scale.x < obj.userData.targetScale) obj.scale.addScalar(0.08); // Efek Pop-up
                if (obj.position.z > 40) { scene.remove(obj); scenery.splice(i, 1); }
            }

            // --- AMBIL ITEM ---
            for (let i = packages.length - 1; i >= 0; i--) {
                let pkg = packages[i];
                pkg.position.z += speed; 
                pkg.userData.type === 'coin' ? pkg.rotation.y += 0.1 : pkg.rotation.y += 0.05;

                if (Math.abs(pkg.position.z - playerGroup.position.z) < 2.2 && Math.abs(pkg.position.x - playerGroup.position.x) < 1.8 && !isJumping) {
                    if (pkg.userData.type === 'coin') {
                        score += 10; showFloatingScore('+10', '#FFD700'); playSfx('coin');
                    } else {
                        packageCount++; score += 100; document.getElementById('package-count').innerText = packageCount;
                        showFloatingScore('+1📦', '#FF9800'); playSfx('coin');
                    }
                    scene.remove(pkg); packages.splice(i, 1); continue;
                }
                if (pkg.position.z > 30) { scene.remove(pkg); packages.splice(i, 1); }
            }

            // --- RINTANGAN & TABRAKAN ---
            trainEventActive = false;
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                
                // Mobil punya kecepatan sendiri agar tidak diam (bisa ngebut maju / searah)
                if (obs.userData.type === 'car') {
                    obs.position.z += speed + obs.userData.speedZ;
                } else {
                    obs.position.z += speed;
                }
                
                if (obs.userData.type === 'animal') {
                    obs.position.x += obs.userData.speedX;
                    obs.rotation.z = Math.sin(frameCount * 0.2) * 0.05; 
                } else if (obs.userData.type === 'train_crossing') {
                    trainEventActive = true; 
                    obs.userData.trainObj.position.x -= 0.8; 
                    
                    obs.userData.flashTimer++;
                    if(obs.userData.flashTimer % 15 === 0) {
                        let color = obs.userData.warningLights[0].color.getHex() === 0x330000 ? 0xff0000 : 0x330000;
                        obs.userData.warningLights.forEach(l => l.color.setHex(color));
                    }
                    
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 3.5 && Math.abs(obs.userData.trainObj.position.x - playerGroup.position.x) < 25) {
                        isGameOver = true; crashGame("Tertabrak Kereta!");
                    }
                }

                let hitDistZ = 2.8; let hitDistX = 1.8;
                if(obs.userData.type === 'animal') { hitDistZ = 1.6; hitDistX = 1.5; }

                if (Math.abs(obs.position.z - playerGroup.position.z) < hitDistZ && Math.abs(obs.position.x - playerGroup.position.x) < hitDistX) {
                    if (obs.userData.type === 'ramp' && !isJumping) {
                        playerVelocityY = 0.35; obs.userData.type = 'used';
                    } else if (obs.userData.type === 'oil' && !isJumping) {
                        playSfx('slip');
                        let avail = [-4, 0, 4].filter(l => l !== playerTargetX);
                        playerTargetX = avail[Math.floor(Math.random() * 2)];
                        obs.position.y = -10;
                    } else if ((obs.userData.type === 'car' || obs.userData.type === 'animal') && playerGroup.position.y < 1.2) {
                        isGameOver = true; crashGame(obs.userData.type === 'animal' ? "Aduh! Nabrak Hewan!" : "CRASH!");
                    }
                }
                if (obs.position.z > 40) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            score += Math.floor(speed * 0.5); document.getElementById('score').innerText = score; speed += 0.00015; 
            renderer.render(scene, camera);
        }

        function crashGame(msg) {
            if(engineGain) engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
            setTimeout(() => {
                alert("💥 " + msg + "\nTotal Paket: " + packageCount + "\nSkor Akhir: " + score);
                location.reload();
            }, 50);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
