<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngantor - Low Poly Runner</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui-container { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        #title { color: #FFB347; font-size: 40px; font-weight: 900; text-shadow: 2px 2px 0 #fff; margin: 0; }
        #score-display { color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #333; margin-top: 10px; }
        #instructions { position: absolute; bottom: 30px; width: 100%; text-align: center; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui-container">
        <h1 id="title">Ngantor</h1>
        <div id="score-display">Score: <span id="score">0</span></div>
    </div>
    <div id="instructions">⬅️ Kiri / Kanan ➡️</div>
    
    <!-- Three.js Core & GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);
        camera.lookAt(0, 0, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Ground & Road
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x7CFC00 }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 200), new THREE.MeshStandardMaterial({ color: 0x444444 }));
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        // Game Variables
        let speed = 0.6;
        let score = 0;
        let obstacles = [];
        let scenery = [];
        let playerTargetX = 0;
        let isGameOver = false;

        // Player Variables for Custom Model
        let playerModel;
        let mixer; // Untuk animasi glTF
        const clock = new THREE.Clock();

        // Memuat file player.gltf
        const loader = new THREE.GLTFLoader();
        loader.load('player.gltf', function(gltf) {
            playerModel = gltf.scene;
            
            // Atur skala dan rotasi agar sesuai menghadap ke depan
            playerModel.scale.set(1.5, 1.5, 1.5); 
            playerModel.rotation.y = Math.PI; // Putar 180 derajat jika model membelakangi jalan
            playerModel.position.set(0, 0, 0);
            
            playerModel.traverse(function(node) {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });
            scene.add(playerModel);

            // Memutar Animasi dari glTF
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(playerModel);
                const action = mixer.clipAction(gltf.animations[0]); // Animasi "rig|rig|forward|forward"
                action.play();
            }
        }, undefined, function(error) {
            console.error('Error loading model:', error);
        });

        // Kontrol
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && playerTargetX > -4) playerTargetX -= 4;
            if (e.key === 'ArrowRight' && playerTargetX < 4) playerTargetX += 4;
        });

        function spawnScenery() {
            const geo = new THREE.ConeGeometry(1.5, 4, 4);
            const mat = new THREE.MeshStandardMaterial({ color: 0x228b22, flatShading: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 2;
            const side = Math.random() > 0.5 ? 1 : -1;
            mesh.position.x = side * (Math.random() * 15 + 8);
            mesh.position.z = -120;
            scene.add(mesh);
            scenery.push(mesh);
        }

        function spawnObstacle() {
            const geo = new THREE.BoxGeometry(2.5, 2, 4);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const obstacle = new THREE.Mesh(geo, mat);
            const lanes = [-4, 0, 4];
            obstacle.position.x = lanes[Math.floor(Math.random() * lanes.length)];
            obstacle.position.y = 1;
            obstacle.position.z = -120;
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        let frameCount = 0;

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            
            // Update Animasi glTF jika model sudah dimuat
            if (mixer) mixer.update(delta);

            // Pergerakan Player Model
            if (playerModel) {
                playerModel.position.x += (playerTargetX - playerModel.position.x) * 0.15;
            }

            frameCount++;
            if (frameCount % 10 === 0) spawnScenery();
            if (frameCount % 50 === 0) spawnObstacle();

            // Gerakkan Scenery
            for (let i = scenery.length - 1; i >= 0; i--) {
                scenery[i].position.z += speed;
                if (scenery[i].position.z > 20) {
                    scene.remove(scenery[i]);
                    scenery.splice(i, 1);
                }
            }

            // Gerakkan Rintangan & Deteksi Tabrakan
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;

                if (playerModel) {
                    const distZ = Math.abs(obs.position.z - playerModel.position.z);
                    const distX = Math.abs(obs.position.x - playerModel.position.x);
                    if (distZ < 3 && distX < 2) {
                        isGameOver = true;
                        alert("Crash! Skor Akhir: " + Math.floor(score / 10));
                    }
                }

                if (obs.position.z > 20) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            score += 1;
            document.getElementById('score').innerText = Math.floor(score / 10);
            speed += 0.0002; 

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
