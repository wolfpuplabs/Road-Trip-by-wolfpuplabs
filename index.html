<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ngantor - Video Accurate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Fredoka One', cursive, sans-serif; 
            background-color: #87CEEB; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation; 
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI HUD */
        #ui-container { position: absolute; top: 20px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 100; display: none; }
        #title { color: #FFB347; font-size: 46px; font-weight: 900; text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; margin: 0; letter-spacing: 2px; }
        .hud-text { color: #fff; font-size: 28px; text-shadow: 2px 2px 0 #333; margin-top: 10px; display: block;}
        
        /* Animasi Skor Melayang */
        .floating-score { position: absolute; font-size: 36px; color: #FFD700; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; z-index: 500; pointer-events: none; animation: floatUp 1s ease-out forwards; transform: translateX(-50%); }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(1); opacity: 1; } 100% { transform: translate(-50%, -100px) scale(1.5); opacity: 0; } }

        /* Kontrol Kiri Kanan */
        #controls { position: absolute; bottom: 30px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 30px; z-index: 1000; }
        .btn { pointer-events: auto; width: 40vw; max-width: 160px; padding: 20px 0; font-size: 22px; background: rgba(255, 255, 255, 0.4); border: 4px solid #fff; border-radius: 25px; color: #333; cursor: pointer; text-align: center; backdrop-filter: blur(4px); transition: transform 0.05s ease; }
        .btn:active { transform: translateY(6px); background: rgba(255, 255, 255, 0.7); }

        /* Start Screen Overlay */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #87CEEB; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        #start-btn { padding: 15px 60px; font-size: 32px; background: #FFB347; border: 5px solid #fff; border-radius: 30px; color: white; cursor: pointer; box-shadow: 0 8px 0 #cc8400; animation: pulse 1.5s infinite; margin-top: 30px;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3" type="audio/mpeg">
    </audio>

    <div id="start-screen">
        <h1 style="color:#FFB347; font-size: 55px; text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; margin: 0; text-align: center;">Ngantor</h1>
        <button id="start-btn">Let's Play</button>
    </div>

    <div id="ui-container">
        <h1 id="title">Ngantor</h1>
        <span class="hud-text" id="score-display">0</span>
    </div>
    
    <div id="controls">
        <button id="btn-left" class="btn">⬅️ KIRI</button>
        <button id="btn-right" class="btn">KANAN ➡️</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // ==========================================
        // 1. AUDIO & SFX
        // ==========================================
        let audioCtx, engineOsc, engineGain;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bgm = document.getElementById('bgm');
            bgm.volume = 0.2; bgm.play().catch(e => console.log(e));

            // Procedural Engine Sound
            engineOsc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            engineGain = audioCtx.createGain();

            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(150, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playSfx(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'coin') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        // ==========================================
        // 2. SCENE, CAMERA, & CRISP SHADOWS
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 40, 150); // Fog diatur agar ujung jalan seolah menyatu dengan langit
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 11); camera.lookAt(0, 1, -15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Pencahayaan Siang Hari yang Kuat
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        sunLight.position.set(20, 50, 20);
        sunLight.castShadow = true;
        
        // Memperbaiki area bayangan agar meliputi seluruh jalan
        sunLight.shadow.mapSize.width = 2048; 
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5; 
        sunLight.shadow.camera.far = 150;
        sunLight.shadow.camera.left = -30; 
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 50; 
        sunLight.shadow.camera.bottom = -50;
        scene.add(sunLight);

        // Ground & Road (Posisi Y diatur akurat agar tidak menumpuk)
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x88d65c, flatShading: true }); // Hijau terang video
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 400), groundMat);
        ground.rotation.x = -Math.PI / 2; ground.position.y = 0; ground.receiveShadow = true; scene.add(ground);
        
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x5a5a5a, flatShading: true }); // Abu-abu jalan
        const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 400), roadMat);
        road.rotation.x = -Math.PI / 2; road.position.y = 0.01; road.receiveShadow = true; scene.add(road);

        // Garis Tepi Kuning
        for (let side of [-5.8, 5.8]) {
            const edgeLine = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 400), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
            edgeLine.rotation.x = -Math.PI / 2; edgeLine.position.set(side, 0.02, 0); scene.add(edgeLine);
        }

        // ==========================================
        // 3. GENERATOR OBJEK 3D (LOW POLY ACCURATE)
        // ==========================================
        // Pohon Cemara (Seperti di Video)
        function createTree() {
            const group = new THREE.Group();
            
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, flatShading: true });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.5, 6), trunkMat);
            trunk.position.y = 0.75; trunk.castShadow = true; trunk.receiveShadow = true; group.add(trunk);
            
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x228b22, flatShading: true });
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 6), leafMat);
            leaves.position.y = 3; leaves.castShadow = true; leaves.receiveShadow = true; group.add(leaves);
            
            group.userData = { type: 'scenery' };
            return group;
        }

        // Awan Kotak (Low Poly Clouds)
        let clouds = [];
        function createCloud() {
            const cloudGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
            for (let i = 0; i < 4; i++) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(2 + Math.random()*2, 1.5, 2 + Math.random()*2), mat);
                mesh.position.set(i * 1.5, Math.random() * 0.5, Math.random() * 0.5); 
                mesh.castShadow = true; cloudGroup.add(mesh);
            }
            const side = Math.random() > 0.5 ? 1 : -1;
            cloudGroup.position.set(side * (Math.random() * 30 + 10), Math.random() * 5 + 15, -200);
            scene.add(cloudGroup); clouds.push(cloudGroup);
        }

        // Mobil Rintangan (Sedan & Van Biru/Kuning/Merah)
        function createCar() {
            const group = new THREE.Group();
            const isVan = Math.random() > 0.5;
            const colors = [0x00b4d8, 0xffb703, 0xd90429, 0xffffff]; // Biru, Kuning, Merah, Putih
            const carColor = colors[Math.floor(Math.random() * colors.length)];
            const bodyMat = new THREE.MeshStandardMaterial({ color: carColor, flatShading: true });
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x222222, flatShading: true });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, flatShading: true });
            
            // Roda
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 8);
            for(let x of [-1.1, 1.1]) for(let z of [-1.2, 1.2]) {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI/2; wheel.position.set(x, 0.35, z); 
                wheel.castShadow = true; group.add(wheel);
            }

            if (isVan) {
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 4), bodyMat);
                body.position.set(0, 1.25, 0); body.castShadow = true; body.receiveShadow = true; group.add(body);
                const win = new THREE.Mesh(new THREE.BoxGeometry(2.25, 0.6, 2.5), windowMat);
                win.position.set(0, 1.5, 0.5); group.add(win);
            } else {
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4), bodyMat);
                body.position.set(0, 0.75, 0); body.castShadow = true; body.receiveShadow = true; group.add(body);
                const top = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2), bodyMat);
                top.position.set(0, 1.5, -0.2); top.castShadow = true; top.receiveShadow = true; group.add(top);
                const win = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.5, 2.05), windowMat);
                win.position.set(0, 1.5, -0.2); group.add(win);
            }

            // Lampu Rem Belakang (Hanya Merah)
            const brakeMat = new THREE.MeshBasicMaterial({color: 0xff0000});
            const brakeL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.1), brakeMat); brakeL.position.set(-0.7, 0.8, 2.01); group.add(brakeL);
            const brakeR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.1), brakeMat); brakeR.position.set(0.7, 0.8, 2.01); group.add(brakeR);

            group.userData = { type: 'car' }; return group;
        }

        // Rel Kereta & Kereta Api
        function createTrainCrossing() {
            const group = new THREE.Group();
            const ironMat = new THREE.MeshStandardMaterial({color: 0x999999, flatShading: true});
            const woodMat = new THREE.MeshStandardMaterial({color: 0x5c4033, flatShading: true});
            
            // Bantalan Kayu
            for(let i=0; i<4; i++){
                const wood = new THREE.Mesh(new THREE.BoxGeometry(14, 0.05, 0.6), woodMat);
                wood.position.set(0, 0.03, i*1.5 - 2); group.add(wood);
            }
            // Rel Besi
            const rail1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 7), ironMat); rail1.position.set(-2, 0.05, 0); group.add(rail1);
            const rail2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 7), ironMat); rail2.position.set(2, 0.05, 0); group.add(rail2);

            // Palang Kereta (Merah Putih)
            const poleMat = new THREE.MeshStandardMaterial({color: 0x333333});
            const barMat = new THREE.MeshStandardMaterial({color: 0xff3333}); // Merah
            for (let side of [-6.5, 6.5]) {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3), poleMat);
                pole.position.set(side, 1.5, 2); pole.castShadow = true; group.add(pole);
                const bar = new THREE.Mesh(new THREE.BoxGeometry(6, 0.2, 0.1), barMat);
                bar.position.set(side === -6.5 ? -3.5 : 3.5, 1.5, 2); bar.castShadow = true; group.add(bar);
            }

            // Kereta Api Modern (Putih Abu-abu)
            const trainGeo = new THREE.BoxGeometry(50, 4.5, 3);
            const trainMat = new THREE.MeshStandardMaterial({color: 0xf0f0f0, flatShading: true});
            const train = new THREE.Mesh(trainGeo, trainMat);
            train.position.set(40, 2.25, 0); // Mulai dari kanan
            train.castShadow = true; train.receiveShadow = true;
            
            const trainWindow = new THREE.Mesh(new THREE.BoxGeometry(48, 1.2, 3.1), new THREE.MeshStandardMaterial({color: 0x111111}));
            trainWindow.position.y = 0.5; train.add(trainWindow);

            group.add(train);
            group.userData = { type: 'train_crossing', trainObj: train }; return group;
        }

        // Koin Emas (+10)
        function createCoin() {
            const coin = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.6, 0.15, 16), 
                new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.2, metalness: 0.8, flatShading: true })
            );
            coin.rotation.x = Math.PI / 2; coin.position.y = 1.2; coin.castShadow = true; coin.userData = { type: 'coin' }; return coin;
        }

        // UI Efek Floating Score
        function showFloatingScore(text, color) {
            const floatText = document.createElement('div');
            floatText.className = 'floating-score'; floatText.innerText = text; floatText.style.color = color || '#FFD700';
            floatText.style.left = '50%'; floatText.style.top = '40%';
            document.body.appendChild(floatText); setTimeout(() => floatText.remove(), 1000);
        }

        // ==========================================
        // 4. GAME VARIABLES, PLAYER, SMOKE FX
        // ==========================================
        let speed = 0.7; let score = 0; 
        let obstacles = []; let items = []; let scenery = []; let roadLines = []; let smokeParticles = [];
        let playerTargetX = 0; let isGameOver = false; let gameStarted = false; let trainEventActive = false;
        
        let playerGroup = new THREE.Group(); scene.add(playerGroup);
        let playerModel; let mixer; const clock = new THREE.Clock();

        const loader = new THREE.GLTFLoader();
        loader.load('Ngantor rider.glb', function(gltf) {
            playerModel = gltf.scene; playerModel.scale.set(1.1, 1.1, 1.1); playerModel.rotation.y = Math.PI;
            playerModel.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
            playerGroup.add(playerModel);
            
            // Kalkulasi posisi Y agar roda tepat menyentuh jalan (Y=0)
            const box = new THREE.Box3().setFromObject(playerModel);
            playerModel.position.y = -box.min.y + 0.01; 
            
            if (gltf.animations.length > 0) { mixer = new THREE.AnimationMixer(playerModel); mixer.clipAction(gltf.animations[0]).play(); }
        });

        // Kontrol Kiri Kanan
        function moveLeft() { if(playerTargetX > -4) playerTargetX -= 4; }
        function moveRight() { if(playerTargetX < 4) playerTargetX += 4; }
        window.addEventListener('keydown', (e) => { if(e.key==='ArrowLeft'||e.key==='a') moveLeft(); if(e.key==='ArrowRight'||e.key==='d') moveRight(); });
        document.getElementById('btn-left').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveLeft();});
        document.getElementById('btn-right').addEventListener('pointerdown', (e)=>{e.preventDefault(); moveRight();});
        
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block'; document.getElementById('controls').style.display = 'flex';
            initAudio(); gameStarted = true; animate();
        });

        // ==========================================
        // 5. GAME LOOP UTAMA
        // ==========================================
        let frameCount = 0;

        function animate() {
            if (isGameOver || !gameStarted) return;
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            frameCount++;
            
            if (audioCtx && engineOsc) {
                const currentPitch = 40 + ((speed - 0.7) * 150); 
                engineOsc.frequency.setTargetAtTime(currentPitch, audioCtx.currentTime, 0.1);
            }

            // Pergerakan Motor Mulus & Miring saat Belok
            playerGroup.position.x += (playerTargetX - playerGroup.position.x) * 0.2;
            playerGroup.rotation.z = (playerGroup.position.x - playerTargetX) * -0.05;

            // --- SPAWNER LINGKUNGAN ---
            if (frameCount % 10 === 0) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                line.rotation.x = -Math.PI / 2; line.position.set(0, 0.03, -180); scene.add(line); roadLines.push(line);
            }
            if (frameCount % 15 === 0) {
                const tree = createTree(); tree.position.set((Math.random() > 0.5 ? 1 : -1) * (Math.random() * 8 + 8), 0, -180); 
                scene.add(tree); scenery.push(tree);
            }
            if (frameCount % 60 === 0) createCloud();

            // --- SPAWNER RINTANGAN & ITEM ---
            if (frameCount % 500 === 0) { // Kereta Api Muncul
                const train = createTrainCrossing(); train.position.set(0, 0, -180); scene.add(train); obstacles.push(train);
            } else if (frameCount % 70 === 0 && !trainEventActive) {
                const car = createCar(); car.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 0, -180); scene.add(car); obstacles.push(car);
            }
            if (frameCount % 120 === 0 && !trainEventActive) {
                const lane = [-4, 0, 4][Math.floor(Math.random() * 3)];
                for(let i=0; i<4; i++){
                    const coin = createCoin(); coin.position.set(lane, 1.2, -180 - (i * 4)); scene.add(coin); items.push(coin); 
                }
            }

            // --- ANIMASI GARIS JALAN & ASAP ---
            for (let i = roadLines.length - 1; i >= 0; i--) {
                roadLines[i].position.z += speed;
                if (roadLines[i].position.z > 20) { scene.remove(roadLines[i]); roadLines.splice(i, 1); }
            }
            
            if (frameCount % 3 === 0) {
                const smoke = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.8 }));
                smoke.position.set(playerGroup.position.x, 0.5, playerGroup.position.z + 1.8);
                smoke.userData = { vx: (Math.random() - 0.5) * 0.05, vy: Math.random() * 0.05 + 0.02, vz: speed * 0.4, life: 1.0 };
                scene.add(smoke); smokeParticles.push(smoke);
            }
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                let p = smokeParticles[i];
                p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.scale.setScalar(p.userData.life); p.material.opacity = p.userData.life; p.userData.life -= 0.04;
                if (p.userData.life <= 0) { scene.remove(p); p.geometry.dispose(); p.material.dispose(); smokeParticles.splice(i, 1); }
            }

            // --- PERGERAKAN SCENERY ---
            for (let i = clouds.length - 1; i >= 0; i--) {
                clouds[i].position.z += speed * 0.4;
                if (clouds[i].position.z > 30) { scene.remove(clouds[i]); clouds.splice(i, 1); }
            }
            for (let i = scenery.length - 1; i >= 0; i--) {
                scenery[i].position.z += speed;
                if (scenery[i].position.z > 30) { scene.remove(scenery[i]); scenery.splice(i, 1); }
            }

            // --- AMBIL KOIN ---
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.position.z += speed; item.rotation.y += 0.1;

                if (Math.abs(item.position.z - playerGroup.position.z) < 2.0 && Math.abs(item.position.x - playerGroup.position.x) < 1.5) {
                    score += 10; showFloatingScore('+10'); playSfx('coin');
                    scene.remove(item); items.splice(i, 1); continue;
                }
                if (item.position.z > 30) { scene.remove(item); items.splice(i, 1); }
            }

            // --- RINTANGAN & TABRAKAN ---
            trainEventActive = false;
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;
                
                if (obs.userData.type === 'train_crossing') {
                    trainEventActive = true; 
                    obs.userData.trainObj.position.x -= 0.7; // Kereta lewat ke kiri
                    
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 3.5 && Math.abs(obs.userData.trainObj.position.x - playerGroup.position.x) < 25) {
                        isGameOver = true; crashGame("Tertabrak Kereta!");
                    }
                } else if (obs.userData.type === 'car') {
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 3.0 && Math.abs(obs.position.x - playerGroup.position.x) < 1.8) {
                        isGameOver = true; crashGame("CRASH!");
                    }
                }
                
                if (obs.position.z > 40) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            score += Math.floor(speed * 0.5); document.getElementById('score-display').innerText = score; speed += 0.0001; 
            renderer.render(scene, camera);
        }

        function crashGame(msg) {
            if(engineGain) engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
            setTimeout(() => {
                alert("💥 " + msg + "\nSkor Akhir: " + score);
                location.reload();
            }, 50);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
